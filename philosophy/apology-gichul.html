const K = 'apology-gichul-key';
const u8 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function derive(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: u8(P.s), iterations: P.n }, base, 256));
}
async function open_(raw) {
  const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  const gz = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8(P.i) }, key, u8(P.c));
  const html = await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  document.open(); document.write(html); document.close();
}
const msg = document.getElementById('msg');
(async () => {
  let saved = null;
  try { saved = localStorage.getItem(K); } catch (e) {}
  if (saved) {
    try { msg.style.color = '#b9c8e6'; msg.textContent = '여는 중…'; await open_(u8(saved)); return; }
    catch (e) { try { localStorage.removeItem(K); } catch (_) {} msg.textContent = ''; }
  }
})();
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const pw = document.getElementById('pw').value;
  if (!pw) return;
  msg.style.color = '#b9c8e6'; msg.textContent = '여는 중…';
  try {
    const raw = await derive(pw);
    const keep = document.getElementById('rem').checked;
    await (async () => {
      const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
      await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8(P.i) }, key, u8(P.c));
    })();
    if (keep) { try { localStorage.setItem(K, btoa(String.fromCharCode(...raw))); } catch (_) {} }
    await open_(raw);
  } catch (err) {
    msg.style.color = '#ffb4b4';
    msg.textContent = err && err.name === 'OperationError' ? '비밀번호가 틀렸어요' : '이 브라우저에서는 열 수 없어요 (' + (err && err.message || err) + ')';
  }
});
