<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>방법서설 문제은행</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 레이아웃: 한 문제씩 넘기는 시험지 카드 + 위쪽 문항 번호 줄. 남색 잉크 + 종이빛 바탕 */
:root{
  --bg:#f5f6f9; --paper:#ffffff; --ink:#1c2333; --muted:#5d6880; --line:#d9deea;
  --navy:#1f3a68; --navy-soft:#e7ecf6; --gold:#d79a1e;
  --ok:#1f7a4a; --ok-soft:#e3f3ea; --bad:#b33a3a; --bad-soft:#f8e6e6;
  --serif:'Gowun Batang','Noto Serif KR',serif; --sans:'IBM Plex Sans KR','Noto Sans KR',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11151d; --paper:#1a202b; --ink:#e6e9f0; --muted:#9aa4b8; --line:#2c3444;
  --navy:#8fb0e8; --navy-soft:#22304a; --gold:#e8b445;
  --ok:#5cc88d; --ok-soft:#173326; --bad:#ef7d7d; --bad-soft:#3a1f22; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151d; --paper:#1a202b; --ink:#e6e9f0; --muted:#9aa4b8; --line:#2c3444;
  --navy:#8fb0e8; --navy-soft:#22304a; --gold:#e8b445;
  --ok:#5cc88d; --ok-soft:#173326; --bad:#ef7d7d; --bad-soft:#3a1f22; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1{font-family:var(--serif);font-size:28px;margin:0;color:var(--navy);text-wrap:balance}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:600}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--navy);padding-bottom:10px;margin-bottom:18px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--paper)}
.seg button{border:0;background:none;padding:6px 14px;border-radius:999px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--paper);font-weight:600}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}
.sets{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:16px}
.set{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.set:hover{border-color:var(--navy)}
.set .k{font-size:12px;font-weight:700;color:var(--navy);letter-spacing:.04em}
.set .n{font-family:var(--serif);font-size:19px;font-weight:700}
.set .m{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.set .best{color:var(--ok);font-weight:600}
h2{font-size:14px;color:var(--muted);margin:26px 0 0;font-weight:600;letter-spacing:.04em}
.parts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--navy-soft);border-color:var(--navy);color:var(--navy);font-weight:600}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.btn{border:1px solid var(--navy);background:var(--navy);color:var(--paper);border-radius:8px;padding:10px 16px;font-weight:600}
.btn.ghost{background:var(--paper);color:var(--navy)}
.btn:disabled{opacity:.4;cursor:not-allowed}
/* 문제 화면 */
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.bar .ttl{font-weight:700;color:var(--navy)}
.bar .meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 16px}
.dot{width:32px;height:32px;border-radius:7px;border:1px solid var(--line);background:var(--paper);font-size:13px;font-variant-numeric:tabular-nums}
.dot.cur{border:2px solid var(--navy)}
.dot.done{background:var(--navy-soft)}
.dot.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.dot.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:20px}
.qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{background:var(--navy);color:var(--paper);font-weight:700;font-size:13px;padding:3px 10px;border-radius:4px}
.star{color:var(--gold);letter-spacing:1px;font-size:13px}
.star i{color:var(--line);font-style:normal}
.tag{font-size:12px;border:1px solid var(--line);border-radius:4px;padding:0 6px;color:var(--muted)}
.qt{font-family:var(--serif);font-size:18px;line-height:1.65;margin:12px 0}
.qt u{text-decoration-thickness:2px;text-underline-offset:3px}
.box{border:1.5px solid var(--navy);background:var(--navy-soft);padding:10px 14px;border-radius:6px;font-family:var(--serif);font-size:15.5px;line-height:1.75;margin:0 0 12px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:11px 12px;font-family:var(--serif);font-size:16px;line-height:1.55}
.opt .no{font-family:var(--sans);font-weight:700;color:var(--navy);flex:none}
.opt:hover{border-color:var(--navy)}
.opt.sel{border:2px solid var(--navy);background:var(--navy-soft)}
.opt.right{border:2px solid var(--ok);background:var(--ok-soft)}
.opt.wrong{border:2px solid var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.fb{margin-top:16px;border-top:1px dashed var(--line);padding-top:14px}
.verdict{font-weight:700;font-size:15px}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.ex{background:var(--bg);border-left:4px solid var(--navy);padding:10px 12px;border-radius:0 6px 6px 0;margin-top:8px;font-size:14.5px}
.wr{font-size:14px;color:var(--muted);margin-top:8px}
.wr b.l{color:var(--bad)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}
/* 결과 */
.score{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.score .big{font-family:var(--serif);font-size:48px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums}
.score .of{color:var(--muted)}
.byPart{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:14px}
.bp{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--paper);font-size:13px}
.bp b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;gap:6px;margin-top:16px}
.li{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:10px 12px}
.li .mk{flex:none;font-weight:700;width:22px}
.li .mk.ok{color:var(--ok)} .li .mk.bad{color:var(--bad)}
.li .tx{min-width:0;font-size:14px}
.li .tx small{display:block;color:var(--muted)}
.empty{color:var(--muted);background:var(--paper);border:1px dashed var(--line);border-radius:10px;padding:16px;margin-top:10px;font-size:14px}
@media (prefers-reduced-motion:no-preference){.opt,.dot,.set{transition:border-color .15s,background .15s}}
@media (max-width:480px){.qt{font-size:17px}.opt{font-size:15px}h1{font-size:24px}}
</style>

<script>window.__DATA__=[{"id": "quiz1", "title": "고전읽기 점검퀴즈 1", "kind": "기출", "range": "1~3부", "qs": [{"q": "기존 학문으로서 웅변과 시에 대한 데카르트의 태도와 설명으로 맞는 것은?", "box": null, "o": ["데카르트는 어렸을 때부터 웅변과 시를 경멸했다.", "웅변과 시는 연구의 결실이다.", "웅변과 시는 정신의 타고난 재능의 산물이다.", "웅변과 시는 인간의 이성으로 습득할 수 있는 분야이기 때문에 학문의 기초 역할을 한다."], "a": [3], "s": 1, "part": "1부", "e": "1부에서 데카르트는 웅변과 시를 높이 평가하고 좋아했지만, 이 둘은 <b>연구의 결실이라기보다 정신의 타고난 재능<\/b>이라고 말한다. 이성을 가장 잘 쓰는 사람은 수사학을 배우지 않아도 남을 설득한다는 것이다.", "w": "① 경멸한 것이 아니라 '높이 평가하고 사랑했다'. ② 연구의 결실이 아니라고 명시. ④ 학문의 기초 역할을 한다는 언급은 없다."}, {"q": "'확실한 인식'에 관한 데카르트의 생각이라고 할 수 <u>없는<\/u> 것은?", "box": null, "o": ["데카르트는 전통적인 학문과 관습들을 모두 비판하고, 이들 중 어느 것에서도 확실한 인식은 존재하지 않는다고 생각했다.", "데카르트는 확실한 인식이 불가능하다고 생각했다.", "데카르트는 인간이 확실한 인식에 도달하는 능력을 가지고 있다고 생각했다.", "데카르트는 인간이 확실한 인식에 도달하지 못하거나 오류에 빠지는 것은 이성을 올바로 사용하지 않기 때문이라고 생각했다."], "a": [2], "s": 1, "part": "1부", "e": "데카르트는 회의주의자가 아니다. 기존 학문에서 확실성을 찾지 못했을 뿐, 인간에게는 확실한 인식에 이를 능력(양식·이성)이 있고 <b>방법<\/b>을 따르면 도달할 수 있다고 본다. 따라서 '확실한 인식이 불가능하다'는 그의 생각이 아니다.", "w": "① 학교 학문·관습 비판은 1부 내용. ③④ 오류의 원인은 능력의 부족이 아니라 이성을 잘못 사용하는 데 있다(양식은 고루 분배됨)."}, {"q": "빈 칸에 들어갈 말로 가장 알맞은 것은?", "box": "“(　　)은 세상에서 가장 잘 분배되어 있다. 실제로 누구나 자신이 (　　)을 아주 잘 갖추고 있다고 생각한다. 그래서 다른 모든 것에서 쉽사리 만족하지 못하는 사람들조차 (　　)만큼은 자신이 가진 것보다 더 많은 것을 바라지 않곤 한다. 이 점에 있어 모두의 생각은 잘못되지 않았다. 오히려 이것은 잘 판단하고 참과 거짓을 구분하는 능력, 즉 사람들이 올바르게 (　　) 혹은 이성이라 부르는 능력이 모든 인간에게 자연적으로 동등하다는 사실을 보여준다.”", "o": ["직관력", "지혜", "양식", "상상력"], "a": [3], "s": 1, "part": "1부", "e": "『방법서설』의 첫 문장. 프랑스어 <b>bon sens(양식, 良識)<\/b>은 '잘 판단하고 참과 거짓을 구분하는 능력'으로, 데카르트는 이를 이성과 같은 것으로 본다. 차이는 능력의 크기가 아니라 <b>그것을 어떻게 사용하느냐(방법)<\/b>에서 생긴다.", "w": null}, {"q": "『방법서설』 1부에서, 데카르트는 학문의 확실성을 찾아 헤매는 자신의 인생 여정을 소개한다. 그 여정의 순서를 맞게 배열한 것은?", "box": null, "o": ["초등학교의 글공부 → 대학교의 학문 → 대학원의 전문 연구", "학교의 글공부 → 세상이라는 책 → 나 자신", "나 자신 → 가까운 이웃 사람들 → 세상이라는 책", "세상이라는 책 → 나 자신 → 학교의 스승"], "a": [2], "s": 1, "part": "1부", "e": "라 플레슈 학교에서 글공부를 마친 뒤 실망한 데카르트는 학교를 떠나 여행·군대 생활 등 <b>'세상이라는 큰 책'<\/b>을 공부한다. 그러나 여기서도 관습의 다양성만 확인하고, 마침내 <b>나 자신 안에서<\/b> 연구하기로 결심한다.", "w": null}, {"q": "무질서한 도시의 건물을 다시 짓기 위해 모든 건물을 부숴 버리는 작업을 도시와 정신에 적용해서 시행하는 데에 대한 데카르트의 생각으로 올바르지 <u>못한<\/u> 것은?", "box": null, "o": ["여러 도시의 조직이나 같은 학문의 조직을 한꺼번에 뒤집어엎었다가 새로 세우는 일은 한 개인이 계획할 만한 규모가 아니다.", "내 정신 속에 받아들인 여러 의견이나 신념들을 단 한 번에 뒤집어엎고 이성의 기준에 의해 모든 앎을 새롭게 구축하는 일은 도시 전체를 개혁하는 일에 비견할 만큼 어렵다.", "무질서한 도시의 건물들이 가진 불완전성이 관습에 의해 그 불완전의 정도가 완화되어 있기에 그것의 불완전성이 도시 전체를 깨부수어 얻으려는 변혁보다 훨씬 용이한 가치를 지닌다.", "우후죽순 들어선 무질서한 건물들을 다 부수어버리고 도시나 법규를 온전히 새로이 세우는 방식은 상당히 어렵고 부담하다."], "a": [2], "s": 2, "part": "2부", "e": "2부의 핵심 대비: <b>국가·공공의 학문 체계<\/b>를 한꺼번에 뒤엎는 것은 개인이 할 일이 아니고 위험하지만, <b>자기 자신의 의견<\/b>에 대해서는 '한 번 모두 제거하고 이성의 기준으로 다시 세우는 것이 최선'이라고 결심한다. ②는 이 둘을 동일시하므로 틀렸다.", "w": "③ 공공 제도의 불완전함은 관습으로 무뎌져 있어, 뒤엎는 변혁보다 견디기 쉽다는 취지 — 데카르트의 생각과 일치."}, {"q": "『방법서설』 2부에서 데카르트는 모든 것의 인식에 이르기 위한 참된 방법으로 네 가지를 제시한다. 이 방법이 <u>아닌<\/u> 것은?", "box": null, "o": ["명증하게 참이라고 인식하지 않은 어떠한 것도 결코 참으로 받아들이지 않는다.", "어려운 문제에 직면했을 때, 그것을 가장 잘 해결하기 위해 요구되는 만큼 작은 부분으로 나누어 시도한다.", "가장 단순하고 가장 쉽게 인식되는 대상들에서 시작해 조금씩, 단계적으로, 가장 복합된 대상들의 인식으로 나아간다.", "아무것도 빠뜨리지 않았다고 확신할 정도로 완전한 열거와 전반적인 점검을 어디서나 한다."], "a": [5], "s": 1, "part": "2부", "e": "①~④는 각각 네 규칙 그대로다.<br>① <b>명증성<\/b>의 규칙 ② <b>분석<\/b>의 규칙 ③ <b>종합(순서)<\/b>의 규칙 ④ <b>열거(점검)<\/b>의 규칙<br>모두 방법에 해당하므로 정답은 ⑤.", "w": null}, {"q": "다음은 『방법서설』 2부에 나오는 구절이다. (　) 안에 들어갈 말은 무엇인가?", "box": "또한 우리는 모두 어른이 되기 전에 아이였고 우리의 ( ㉠ )에 의해, 그리고 서로 자주 대립하고 그들 중 누구도 우리에게 항상 최선의 것을 권고하지 않았던 스승들에 의해 오랫동안 지도받아야 했기 때문에 우리의 판단이 태어나서부터 ( ㉡ )를 전적으로 사용하고 ( ㉡ )에 의해서만 인도되었더라면 가졌을 순수함과 견고함을 결여하고 있다고 생각했다.", "o": ["㉠관심, ㉡감정", "㉠욕구, ㉡이성", "㉠관심, ㉡경험", "㉠경험, ㉡이성"], "a": [2], "s": 2, "part": "2부", "e": "어린 시절 우리를 이끈 것은 <b>욕구(appétits)<\/b>와 스승들이었기 때문에, 처음부터 <b>이성<\/b>만 썼을 경우만큼 판단이 순수하고 견고하지 못하다는 것. 그래서 기존 의견을 한 번 비우고 이성으로 다시 세워야 한다는 논리로 이어진다.", "w": null}, {"q": "3부 말미에서 데카르트가 “여기”, 곧 네덜란드로 이주하기로 마음먹은 이유는 무엇인가?", "box": null, "o": ["네덜란드 여왕으로부터 철학교사 자리를 제안받아서", "데카르트 자신의 철학적 기획이 호사가들의 입에 오르내리는 것을 피하고 철학적 탐구에 매진하기 위해", "네덜란드 레이든 대학의 철학 교수직을 제안받아서", "데카르트의 친한 친구였던 메르센 신부와의 공동연구를 위해서"], "a": [2], "s": 2, "part": "3부", "e": "자신이 이미 철학을 완성했다는 소문이 돌자, 그 평판에 걸맞은 사람이 되기 위해 <b>지인들이 있을 만한 곳을 떠나<\/b> 네덜란드로 물러난다. 그곳은 오랜 전쟁으로 질서가 잡혀 있고, 사람들은 자기 일에만 몰두해 <b>군중 속에서도 고독하게<\/b> 살 수 있는 곳이었다.", "w": "① 여왕의 초청은 훗날 스웨덴(크리스티나 여왕)의 일. ③④ 본문에 없는 내용."}, {"q": "『방법서설』 3부의 임시 도덕 중 첫째 도덕에 대한 설명으로 적절하지 <u>않은<\/u> 것을 고르시오.", "box": null, "o": ["대개 지나친 의견들은 나쁘다. 특히 사람들의 자유에서 무엇이든 빼앗아가는 모든 약속은 지나치다고 할 수 있으므로, 사람을 구속하는 약속, 맹세, 계약들을 허용하는 법들은 나쁘다.", "내 나라의 법과 관습에 복종하고, 종교를 확고하게 견지한다.", "내가 함께 살아가야 할 이들 가운데 가장 분별 있는 이들이 실천에서 보통 받아들이는 가장 온건한 의견들을 따르면서 나를 다스리자.", "분별 있는 자들이 말한 것들보다는 오히려 그들이 실천한 것에 유의해야 한다."], "a": [1], "s": 3, "part": "3부", "e": "데카르트는 자유를 빼앗는 약속을 '지나친 것'으로 여겨 스스로 피했지만, <b>그렇다고 약속·맹세·계약을 허용하는 법을 비난하는 것은 아니라고<\/b> 분명히 밝힌다(약한 정신의 변덕을 막거나 상거래 안전을 위해 필요). 법이 나쁘다고 단정한 ①이 틀렸다.", "w": "②③④는 첫째 준칙의 내용 그대로. 앞부분(지나친 의견은 나쁘다)은 맞고 결론만 틀린 '반쪽 함정'에 주의."}, {"q": "『방법서설』 3부의 임시 도덕과 관련된 사례이다. 어떤 숲에서 길을 잃었을 때 어떻게 해야 하는가? 데카르트의 견해와 가장 거리가 <u>먼<\/u> 것을 고르시오.", "box": null, "o": ["이쪽저쪽 맴돌면서 헤매서는 안 된다.", "한자리에 머물러서는 안 된다.", "늘 같은 방향으로 가장 곧장 걸어가야 한다.", "처음에 선택한 그 방향이 어쩌면 그저 우연이었을 뿐이라 해도, 약한 이유들로 인해 그것을 바꾸어서는 안 된다."], "a": [5], "s": 2, "part": "3부", "e": "둘째 준칙(<b>결단성<\/b>)의 비유. 길 잃은 여행자는 ① 이리저리 헤매지도 ② 한곳에 머물지도 말고 ③ 한 방향으로 곧장 걸어야 하며 ④ 처음 선택이 우연이었더라도 약한 이유로 바꾸지 말아야 한다. 그러면 원하는 곳은 아니더라도 숲 한가운데보다는 나은 곳에 도착한다. ①~④ 모두 데카르트의 견해이므로 ⑤.", "w": null}]}, {"id": "quiz2", "title": "고전읽기 점검퀴즈 2", "kind": "기출", "range": "4~5부", "qs": [{"q": "『방법서설』 4부에서 데카르트가 형이상학적 토대를 찾기 위해 먼저 한 일은 무엇인가?", "box": null, "o": ["진리임이 불확실한 것은 일단 거짓으로 간주한다.", "거짓임이 확실한 것만을 제거한다.", "진리임이 불확실한 것도 일단 참으로 받아들인다.", "진리임이 개연적으로 확실한 것을 먼저 찾는다."], "a": [1], "s": 1, "part": "4부", "e": "<b>방법적 회의<\/b>: 조금이라도 의심할 수 있는 것은 모두 <b>절대적으로 거짓인 것처럼<\/b> 내던진다. 그 뒤에도 남는 것이 있는지 보기 위해서다. (실천의 영역인 3부와 달리, 진리 탐구에서는 개연적인 것에 머물지 않는다.)", "w": null}, {"q": "『방법서설』 4부에서 데카르트가 전적으로 의심할 수 없는 것으로 간주한 것은 무엇인가?", "box": null, "o": ["감각으로부터 알려진 것", "의심하는 나는 필연적으로 존재한다는 것", "사각형은 네 개의 변을 갖는다는 것", "꿈의 환상들"], "a": [2], "s": 1, "part": "4부", "e": "감각은 우리를 속이므로(①), 기하학 증명에서도 사람은 오류를 범하므로(③), 깨어 있을 때의 생각도 꿈과 다를 바 없을 수 있으므로(④) 모두 버린다. 그러나 이렇게 모든 것을 거짓이라 생각하는 동안에도 <b>그렇게 생각하는 나는 반드시 무엇이어야 한다<\/b> — '나는 생각한다, 그러므로 나는 존재한다'.", "w": null}, {"q": "(a)와 (b)에 들어갈 말을 알맞게 짝지은 것은?", "box": "그러므로 이 나, 즉 나를 나로 만들어주는 (a)은/는 (b)와/과 전적으로 구분되며 육체보다 더 쉽게 인식된다. 그리고 (b)이/가 전혀 존재하지 않는다고 하더라도 (a)은/는 계속해서 자신으로 존재한다.", "o": ["(a) 영혼, (b) 환경", "(a) 몸, (b) 신", "(a) 마음, (b) 기계", "(a) 영혼, (b) 물체"], "a": [4], "s": 2, "part": "4부", "e": "나는 '그 본질 또는 본성이 오직 생각하는 것'인 실체이며, 존재하기 위해 어떤 장소도 물질적 사물도 필요로 하지 않는다. 따라서 나를 나이게 하는 <b>영혼<\/b>은 <b>물체(corps)<\/b>와 전적으로 구분된다 — <b>심신 이원론<\/b>의 출발점.", "w": null}, {"q": "『방법서설』 4부에서 데카르트는 기하학자들의 방식을 참고하여 신의 존재를 증명하려 한다. 관련된 설명으로 옳은 것은 무엇인가?", "box": null, "o": ["내각의 합이 180도라는 것이 삼각형의 관념 안에 포함되어 있듯이, 신의 현존은 신의 관념 안에 포함되어 있다.", "기하학자들의 증명 안에는 그 기하학적 대상의 현존에 대해 데카르트를 확신시켜 주는 것이 포함되어 있었다.", "완전한 존재자인 신이 존재한다는 것은 확실하지만, 그 확실성은 기하학적 증명의 확실성을 뛰어넘지는 못한다.", "이러한 증명은 인과론적 증명 또는 후험적 증명이라고 불리게 된다."], "a": [1], "s": 3, "part": "4부", "e": "<b>존재론적 증명<\/b>: 삼각형의 관념에 내각의 합이 두 직각이라는 것이 포함되듯, 완전한 존재자의 관념에는 <b>현존<\/b>이 포함되어 있다.", "w": "② 기하학 증명에는 대상이 실제로 존재한다는 것을 보장해 주는 것이 <b>전혀 없었다<\/b>. ③ 신의 존재는 기하학 증명만큼, <b>적어도 그만큼<\/b> 확실하다. ④ 관념의 분석만으로 증명하므로 <b>선험적<\/b> 증명(존재론적 증명)이다. 인과론적 증명은 4부의 다른 증명(불완전한 내가 완전성의 관념을 가진 원인)."}, {"q": "데카르트에 따를 때, 신의 현존이 전제되지 않을 때 일어나게 되는 일로 옳은 것은 무엇인가?", "box": null, "o": ["우리가 아주 명석하고 판명하게 인식하는 것은 모두 참이라는 규칙이 확실하게 된다.", "꿈속에서 떠오르는 사유들이 다른 사유들 못지않게 생생하고 명확하다는 의심을 제거하기에 충분한 근거를 내놓을 수 없게 된다.", "우리가 자면서 상상하는 몽상들이 우리가 깨어서 가지는 사유들의 참됨을 결코 의심하게 할 수 없음을 인식하기 어렵게 된다.", "신앙의 토대가 무너져 사회가 혼란스러워지고 범죄가 창궐하게 된다."], "a": [2, 3], "s": 3, "part": "4부", "e": "데카르트는 '아무리 뛰어난 정신들이 연구하더라도 <b>신의 현존을 전제하지 않는다면<\/b>, 꿈의 사유와 깨어 있는 사유에 관한 의심을 제거할 충분한 근거를 줄 수 없다'고 말한다(②). 신을 알고 나면 <b>자면서 하는 몽상이 깨어 있을 때 사유의 참됨을 의심하게 할 수 없다<\/b>는 것도 인식하게 되는데, 신을 전제하지 않으면 바로 이것을 인식하기 어렵다(③). 둘 다 같은 내용을 다른 쪽에서 말한 것이라 <b>복수 정답<\/b>으로 인정되었다.", "w": "① 반대: 명석판명 규칙 자체가 <b>신이 존재하기 때문에<\/b> 확실하다. ④ 본문에 없는 사회적 결과."}, {"q": "『방법서설』 4부에서 데카르트가 철학의 제1원리로 받아들인 것은 무엇인가?", "box": null, "o": ["신의 현존의 확실성", "사유하는 내 존재의 확실성", "감각적이고 물체적인 사물 관념의 명증성", "영혼 존재의 확실성"], "a": [2], "s": 1, "part": "4부", "e": "'나는 생각한다, 그러므로 나는 존재한다'는 회의주의자들의 어떤 터무니없는 가정으로도 흔들 수 없으므로, 데카르트는 이를 <b>내가 찾던 철학의 제1원리<\/b>로 주저 없이 받아들인다. 신의 존재는 이 원리 <b>다음에<\/b> 증명된다.", "w": null}, {"q": "『방법서설』 5부에서 데카르트는 인간과 동물의 특징과 차이에 관해서 설명한다. 다음 중 데카르트의 견해라고 할 수 <u>없는<\/u> 것을 고르시오.", "box": null, "o": ["동물의 신체는 일종의 자동기계로, 각 기관들의 기능적 배치에 의해서 작동된다.", "인간은 말로 다양한 의미를 구성할 수 있는 반면, 동물은 이러한 기능을 할 수 없다.", "인간의 영혼은 신체로부터 끌어내어지거나 그것에 의존하는 성질의 것이 아니다.", "인간의 정신과 이성이 자동기계로서의 신체를 넘어서며 그를 동물과 구분 짓게 한다."], "a": [5], "s": 2, "part": "5부", "e": "① <b>동물 기계론<\/b>(동물은 기관의 배치로 움직이는 자동기계) ② 말의 다양한 배열로 생각을 표현하는 능력은 인간만의 것 ③ 이성적 영혼은 물질의 힘에서 끌어낼 수 없고 신체에 의존하지 않음 ④ 이성은 '모든 상황에 쓰일 수 있는 보편적 도구'로 신체 기관을 넘어선다. 모두 데카르트의 견해이므로 ⑤.", "w": null}, {"q": "『방법서설』 5부에서 인간과 인간을 모방하는 기계를 구별할 수 있는 첫 번째 수단에 대한 설명에 해당하는 것은 무엇인가?", "box": null, "o": ["이 기계들은 인간의 말들을 사용할 수 없다.", "이 기계들은 인간의 신체를 닮을 수 없다.", "이 기계들은 인간의 동작을 따라할 수 없다.", "이 기계들은 인간의 외형을 가질 수 없다."], "a": [1], "s": 1, "part": "5부", "e": "첫째 수단: 기계는 우리처럼 <b>말이나 기호를 조합해<\/b> 생각을 남에게 표현할 수 없다(몇 마디를 내뱉을 수는 있어도 앞에서 하는 말에 맞게 응답하지 못함).<br>둘째 수단: 기계는 <b>인식이 아니라 기관의 배치<\/b>로만 움직이므로, 어떤 일은 사람보다 잘해도 다른 일에서는 반드시 실패한다.", "w": null}, {"q": "『방법서설』 5부에서 데카르트가 언급한 인간의 기관들과 관련된 설명으로 적합하지 <u>않은<\/u> 것을 고르시오.", "box": null, "o": ["공통 감각은 뇌의 일부로서, 허기, 갈증 및 다른 내적 정념들의 관념들을 받아들인다.", "기억은 공통 감각에 의해 받아들여진 관념들을 보존한다.", "판타지는 공통 감각에 의해 받아들여진 관념들을 다양하게 바꿀 수 있다.", "지체들(인간의 사지)은 의지의 인도 없이 움직일 수 없다."], "a": [4], "s": 2, "part": "5부", "e": "데카르트는 동물 정기가 근육으로 흘러 들어가 지체를 움직이므로, 우리 몸도 기계처럼 <b>의지의 인도 없이<\/b> 외부 대상과 내적 정념에 따라 다양하게 움직일 수 있다고 설명한다. ④는 이와 정반대.", "w": "①②③은 5부의 공통 감각·기억·판타지(상상) 설명과 일치."}, {"q": "『방법서설』 5부에서 인간과 짐승의 차이에 관한 데카르트의 견해라고 할 수 있는 것을 고르시오.", "box": null, "o": ["앵무새가 우리처럼 말을 할 수 있는데, 이것은 앵무새가 인간처럼 말하는 바를 사유하고 있음을 의미한다.", "원숭이는 뇌 질환을 가지고 있는 아이보다는 더 이성적이다.", "인간보다 더 많은 재간을 보여주는 동물들은 인간보다는 못하지만 어느 정도의 정신을 가지고 있음을 보여준다.", "다른 이들에게 말하는 데 쓰이는 기관들이 짐승만큼 혹은 그 이상으로 결여된 인간들은 타인들에게 자신을 이해시킬 어떤 기호들을 고안해낼 수 없다."], "a": [5], "s": 3, "part": "5부", "e": "① 앵무새는 말을 내뱉을 수 있어도 <b>자기가 하는 말을 생각한다는 것을 보여주지 못한다<\/b>. ② 가장 완전한 원숭이도 가장 어리석은 아이나 <b>뇌가 손상된 아이<\/b>와 같은 수준에 이르지 못한다. ③ 어떤 일을 사람보다 잘하는 것은 정신이 있다는 증거가 아니라, <b>정신이 전혀 없고 기관의 배치로 움직인다는 증거<\/b>다. ④ 반대: 날 때부터 말 못하고 듣지 못하는 사람들도 <b>스스로 기호를 고안해<\/b> 자신을 이해시킨다. 따라서 모두 틀려 ⑤.", "w": "※ 시험지 원문이 '고안해낼 수 있다'였다면 정답은 ④."}]}, {"id": "mock1", "title": "종합 모의고사 1회", "kind": "모의고사", "range": "1~6부", "qs": [{"q": "『방법서설』의 출간 배경과 서술 방식에 대한 설명으로 옳은 것은?", "box": null, "o": ["1637년, 데카르트의 실명으로 당시 학술어인 라틴어로 출간되었다.", "갈릴레이 재판 이후 자연학 논고는 모두 폐기하고 『방법서설』만 단독으로 출간하였다.", "직접적인 물리 법칙 대신 그 법칙에 도달하게 된 방법론과 굴절광학·기상학·기하학 일부를 묶어 익명으로 출간하였다.", "엄밀한 논문 형식을 갖추고 3인칭 시점에서 객관적으로 서술하였다."], "a": [3], "s": 1, "part": "배경", "e": "갈릴레이의 지동설 재판을 보고 자연학 논고 출간을 미룬 데카르트는, 예민한 물리 법칙 대신 <b>그 법칙에 이른 방법<\/b>(『방법서설』)을 앞에 붙이고 <b>『굴절광학』·『기상학』·『기하학』<\/b> 세 에세이를 묶어 <b>익명<\/b>으로 냈다(우회적 발표).", "w": "① 라틴어가 아니라 <b>프랑스어<\/b>, 실명이 아니라 <b>익명<\/b>. ② 단독 출간이 아니라 세 에세이의 서설로 출간. ④ 논문 형식이 아니라 '나는 이렇게 공부하고 생각했다'는 <b>1인칭 자서전식<\/b> 서술."}, {"q": "『방법서설』 1부 첫머리에서 데카르트가 말한 '의견의 다양성'이 생기는 원인은 무엇인가?", "box": null, "o": ["어떤 사람이 다른 사람보다 더 이성적이기 때문이다.", "우리가 생각을 다양한 길을 통해 이끌고 동일한 사물을 고려하지 않기 때문이다.", "신속한 생각, 판명한 상상력, 풍부한 기억력이 사람마다 다르기 때문이다.", "같은 종에 속하는 개체들이라도 형상이나 본성에서 '더'와 '덜'의 차이가 있기 때문이다."], "a": [2], "s": 1, "part": "1부", "e": "양식(이성)은 모든 인간에게 자연적으로 동등하다. 그러므로 의견의 차이는 능력의 차이가 아니라 <b>생각을 이끄는 길(방법)<\/b>이 다르기 때문이다. 그래서 '좋은 정신을 지니는 것만으로는 충분하지 않고 그것을 잘 적용하는 것이 가장 중요하다', '천천히 걷더라도 올바른 길을 따르는 사람이 길을 벗어나 달리는 사람보다 더 멀리 간다'.", "w": "① 정반대. ③ 이런 성질을 남만큼 갖길 바랐다는 말은 있지만 의견 차이의 원인은 아니다. ④ 철학자들의 공통 의견: 차이는 <b>우연적 성질<\/b>에만 있고 형상·본성에는 없다."}, {"q": "1부에서 데카르트가 학교에서 배우는 교과목들의 가치를 인정하며 한 말로 적절하지 <u>않은<\/u> 것은?", "box": null, "o": ["우화의 기교는 정신을 일깨운다.", "모든 좋은 책을 읽는 것은 지난 시대 가장 교양 있는 저자들과 대화하는 것과 같다.", "철학은 모든 것에 대해 그럴듯하게 말하면서 학식이 적은 사람들에게 찬탄받게 하는 수단을 제공한다.", "법학과 의학은 그것에 힘쓰는 사람들에게 확실하고 명증한 인식을 가져다준다."], "a": [4], "s": 2, "part": "1부", "e": "원문: '법학과 의학을 비롯한 다른 학문은 그것에 힘쓰는 사람들에게 <b>명예와 부<\/b>를 가져다주며…'. 확실하고 명증한 인식은 데카르트가 오직 <b>수학<\/b>에서만 발견한 것이다.", "w": "③은 칭찬처럼 보이지만 사실은 비꼬는 표현(그럴듯하게 말하기). 원문 그대로이므로 '적절한' 진술이다."}, {"q": "1부에서 데카르트가 밝힌 이 글(서설)의 의도로 옳은 것은?", "box": null, "o": ["이성을 잘 인도하려고 각자가 따라야만 하는 방법을 가르치려는 것이다.", "자신의 이성을 인도하려고 자신이 어떻게 노력했는지를 보여주려는 것이다.", "교훈을 전달하는 사람으로서 자신이 독자보다 더 유능하다는 것을 증명하려는 것이다.", "모든 사람이 반드시 모방해야 할 유일한 모범을 제시하려는 것이다."], "a": [2], "s": 2, "part": "1부", "e": "원문: '나의 계획은 이성을 잘 인도하려고 각자가 따라야만 하는 방법을 가르치려는 것이 <b>아니라<\/b> 단지 <b>나의 이성을 인도하려고 내가 어떻게 노력했는지를 보여주는 것<\/b>이다.' 그래서 이 글을 하나의 <b>이야기<\/b>, 혹은 따르지 않을 이유가 있는 예도 섞인 하나의 <b>우화<\/b>로 제시한다.", "w": "① 정확히 부정된 문장. ③ 교훈을 전달하려는 사람은 자신을 더 유능하다고 평가해야 하고 작은 실수에도 비난받는다 — 그래서 그렇게 하지 않겠다는 것. ④ 2부: 이 모델을 보여주지만 누구에게도 모방하라고 충고하지 않는다."}, {"q": "1부에서 신학, 철학, 그 밖의 학문에 대한 데카르트의 생각으로 적절하지 <u>않은<\/u> 것은?", "box": null, "o": ["천국에 이르는 길은 가장 무지한 사람과 가장 박식한 사람에게 똑같이 열려 있고, 계시 진리들은 우리의 지성 너머에 있다.", "하나의 동일한 주제에 대해 참된 것은 하나뿐인데 학자들의 의견은 다양하므로, 그럴싸하게 보이는 모든 것을 거의 거짓으로 간주했다.", "다른 학문들은 철학으로부터 원리를 빌려오므로, 그렇게 확고하지 못한 토대 위에는 단단한 어떤 것도 세워질 수 없다고 판단했다.", "연금술사의 약속, 점성술사의 예언, 마술사의 기만에 더는 속지 않을 만큼 사이비 학설들의 가치를 이미 충분히 안다고 생각했다."], "a": [5], "s": 2, "part": "1부", "e": "①~④ 모두 1부 원문이다. 신학의 계시 진리는 자기 추론의 허약함에 종속시킬 수 없고, 그것을 검토하려면 하늘의 특별한 도움이 필요하다고 보았다. 또 그는 돈을 벌려고 학문을 직업으로 삼아야 하는 처지가 아니어서 학문이 주는 명예나 이익에도 끌리지 않았다.", "w": "'적절하지 않은 것'을 찾는 문제에서 모든 보기가 원문 그대로면 ⑤를 고를 것."}, {"q": "『방법서설』 2부 초반, 난로방에서 데카르트가 처음 깨달은 '여러 사람이 만든 것보다 한 사람이 만든 것이 더 완전하다'는 생각을 보여주는 사례로 적절하지 <u>않은<\/u> 것은?", "box": null, "o": ["여러 건축가가 오래된 성벽을 이용해 개조한 건물보다 한 건축가가 시도하고 완성한 건물이 대개 더 아름답다.", "작은 마을에서 시작해 큰 도시가 된 고대 도시보다 한 기술자가 벌판 위에 설계한 도시가 더 잘 구성되어 있다.", "범죄와 분쟁의 불편함 때문에 법을 제정한 민족은 신중한 입법자의 기초 법률을 따른 민족만큼 문명화될 수 없다.", "스파르타가 번성한 것은 법률이 단 한 사람에 의해 고안되어 그것 모두가 같은 목적을 향했기 때문이다."], "a": [5], "s": 2, "part": "2부", "e": "①~④ 모두 2부 원문의 사례다(건물 → 도시 → 법/민족 → 스파르타 → 학문). 같은 논리로, 여러 사람의 의견이 쌓인 <b>책 속 학문<\/b>은 양식을 가진 한 사람의 간단한 논증보다 진리에 가깝지 않다고 결론짓는다.", "w": "④ '스파르타의 개별 법률들은 아주 이상하고 풍속에 반대되는 것처럼 보였지만' 한 사람이 만들어 같은 목적을 향했기 때문에 번성했다 — 원문과 일치."}, {"q": "2부에서 데카르트가 젊은 시절 연구했던 세 가지 기예(학문)를 검토한 내용으로 적절하지 <u>않은<\/u> 것은?", "box": null, "o": ["논리학의 삼단논법과 다른 도구 대부분은 무엇을 배우게 하기보다 이미 알고 있는 것을 타인에게 설명하는 데 쓰인다.", "고대인의 해석(기하학)은 도형을 고려하느라 상상력을 몹시 피곤하게 만들지 않고는 지성을 사용하지 못한다.", "현대인의 대수는 규칙과 숫자에 너무 매달려 정신을 계발하기보다 당황시키는 혼란되고 애매한 기예가 된다.", "많은 법을 가진 국가가 더 잘 정돈되듯, 논리학을 구성하는 수많은 원칙을 빠짐없이 지키는 것이 방법의 핵심이라고 보았다."], "a": [4], "s": 3, "part": "2부", "e": "원문은 반대다. '많은 법이 악행의 변명거리가 되기 때문에 <b>엄격하게 준수되는 아주 적은 법<\/b>만 가진 국가가 더 잘 정돈되듯', 논리학의 많은 원칙 대신 <b>네 가지 원칙<\/b>(명증·분석·종합·열거)이면 충분하다. 단, 한 번도 어기지 않겠다는 확고한 결의가 필요하다.", "w": "데카르트는 세 기예의 <b>장점은 포함하면서 결함은 벗어난<\/b> 다른 방법을 찾으려 했다."}, {"q": "다음은 2부의 네 가지 원칙 중 첫 번째 원칙이다. ㉠, ㉡에 들어갈 말로 알맞은 것은?", "box": "첫 번째 원칙은 분명하게 그러하다고 인식하지 못한 어떤 것도 참으로 받아들이지 않는 것, 즉 성급한 판단과 ( ㉠ )을 철저하게 피하고 내 정신에 아주 ( ㉡ )하고 판명하게 나타나서 내가 결코 의심할 이유가 없는 것만을 내 판단에 포함시키는 것이었다.", "o": ["㉠편견, ㉡명석", "㉠감정, ㉡명석", "㉠편견, ㉡단순", "㉠관습, ㉡확실"], "a": [1], "s": 1, "part": "2부", "e": "<b>명증성의 규칙<\/b>. '명석(clear)'은 주의하는 정신에 뚜렷하게 나타나는 것, '판명(distinct)'은 다른 것과 구분되어 그것만 담고 있는 것이다. 강의 예시: 이가 아프다는 것은 <b>명석<\/b>하지만, 정확히 어느 이가 왜 아픈지 가려내는 것은 진단이 필요한 <b>판명<\/b>함이다.", "w": "명석·판명은 이후 4부에서 <b>'명석·판명하게 인식하는 것은 모두 참'<\/b>이라는 진리의 일반 규칙이 된다."}, {"q": "『방법서설』 3부의 임시 도덕에 대한 설명으로 적절하지 <u>않은<\/u> 것은?", "box": null, "o": ["집을 다시 짓는 동안 편안하게 머물 다른 집이 필요하듯, 이성이 판단을 결단성 없게 하는 동안에도 우유부단하게 행동하지 않으려고 세운 것이다.", "데카르트는 이것이 세 개나 네 개의 준칙으로 이루어져 있다고 스스로 밝혔다.", "세 번째 준칙에 따르면, 아플 때 건강하기를 욕망하고 감옥에 있을 때 자유롭기를 욕망하는 것이 '필연성을 덕으로 삼는' 태도이다.", "준칙들을 세운 뒤 이것들을 신앙의 진리와 함께 한쪽 편에 두고, 나머지 의견들은 자유롭게 버릴 수 있다고 판단했다."], "a": [3], "s": 2, "part": "3부", "e": "원문은 반대다. 필연성을 덕으로 삼는다면 '다이아몬드처럼 썩지 않는 신체나 새의 날개를 욕망하지 않듯이, <b>아프면서 건강하길, 감옥에 있으면서 자유롭길 욕망하지도 않을 것<\/b>'이다.", "w": "② 강의: 3개로 봐도, 마지막 결론(평생 이성을 계발하고 진리 인식에서 전진)을 넣어 4개로 봐도 된다."}, {"q": "다음은 3부 임시 도덕의 세 번째 준칙이다. ㉠~㉢에 들어갈 말을 바르게 짝지은 것은?", "box": "나의 세 번째 준칙은 언제나 ( ㉠ )이 아니라 나 자신을 지배하려고 노력하고, 세계의 질서가 아니라 나의 ( ㉡ )을 변화시키려 노력하며, 전적으로 우리의 능력 안에 있는 것은 우리의 ( ㉢ )뿐이기 때문에 외적인 일에 최선을 다한 뒤에 성공하지 못한 것은 우리에게 전적으로 불가능한 것이었다고 믿는 것에 일반적으로 익숙해지려고 노력하는 것이었다.", "o": ["㉠운, ㉡욕망, ㉢사유", "㉠운, ㉡사유, ㉢욕망", "㉠신, ㉡욕망, ㉢이성", "㉠타인, ㉡의지, ㉢사유"], "a": [1], "s": 1, "part": "3부", "e": "<b>자신을 다스리는 마음<\/b>(스토아적 태도). 세 구절은 같은 이야기를 반복한다. 바꿀 수 없는 운·세계 질서 대신 바꿀 수 있는 <b>나의 욕망<\/b>을 바꾸고, 온전히 내 것인 <b>사유<\/b>를 다스린다. 이렇게 하면 얻을 수 없는 것을 욕망하지 않아 만족할 수 있다.", "w": "①~③준칙 제목(PPT): 온건한 태도와 관습 준수 / 행동의 단호함과 일관성 / 자신을 다스리는 마음."}, {"q": "3부 첫 번째 준칙에서 데카르트가 동등하게 받아들여진 여러 의견 중 '가장 절제된 것'을 선택한 이유로 적절하지 <u>않은<\/u> 것은?", "box": null, "o": ["가장 절제된 것이 실천하기에 항상 가장 편리하기 때문이다.", "가장 절제된 의견이 언제나 참이라는 것이 이성에 의해 이미 증명되었기 때문이다.", "모든 과도함은 대개 나쁜 것이기에 절제된 것이 아마도 최선이기 때문이다.", "실수했을 경우에도 극단적인 것을 택했을 때보다 참된 길에서 조금만 벗어나기 때문이다."], "a": [2], "s": 2, "part": "3부", "e": "원문이 든 이유는 ①③④ 세 가지다. 임시 도덕은 이성이 판단을 아직 확정하지 못한 동안의 <b>실천<\/b> 규칙이므로, '이성에 의해 참임이 증명되었다'는 ②는 성립하지 않는다.", "w": "함께 나오는 내용: 페르시아인·중국인 중에도 분별 있는 사람이 있겠지만 <b>함께 살아갈<\/b> 분별 있는 사람들을 따르는 게 가장 유용하다. 그들이 <b>말한 것보다 실천한 것<\/b>에 주목해야 한다(풍속이 타락했고, 많은 사람이 자신이 무엇을 믿는지 모르기 때문)."}, {"q": "『방법서설』 4부에서 데카르트가 방법적 회의를 진행한 순서로 옳은 것은?", "box": null, "o": ["꿈의 환영 → 감각의 기만 → 기하학적 추리의 오류", "감각의 기만 → 꿈의 환영 → 기하학적 추리의 오류", "감각의 기만 → 기하학적 추리의 오류 → 꿈의 환영", "기하학적 추리의 오류 → 감각의 기만 → 꿈의 환영"], "a": [3], "s": 1, "part": "4부", "e": "① 감각은 종종 우리를 속이므로 감각이 상상하게 하는 사물은 없다고 가정 → ② 기하학의 가장 단순한 문제에서도 잘못 추리하는 사람이 있으므로 모든 증명을 거짓으로 간주 → ③ 깨어 있을 때의 생각이 잠잘 때도 나타나므로 모든 것을 <b>꿈의 환영<\/b>보다 참되지 않은 것으로 간주. 그러나 그렇게 생각하는 동안에도 <b>생각하는 나<\/b>는 무엇이어야 한다 → cogito.", "w": "강의: 『방법서설』에는 <b>악령(악마) 가설이 아직 등장하지 않는다<\/b>(『성찰』에서 등장)."}, {"q": "4부에서 '나는 생각한다, 그러므로 나는 존재한다'를 발견한 뒤 데카르트가 이끌어낸 생각으로 적절하지 <u>않은<\/u> 것은?", "box": null, "o": ["육체가 없고 머무는 장소도 없다고 생각할 수는 있었지만, 그렇다고 내가 아무것도 아니라고 생각할 수는 없었다.", "나는 본질 내지는 본성이 생각하는 것일 뿐이며, 존재하기 위해 어떤 장소도 필요로 하지 않고 물질적 사물에 의존하지 않는 실체이다.", "cogito에는 '생각하기 위해서는 존재해야 한다'를 명석하게 안다는 것 외에 진리를 확신시켜주는 것이 없으므로, 명석·판명하게 인식하는 것은 모두 참이라는 일반 규칙을 세울 수 있다.", "생각하기를 멈추더라도, 그때까지 상상해온 나머지 모든 것이 참이었다면 나는 내가 존재했다고 믿을 충분한 근거를 가진다."], "a": [4], "s": 2, "part": "4부", "e": "원문은 반대다. '내가 생각하기를 멈추기만 했다면, 비록 그때까지 상상해온 모든 나머지가 참이었다고 하더라도 <b>나는 내가 존재했다고 믿을 어떤 근거도 가지지 않았다<\/b>.' 나의 존재를 보장하는 것은 오직 <b>생각<\/b>뿐이다.", "w": "③ 다만 '판명하게 인식하는 것이 무엇인지 제대로 파악하는 데에는 어려움이 있다'는 단서가 붙는다."}, {"q": "4부에서 '완전성의 관념'을 통해 신의 존재를 증명하는 과정에 대한 설명으로 적절하지 <u>않은<\/u> 것은?", "box": null, "o": ["의심하는 것보다 인식하는 것이 더 큰 완전성이므로, 의심하는 나의 존재는 전적으로 완전하지는 않다.", "하늘·땅·빛·열 같은 외부 사물의 관념들도 나를 능가하는 것이므로, 나보다 더 완전한 존재로부터 온 것이 틀림없다.", "더 완전한 것이 덜 완전한 것에서 나오는 것은 무로부터 어떤 것이 나오는 것만큼이나 모순이다.", "모든 복합은 의존의 증거이므로, 신은 지성적 본성과 물체적 본성으로 복합된 존재가 아니다."], "a": [2], "s": 3, "part": "4부", "e": "외부 사물의 관념에서는 <b>나를 능가하는 어떤 것도 발견하지 못했다<\/b>. 참이라면 나의 본성에서, 거짓이라면 무(나의 결함)에서 왔다고 볼 수 있다. 그러나 <b>나보다 더 완전한 존재의 관념<\/b>만은 나 자신에게서도, 무에서도 나올 수 없으므로 신이 넣어준 것이다 — 인과론적(후험적) 증명.", "w": "④ 의심·불안정·슬픔 같은 불완전성은 신 안에 없고, 세계 안의 불완전한 존재는 한순간도 신 없이 존재할 수 없다."}, {"q": "다음 글의 ㉠, ㉡에 들어갈 말로 알맞은 것은?", "box": "우리는 기괴한 사람이 아닌 한 의심할 수 없는 사물에 관해서 ( ㉠ )을 가지고 있음에도, ( ㉡ )이 문제일 때에는 이 사물에 대해 완전히 확신할 수 없기 때문에, 잠자면서도 다른 신체를 가지고 있다고 상상할 수도 있고 같은 방식으로 다른 별과 다른 땅을 본다고 상상할 수도 있다는 점에 주의할 충분한 이유가 있다.", "o": ["㉠실천적 확신, ㉡형이상학적 확실성", "㉠형이상학적 확실성, ㉡실천적 확신", "㉠감각적 확신, ㉡수학적 확실성", "㉠도덕적 확실성, ㉡감각적 확신"], "a": [1], "s": 2, "part": "4부", "e": "신체를 가지고 있다는 것, 별과 땅이 존재한다는 것은 일상에서 의심하지 않는다(<b>실천적 확신<\/b>). 그러나 <b>형이상학적 확실성<\/b>의 차원에서는 꿈에서도 같은 것을 생생하게 상상할 수 있으므로 완전히 확신할 수 없다. 이 의심을 없애려면 <b>신의 현존<\/b>이 전제되어야 한다.", "w": "신과 영혼의 현존을 의심하는 사람에게, 그들이 확실하다고 여기는 신체·별·땅이 오히려 '덜 확실하다'는 것을 보여주려는 맥락."}, {"q": "5부에서 데카르트가 출판을 단념한 논고(『세계』)의 내용을 소개한 것으로 적절하지 <u>않은<\/u> 것은?", "box": null, "o": ["평평한 캔버스에 고체의 모든 측면을 그릴 수 없어 한 측면을 밝게 택하는 화가들처럼, 빛에 대해 아는 것을 풍부하게 설명하려 했다.", "학자들의 논쟁에 휘말리지 않으려고, 신이 상상적 공간에 새로운 세계를 위한 물질을 창조한다면 그 세계에서 일어날 일만 말하기로 했다.", "이 세계가 실제로 자신이 제안한 방식대로 혼돈(카오스)으로부터 창조되었다고 추론했다.", "물질 안에는 스콜라학파에서 논쟁 중인 어떤 형상이나 성질도 없다고 분명하게 전제했다."], "a": [3], "s": 2, "part": "5부", "e": "데카르트는 '이 모든 것으로부터 이 세계가 내가 제안한 방식으로 창조되었다고 <b>추론하길 원하지 않았다<\/b>'. 신이 처음부터 세계를 지금 모습대로 만들었다는 것이 진실에 더 가깝다. 다만 물질의 본성은 <b>점진적으로 생겨나는 것으로 볼 때 더 쉽게 이해된다<\/b>.", "w": "재에서 유리가 만들어지는 변형을 묘사하는 데서 특히 즐거웠다고 말한다."}, {"q": "5부에서 인간 신체에 대한 데카르트의 가정과 서술로 적절하지 <u>않은<\/u> 것은?", "box": null, "o": ["신이 외적 형태와 내적 구조가 우리와 완전히 같은 인간의 신체를, 처음에는 이성적 영혼을 넣지 않고 만들었다고 가정했다.", "심장 안에는 마르기 전의 건초를 뜨겁게 하거나 새 포도주를 발효시키는 불과 같은 '빛 없는 불'이 있다고 가정했다.", "이렇게 가정한 신체에서 이성 없는 동물이 우리와 닮을 수 있는 모든 기능은 발견했지만, 사유에 의존하는 기능은 발견할 수 없었다.", "신의 손으로 만들어진 신체는 인간이 고안할 수 있는 어떤 기계보다 비교할 수 없을 만큼 잘 배치된 하나의 기계로 볼 수 있다."], "a": [5], "s": 2, "part": "5부", "e": "①~④ 모두 5부 원문이다. 사유에 의존하는 기능들은 <b>신이 이성적 영혼을 창조해 신체에 결합했다고 전제한 뒤에야<\/b> 발견된다. 신체만 보면 인간도 동물처럼 <b>자동기계<\/b>이고, 정신(영혼)은 별개의 실체다 — <b>심신 이원론<\/b>(강의).", "w": "인간의 재능이 적은 부품으로도 다양한 자동기계를 만드는 것을 아는 사람에게는, 신체를 기계로 보는 것이 이상하지 않을 것이라는 맥락."}, {"q": "『방법서설』 6부에서 아리스토텔레스 추종자들과 관련해 쓰인 비유가 <u>아닌<\/u> 것은?", "box": null, "o": ["나무 꼭대기에 도달한 뒤 더 높이 오르려 하지 않고 자주 내려오기도 하는 담쟁이덩굴", "정상적인 시각을 가진 사람을 아주 어두운 동굴 바닥으로 데려와 불이익 없이 싸우려는 시각장애인", "모래와 진흙 위에 세워진 아주 화려하고 웅장한 궁전", "창문을 열어 그들이 싸우려고 내려간 동굴 안으로 빛이 들어가게 하는 것"], "a": [3], "s": 2, "part": "6부", "e": "③은 1부에서 <b>고대 이교도들의 도덕<\/b>을 비유한 표현이다. ① 추종자들은 아리스토텔레스 이상으로 나아가지 못하고 오히려 학식이 줄어든다. ② 애매한 구분과 원리 덕분에 모르는 것도 대담하게 말한다. ④ 데카르트가 자신의 단순·명료한 원리를 출판하면 그들에게는 불리해진다는 뜻.", "w": "1부·6부 비유를 섞은 함정."}, {"q": "6부에서 데카르트가 말한 '실천적 철학'과 그 목적에 대한 설명으로 적절하지 <u>않은<\/u> 것은?", "box": null, "o": ["자연학의 일반 개념들은 학교에서 가르치는 사변적 철학 대신 하나의 실천적 철학을 발견할 수 있음을 보여주었다.", "실천적 철학을 통해 불·물·공기·별·하늘의 힘과 작용을 장인의 기예처럼 판명하게 인식하면, 우리를 자연의 주인과 소유자처럼 만들 것이다.", "건강의 보존은 이 삶의 첫 번째 선이자 다른 모든 선의 토대이다.", "정신은 신체의 기질과 무관하므로, 인간을 더 현명하게 만들 수단은 의학이 아니라 형이상학에서 찾아야 한다."], "a": [4], "s": 2, "part": "6부", "e": "원문: '정신도 신체의 기질과 신체 기관의 배치에 <b>아주 강하게 의존<\/b>하기 때문에, 인간들을 더 현명하고 능숙하게 만들어줄 수단이 있다면 그것을 <b>의학<\/b>에서 찾아야 한다.' 데카르트는 남은 생을 더 확실한 의학의 규칙을 얻는 데 쓰겠다고 결심한다.", "w": "'자연의 주인과 소유자'는 베이컨의 생각과 통하는 지점(강의). 공통점: 실용적 지식과 과학에 대한 신뢰."}, {"q": "다음은 6부의 한 구절이다. ㉠~㉢에 들어갈 말로 알맞은 것은?", "box": "나는 인생 전체를 그렇게 꼭 필요한 학문을 탐구하는 것에 바칠 의도를 가지고 있었고, 인생의 ( ㉠ )과 경험의 ( ㉡ )에 의해 방해받지만 않는다면 그것을 따르면서 틀림없이 이 학문을 발견하게 될 하나의 길과 마주쳤다. 그러면서 이 두 장애물에 대한 가장 좋은 처방으로 ( ㉢ )보다 좋은 것은 없다고 판단했다.", "o": ["㉠짧음 ㉡부족 ㉢내가 발견한 아주 작은 것이라도 대중에게 충실하게 알리고, 좋은 정신을 가진 사람들에게 필수적인 관찰에 기여하도록 권하는 것", "㉠짧음 ㉡부족 ㉢세상과 떨어져 홀로 은둔하며 모든 관찰을 스스로 해내는 것", "㉠고통 ㉡과잉 ㉢대중에게 알리고 좋은 정신을 가진 사람들에게 관찰에 기여하도록 권하는 것", "㉠짧음 ㉡부족 ㉢학자들과 공개 논쟁을 벌여 서로의 오류를 바로잡는 것"], "a": [1], "s": 1, "part": "6부", "e": "두 장애물 = <b>인생의 짧음과 경험의 부족<\/b>. 처방 = 대중에게 알리고 좋은 정신들(후학·연구자)이 관찰에 기여하도록 권하는 것. 이를 통해 <b>후대가 선대의 성과에서 시작하고, 다수의 삶과 작업을 결합<\/b>해 더 멀리 나아갈 수 있다.", "w": "④ 6부: 학교에서 연마되는 논쟁으로는 새로운 진리를 발견하지 못한다."}]}, {"id": "mock2", "title": "종합 모의고사 2회", "kind": "모의고사", "range": "1~6부", "qs": [{"q": "데카르트는 서문에서 '이 서설이 너무 길어 한 번에 전부 읽을 수 없다면 여섯 부분으로 나눌 수 있다'고 말한다. 각 부와 주제를 연결한 것으로 옳지 <u>않은<\/u> 것은?", "box": null, "o": ["1부 – 기존 학문에 대한 회의: 양식은 평등하지만 학문적 성과는 제각각이다.", "2부 – 명증·분석·종합·열거라는 네 가지 사고 규칙을 세워 진리를 찾는 기준을 제시한다.", "4부 – 심장의 박동과 혈액 순환 등 자연 현상을 물리 법칙과 기계론적 관점에서 설명한다.", "6부 – 인간이 자연의 주인이 되기 위해 실용적인 지식이 필요함을 강조하며 연구의 목적을 밝힌다."], "a": [3], "s": 1, "part": "배경", "e": "심장·혈액 순환과 기계론적 설명은 <b>5부<\/b>(자연과학적 원리)다. 4부는 <b>형이상학적 토대<\/b>(cogito, 영혼, 신의 존재)다. 3부는 임시 도덕 지침.<br>책의 원제: <b>『이성을 잘 인도하고 학문에서 진리를 찾기 위한 방법서설』<\/b>.", "w": "강의 PPT의 '각 부 요약' 슬라이드가 그대로 출제될 수 있으니 1~6부 키워드를 한 줄씩 외워 둘 것."}, {"q": "다음은 『방법서설』 1부의 한 구절이다. (　　)에 들어갈 말로 알맞은 것은?", "box": "이와 반대로 나는 도덕에 관한 (　　)을 그저 모래와 진흙 위에 세워진 아주 화려하고 웅장한 궁전들에 비교했다. 그들은 덕을 아주 높이 올려세웠고, 세계 안에 있는 모든 것보다 더 가치 있는 것으로 나타나게 했다. 그러나 그들은 덕을 인식할 수 있도록 충분히 가르치지 않았다. 그리고 그들이 자주 덕이라는 아주 아름다운 이름으로 부르는 것은 그저 무감각, 또는 오만, 혹은 절망, 또는 친족 살해에 불과하다.", "o": ["스콜라 철학자들의 주석서", "고대 이교도들의 글", "신학자들이 전하는 계시 진리", "수학자들의 증명"], "a": [2], "s": 2, "part": "1부", "e": "바로 앞 문장의 <b>수학<\/b>과 대비된다. 수학은 토대가 확고하고 단단한데 그 위에 높은 것을 아무것도 세우지 않았고, <b>고대 이교도들의 도덕<\/b>은 반대로 토대(모래와 진흙) 없이 화려한 궁전만 세웠다는 것.", "w": "'토대는 튼튼한데 건물이 없다'(수학) ↔ '건물은 화려한데 토대가 없다'(고대 도덕). 두 비유를 헷갈리지 않게."}, {"q": "1부에서 데카르트가 '세계라는 커다란 책'을 연구하며 여행한 끝에 얻은 <b>가장 큰 소득<\/b>은 무엇인가?", "box": null, "o": ["실례와 관습에 의해서만 확신하게 된 어떤 것도 너무 확고하게 믿지 않아야 한다는 것을 배운 것", "우리와 반대되는 풍습을 가진 민족은 대부분 이성을 덜 사용한다는 것을 확인한 것", "학자가 서재에서 하는 사변적 논증이 실제 삶의 문제에 관한 논증보다 더 많은 진리를 준다는 것을 깨달은 것", "여행을 오래 할수록 자기 나라의 풍습을 더 올바르게 판단할 수 있다는 것을 알게 된 것"], "a": [1], "s": 2, "part": "1부", "e": "풍습을 관찰해도 철학자들의 의견만큼이나 다양할 뿐 확신을 주는 것은 없었다. 그래서 얻은 가장 큰 소득은 <b>'실례와 관습에 의해서만 확신하게 된 것은 너무 확고하게 믿지 말 것'<\/b>. 이후 그는 <b>자기 자신 안에서<\/b> 연구하기로 결심한다.", "w": "② 2부: 반대 의견을 가진 사람들 다수는 <b>우리만큼 혹은 우리보다 더<\/b> 이성을 사용한다. ③ 반대: 자신에게 대가가 돌아오는 실제 문제의 논증에서 더 많은 진리를 만난다. ④ 반대: 여행에 너무 많은 시간을 쓰면 자기 나라에서 <b>낯선 자<\/b>가 된다."}, {"q": "1부에서 고전·역사·우화 공부와 여행에 대해 데카르트가 지적한 내용으로 적절하지 <u>않은<\/u> 것은?", "box": null, "o": ["다른 시대의 책들과 친하게 지내는 것은 여행하는 것과 거의 같다.", "지난 세기에 실천된 것들에 너무 호기심을 가지면 지금 일상적으로 실천되는 것들에 대해 무지하게 된다.", "아주 충실한 역사책조차 가장 하찮고 무가치해 보이는 상황을 거의 항상 생략한다.", "우화는 실제로 가능한 사건만을 다루므로, 그로부터 품행의 본보기를 끌어내는 것이 가장 안전하다."], "a": [4], "s": 2, "part": "1부", "e": "원문은 반대다. '우화는 <b>전혀 가능하지 않은<\/b> 여러 사건을 가능한 것으로 상상하게 만든다.' 그래서 역사·우화에서 끌어낸 예로 품행을 지도하는 사람은 <b>소설 속 편력 기사들의 괴상함<\/b>에 빠지고 능력을 넘어서는 기획을 품게 된다.", "w": "다른 민족의 풍습을 아는 것은 좋지만, 여행에 너무 많은 시간을 쓰면 <b>자기 나라에서 낯선 자<\/b>가 된다."}, {"q": "2부 끝에서 데카르트가 철학의 확실한 원리를 세우는 일을 곧바로 실행하지 않고 미룬 이유로 적절하지 <u>않은<\/u> 것은?", "box": null, "o": ["철학의 원리를 세우는 것이 세상에서 가장 중요한 일이고, 이 일에서는 속단과 편견을 가장 두려워해야 했기 때문이다.", "그때의 나이인 스물세 살보다 더 성숙한 나이에 이르러야 한다고 생각했기 때문이다.", "그 이전에 받아들인 모든 나쁜 의견들을 정신에서 뿌리 뽑을 필요가 있었기 때문이다.", "추론의 재료가 될 다양한 경험을 쌓고, 스스로 규정한 방법을 계속 연습해야 했기 때문이다."], "a": [5], "s": 2, "part": "2부", "e": "①~④ 모두 2부 마지막 문단의 내용이다. 다른 학문의 원리는 철학에서 끌어와야 하므로 철학의 원리부터 세워야 하지만, 이 가장 중요한 일을 위해 먼저 많은 시간을 준비에 쓰기로 한다.", "w": "출판을 미룬 이유(갈릴레이 사건)와 혼동하지 말 것 — 그것은 6부 이야기."}, {"q": "다음 글의 (　　)에 들어갈 말로 가장 알맞은 것은?", "box": "세계는 서로 전혀 일치하지 않는 두 가지 종류의 정신으로만 거의 구성되어 있다. … 나에 대해 말하자면, 만일 내가 단 한 명의 선생만을 가졌거나 혹은 가장 학식 있는 사람들의 의견 사이에 언제나 존재하는 차이들에 대해 전혀 몰랐더라면 나는 의심의 여지 없이 (　　)에 속했을 것이다.", "o": ["실제보다 자신이 더 유능하다고 믿으면서 서둘러 판단하고, 생각을 순서에 따라 이끌 인내심이 없는 사람들", "자신을 가르친 사람들보다 참과 거짓을 더 잘 구분할 수 없다고 판단하여, 스스로 최선의 의견을 찾기보다 다른 사람들의 의견을 따르는 것에 만족하는 사람들", "출생이나 운에 의해 공적인 일을 맡지 않았으면서도 항상 어떤 새로운 개혁을 생각하는 사람들", "의심하려고 의심하고 언제나 결단성 없는 체하는 회의주의자들"], "a": [2], "s": 3, "part": "2부", "e": "데카르트는 두 부류(① 성급한 자들 / ② 남의 의견을 따르는 겸손한 자들) 중 <b>후자<\/b>에 속했을 것이라고 말한다. 그러나 철학자들의 의견이 제각각이고 여행에서 관습의 상대성을 본 탓에 따를 만한 사람을 고를 수 없어, <b>스스로를 이끌어야<\/b> 했다 — '어둠 속에서 혼자 걷는 사람처럼 아주 천천히'.", "w": "③ 데카르트가 동의할 수 없다고 한 '멋대로 행동하고 불안한 기질'의 개혁가들(2부). ④ 3부에서 자신은 회의주의자를 모방하지 않았다고 밝힌다."}, {"q": "2부에서 데카르트가 방법을 세운 뒤 수학을 다룬 방식으로 적절하지 <u>않은<\/u> 것은?", "box": null, "o": ["학문에서 진리를 탐구한 사람 중 오직 수학자들만 확실하고 명증한 근거를 발견했으므로, 그들이 검토한 것에서 시작해야 한다고 생각했다.", "수학이라 불리는 개별 학문 모두를 배우려 하지 않고, 모든 수학이 공통으로 고려하는 관계와 비례 일반만을 검토하기로 했다.", "비례를 개별적으로 고려할 때는 가장 간략한 기호로 나타내고, 여러 비례를 기억하거나 함께 포착할 때는 선으로 상정했다.", "산술을 배운 아이가 규칙에 따라 덧셈을 하면, 그 합계에 대해 인간 정신이 발견할 수 있는 모든 것을 발견했다고 확신할 수 있다."], "a": [3], "s": 3, "part": "2부", "e": "원문은 반대다. 비례를 <b>개별적으로<\/b> 더 잘 고려하려면 <b>선<\/b>으로 상정해야 한다. 선보다 단순하고 상상력·감각에 판명하게 나타나는 것은 없기 때문이다. 비례를 <b>기억하거나 여럿을 함께 포착<\/b>하려면 <b>가장 간략한 기호<\/b>로 설명해야 한다. 이렇게 기하학적 해석과 대수의 장점을 함께 얻는다.", "w": "④ 각 사물에는 하나의 진리만 있으므로, 그것을 발견한 사람은 누구나 그 진리를 다른 사람만큼 안다는 맥락. 이 방법은 두세 달 만에 어려운 문제들을 풀게 해 주었다."}, {"q": "3부 후반, 임시 도덕을 세운 뒤 데카르트가 보낸 9년에 대한 설명으로 옳은 것은?", "box": null, "o": ["의심하려고 의심하고 언제나 결단성 없는 체하는 회의주의자들을 모방했다.", "세상에서 상영되는 모든 연극에서 연기자가 아니라 관객이 되려고 노력하며 세계의 이곳저곳을 떠돌았다.", "9년 동안 난로방에 머물며 사람들과의 대화를 피하고 홀로 성찰했다.", "오래된 집을 허물 때처럼 근거가 잘못된 의견들을 모두 파괴하면서 그 잔해는 아무것도 남기지 않았다."], "a": [2], "s": 2, "part": "3부", "e": "데카르트는 사람들과 대화하며 일을 더 잘 완수하리라 기대해 겨울이 끝나기 전에 다시 여행길에 올랐고, 9년 동안 <b>'연기자가 아닌 관객'<\/b>으로 떠돌며 오류를 뿌리 뽑았다.", "w": "① 반대: 목표는 스스로 확신하는 것, 즉 <b>바위나 진흙을 찾으려 모래를 파내는 것<\/b>이었다. ③ 난로방을 떠나 여행했다. ④ 반대: 헌 집의 잔해를 새 집에 쓰려고 보관하듯, 파괴하면서 얻은 <b>관찰과 경험<\/b>을 이후 더 확실한 의견을 세우는 데 썼다."}, {"q": "3부 두 번째 준칙(행동의 단호함과 일관성)에 관한 설명으로 옳은 것은?", "box": null, "o": ["삶에서 행위는 어떤 유예도 허용하지 않으므로, 가장 참된 의견을 구별할 수 없을 때는 가장 개연적인 것을 따라야 한다.", "어떤 의견이 더 개연적인지 확실히 알 수 없을 때는 선택을 보류하고 한 장소에 머물러야 한다.", "한번 따르기로 한 의견이라도 더 나아 보이는 의견이 나타나면 곧바로 바꾸는 것이 단호함이다.", "이 준칙을 따르자 자신이 선택한 의견이 언제나 참이라는 확신을 얻게 되었다."], "a": [1], "s": 2, "part": "3부", "e": "행위는 유예를 허용하지 않으므로 <b>가장 개연적인 것<\/b>을 따라야 한다. 어느 쪽이 더 개연적인지조차 모를 때도 하나를 골라, 실천에 관한 한 그것을 참되고 확실한 것으로 여겨야 한다. 그렇게 결정하게 만든 근거는 참되고 확실하기 때문이다. 그 덕분에 허약하고 흔들리는 정신이 겪는 <b>후회와 회한<\/b>에서 벗어났다.", "w": "② 숲의 비유: 한 장소에 <b>멈춰도 안 된다<\/b>. ③ 사소한 이유로 방향을 바꾸지 말 것. ④ 얻은 것은 의견이 참이라는 확신이 아니라 후회와 회한에서 벗어난 것."}, {"q": "다음은 3부 임시 도덕의 결론 부분이다. (　　)에 들어갈 말로 알맞은 것은?", "box": "우리의 의지는 우리의 지성이 좋거나 나쁘다고 제시하는 것에 따라서만 어떤 것을 따르거나 피하기 때문에 잘 행위하려면 (　　)으로 충분하며, 최선을 다하려면, 다시 말해 모든 덕과 우리가 획득할 수 있는 모든 다른 좋은 것 전부를 획득하려면 할 수 있는 한 최선의 판단을 하는 것으로 충분하다.", "o": ["잘 욕망하는 것", "많이 아는 것", "잘 판단하는 것", "관습을 따르는 것"], "a": [3], "s": 2, "part": "3부", "e": "의지는 지성이 제시하는 대로 따르거나 피하므로 <b>잘 판단하면 잘 행위한다<\/b>. 이 결론 부분에서 데카르트는 여러 활동 중 <b>평생 이성을 계발하고 방법을 따르며 진리 인식에서 전진하는 것<\/b>을 최선으로 택하고, 극도의 만족감을 느꼈다고 말한다. 이것을 넷째 준칙으로 보기도 한다(강의: 3개 또는 4개).", "w": "앞의 세 준칙은 오직 '나를 지도하려는' 계획으로 세운 것이다. 신이 각자에게 참과 거짓을 구분하는 빛을 주었으므로, 타인의 의견에 한순간도 만족할 수 없었을 것이다."}, {"q": "다음 글의 (　　)에 들어갈 말로 가장 알맞은 것은?", "box": "그리고 신과 영혼을 이해하려고 상상력을 사용하길 원하는 사람은 (　　)와 마찬가지인 것으로 보인다. … 지성이 개입하지 않으면 상상력도 감각도 어떤 것에 대해서도 우리를 확신시켜줄 수 없다.", "o": ["어둠 속에서 혼자 아주 천천히 걷는 사람", "숲에서 길을 잃은 여행자", "나무 꼭대기에 오른 담쟁이덩굴", "소리를 듣거나 냄새를 맡으려고 자신의 눈을 사용하길 원하는 사람"], "a": [4], "s": 2, "part": "4부", "e": "많은 사람이 신과 영혼을 인식하기 어렵다고 믿는 것은, 물질적 사물을 위한 사유 방식인 <b>상상<\/b>으로만 생각하는 데 익숙해 상상될 수 없는 것은 이해될 수 없다고 여기기 때문이다. 스콜라 철학의 준칙 '지성 안에는 감각에 먼저 주어지지 않은 것은 아무것도 없다'도 같은 잘못이다.", "w": "① 2부(스스로를 이끄는 태도) ② 3부 둘째 준칙 ③ 6부(아리스토텔레스 추종자) — 다른 부의 비유를 섞어 놓은 함정."}, {"q": "4부에서 '깨어 있든 자고 있든 우리는 이성의 명증성에 의해서만 설득되어야 한다'는 주장과 관련해 데카르트가 든 사례가 <u>아닌<\/u> 것은?", "box": null, "o": ["황달에 걸린 사람이 모든 색을 노란색으로 보는 경우", "아주 멀리 있는 별이나 물체가 실제보다 작게 보이는 경우", "태양을 아주 명석하게 보더라도 보이는 그대로의 크기를 실제 크기로 판단해서는 안 되는 경우", "양의 몸에 붙은 사자의 머리(키메라)를 판명하게 상상할 수 있지만 그것이 존재한다고 결론 내려서는 안 되는 경우"], "a": [5], "s": 3, "part": "4부", "e": "①~④ 모두 4부 마지막 부분의 사례다. ①② 깨어 있어도 감각 관념은 우리를 속인다. ③④ 감각이나 상상이 아무리 명석·판명해 보여도, 참이라고 지시하는 것은 <b>이성<\/b>뿐이다.", "w": "함께 나오는 예: 잠자면서 기하학자가 새 증명을 고안하더라도 <b>그 잠이 증명을 거짓으로 만들지 못한다<\/b>."}, {"q": "4부에서 관념의 참됨과 오류의 원인에 대한 데카르트의 설명으로 적절하지 <u>않은<\/u> 것은?", "box": null, "o": ["실재적 사물들과 신에게서 온 우리의 관념은 명석하고 판명한 모든 것에 있어서 참이지 않을 수 없다.", "우리가 오류를 포함하는 관념을 자주 갖는 것은, 그 관념이 무에 참여하여 혼란스럽고 모호한 것을 가지기 때문이다.", "우리 안의 실재적이고 참된 모든 것이 완전하고 무한한 존재로부터 왔다는 것을 모른다면, 관념이 아무리 명석·판명해도 참되다고 확신할 근거가 없다.", "오류나 불완전성이 신에게서 나온다는 것은 진리나 완전성이 무로부터 나온다는 것보다 덜 모순적이다."], "a": [4], "s": 3, "part": "4부", "e": "원문: 오류 혹은 불완전성이 신에게서 나온다는 것은 진리 혹은 완전성이 무로부터 나온다는 것보다 <b>명백하게 덜 모순적이지 않다<\/b>. 즉 둘 다 똑같이 모순이다. 오류는 신이 아니라 <b>우리가 전적으로 완전하지 않아서<\/b>(무에 참여해서) 생긴다.", "w": "'~보다 덜 모순적이지 않다'(=똑같이 모순)를 '덜 모순적이다'로 바꾼 부정어 함정."}, {"q": "『방법서설』 4부의 내용으로 적절하지 <u>않은<\/u> 것은?", "box": null, "o": ["네덜란드에서 수행한 첫 성찰은 매우 형이상학적이고 평범하지 않아 모든 사람의 마음에 들지는 않을 것이라고 말했다.", "풍습에 관해서는 아주 불확실한 의견도 의심의 여지가 없는 것처럼 따를 필요가 있지만, 진리 탐구에서는 완전히 반대로 해야 한다고 생각했다.", "'나는 생각한다, 그러므로 나는 존재한다'는 회의주의자들의 과장된 가설로도 흔들 수 없지만, 신의 존재가 증명되기 전까지는 철학의 제일원리로 받아들일 수 없다고 보았다.", "만일 내가 다른 모든 것으로부터 독립적인 유일한 존재였다면, 나는 나 자신이 무한하고 영원하며 전지전능할 수 있었을 것이다."], "a": [3], "s": 2, "part": "4부", "e": "데카르트는 cogito가 아주 견고하고 확실해서 회의주의자들의 어떤 가설로도 흔들 수 없음을 보고, 이를 <b>찾던 철학의 제일원리로 주저 없이<\/b> 받아들였다. 신의 존재 증명은 그 <b>다음<\/b> 단계다. 신은 명석·판명 <b>규칙<\/b>을 보장할 뿐, 제일원리 자체의 조건이 아니다.", "w": "② 3부의 실천 원칙(불확실해도 따름)과 4부의 이론 원칙(조금이라도 의심스러우면 거짓으로 간주)의 대비. ④ 나는 내게 결핍된 완전성을 알기 때문에 유일한 존재가 아니라 다른 완전한 존재에 의존한다는 논증."}, {"q": "5부 후반, 영혼에 관한 데카르트의 견해로 옳은 것은?", "box": null, "o": ["짐승의 영혼이 우리의 영혼과 같은 본성이라고 상상하는 것은, 신을 부정하는 사람들의 오류 다음으로 허약한 정신을 덕의 올바른 길에서 멀어지게 하는 오류이다.", "이성적 영혼도 다른 사물들처럼 물질의 힘으로부터 끌어내질 수 있다.", "영혼이 선장이 배 안에 있는 방식으로 신체 안에 거주하는 것만으로도 하나의 진정한 인간이 구성된다.", "동물이 어떤 일을 우리보다 더 잘한다는 것은 동물도 어느 정도의 정신을 가졌다는 증거이다."], "a": [1], "s": 3, "part": "5부", "e": "짐승의 영혼이 우리와 같다고 여기면 파리나 개미처럼 이 삶 이후를 두려워하지도 희망하지도 않게 되어 덕에서 멀어진다. 인간과 짐승의 영혼이 얼마나 다른지 알면, 우리 영혼이 신체와 독립적이고 <b>신체와 함께 죽지 않는다(불멸)<\/b>는 근거를 더 잘 이해한다.", "w": "② 영혼은 물질에서 끌어낼 수 없고 <b>특별히 창조<\/b>된 것. ③ 감정·욕구를 갖고 진정한 인간이 되려면 신체와 <b>더 밀접하게 결합<\/b>되어야 한다. ④ 오히려 정신이 <b>전혀 없음<\/b>을 증명한다(시계의 예)."}, {"q": "5부에서 데카르트가 설명한 심장과 혈액의 운동에 관한 내용으로 옳은 것은?", "box": null, "o": ["심장의 운동은 눈으로 볼 수 있는 기관의 배치, 손가락으로 느낄 수 있는 열, 관찰로 알 수 있는 혈액의 본성으로부터 필연적으로 귀결된다. 이는 시계의 운동이 추와 바퀴로부터 귀결되는 것과 같다.", "심장은 근육의 수축력으로 피를 밀어내며, 심장의 열은 피가 식는 것을 막는 역할만 한다.", "혈액이 동맥 끝의 작은 통로를 거쳐 정맥으로 들어가 심장으로 돌아오는 영속적 순환은 데카르트 자신이 처음 발견하였다.", "동물 정기는 뇌에서 만들어져 심장으로 내려가 심장을 움직이는 불꽃 같은 것이다."], "a": [1], "s": 3, "part": "5부", "e": "데카르트는 심장 운동을 <b>기계론적<\/b>으로 설명한다. 심실에 들어간 핏방울이 심장의 <b>열<\/b>로 희박해지고 팽창해 심장을 부풀리고, 피가 식으면 수축한다 — 시계와 같은 필연적 귀결.", "w": "② 수축이 아니라 <b>열에 의한 팽창<\/b>이 핵심. ③ <b>한 영국인 의사<\/b>(하비)가 처음 가르쳤다고 찬사. ④ 반대: 동물 정기는 <b>심장에서 뇌로<\/b> 올라가고 뇌에서 신경을 통해 근육으로 간다. ※ 강의에서 '넘어간다'고 한 부분이라 출제 가능성은 낮음."}, {"q": "5부에서 말(언어)과 이성에 관한 데카르트의 견해로 적절하지 <u>않은<\/u> 것은?", "box": null, "o": ["아주 어리석거나 미친 사람이라도 다양한 말을 조합해 자신의 생각을 표현할 수 있지만, 아무리 완전한 동물도 그렇게 하지 못한다.", "이것은 동물이 말하는 기관을 가지지 않았기 때문이 아니다. 까치와 앵무새도 우리처럼 단어를 발음할 수는 있다.", "정념을 표현하고 기계나 동물이 모방할 수 있는 자연적 운동을 말과 혼동해서는 안 된다.", "말을 하려면 아주 적은 이성만으로도 족하므로, 짐승이 말을 하지 못한다는 것은 짐승이 이성을 전혀 가지지 않았음을 증명한다."], "a": [5], "s": 2, "part": "5부", "e": "①~④ 모두 원문이다. 핵심 문장: 이것은 짐승이 인간보다 <b>더 적은<\/b> 이성을 가졌다는 것이 아니라 이성을 <b>전혀 가지지 않는다<\/b>는 것을 증명한다. 또 어떤 고대인들처럼 우리가 알아듣지 못할 뿐 짐승도 말을 한다고 생각해서는 안 된다.", "w": "함께 나오는 반례: 날 때부터 듣지도 말하지도 못하는 사람들은 <b>스스로 기호를 고안해<\/b> 의사소통한다."}, {"q": "6부에서 데카르트가 밝힌 자연 탐구의 순서와 관찰에 대한 설명으로 적절하지 <u>않은<\/u> 것은?", "box": null, "o": ["첫째로, 세계 안에 있거나 있을 수 있는 모든 것의 원리 내지 제일원인을 발견하려 했고, 이를 위해 세계를 창조한 신 외에는 아무것도 고려하지 않았다.", "인식의 처음 단계에서는 감각에 저절로 나타나는 관찰보다 아주 드물고 일부러 고안한 관찰을 찾는 것이 더 좋다.", "제일원인으로부터 연역할 수 있는 첫 번째이자 가장 일상적인 결과로 하늘·별·지구·물·공기·불·광물 같은 가장 단순하고 인식하기 쉬운 것들을 발견했다.", "더 특수한 사물로 내려갈 때는 결과로부터 원인으로 나아가고 많은 특수한 관찰을 사용해야만 했다."], "a": [2], "s": 3, "part": "6부", "e": "원문은 반대다. 처음에는 <b>감각에 저절로 나타나고 조금만 반성해도 무시할 수 없는 관찰<\/b>을 쓰는 것이 낫다. 더 공통된 것의 원인을 모를 때 <b>드문 관찰은 우리를 자주 속이기<\/b> 때문이다. 관찰은 인식이 진보할수록 더 필요해진다.", "w": "순서: 제일원인(신) → 가장 일상적·단순한 결과 → 특수한 것(결과→원인, 관찰). cogito를 제일원리로 삼은 것처럼 '가장 단순한 것에서 시작'하는 사고방식(강의)."}, {"q": "6부의 내용으로 적절하지 <u>않은<\/u> 것은?", "box": null, "o": ["사람들이 학교에서 연마되는 논쟁을 통해 이전에 알지 못했던 어떤 진리도 발견하지 않았다는 점에 주목했다.", "오래도록 좋은 변호사였던 사람들이 그 이유로 나중에 아주 좋은 판사가 되는 것은 아니다.", "자신의 글에 반론이 있다면 출판사로 보내달라고 간청하며, 답변을 함께 첨부하겠다고 약속했다.", "『굴절광학』과 『기상학』 첫 부분의 '가설'은 원인으로 결과를, 결과로 원인을 증명하므로 논리학자들이 말하는 순환의 오류임을 솔직하게 인정했다."], "a": [4], "s": 3, "part": "6부", "e": "데카르트는 순환의 오류를 저질렀다고 생각해서는 <b>안 된다<\/b>고 말한다. 관찰이 결과를 확실하게 만들기 때문에, 원인은 결과를 <b>설명<\/b>하는 데 쓰이고, 증명되는 것은 오히려 원인이다. 원인을 '가설'이라 부른 것은 첫 번째 진리에서 연역할 수 있지만 <b>일부러 하지 않았음<\/b>을 알리기 위해서다.", "w": "① ② 논쟁에서는 양쪽 근거를 검토하기보다 그럴듯한 것을 내세우는 연습만 한다는 맥락."}, {"q": "6부에서 데카르트가 밝힌 출판에 관한 생각으로 적절하지 <u>않은<\/u> 것은?", "box": null, "o": ["3년 전 논고를 인쇄소에 넘기려다, 어떤 사람이 얼마 전 출판한 자연학 의견을 권위 있는 사람들이 승인하지 않았다는 사실을 알고 결심을 바꾸었다.", "금지된 그 의견에서 종교나 국가에 해로울 만한 것을 발견하지 못했지만, 그 금지처분은 자신도 잘못 판단한 것이 있지 않을까 두렵게 만들었다.", "살아 있는 동안 자연학의 토대를 출판하면 사람들의 반론 덕분에 자신의 기획이 더 빨리 완성되리라 기대했다.", "그럼에도 몇 가지 에세이를 내놓은 이유 중 하나는, 후대 사람들이 기여할 방법을 알려주지 않았다는 이유로 자신을 비난할 기회를 주고 싶지 않았기 때문이다."], "a": [3], "s": 2, "part": "6부", "e": "반대다. 자연학의 토대를 출판하면 다른 사람들의 의견과 일치할 수 없어 생길 <b>반대와 논쟁이 시간을 빼앗을 것<\/b>이라 예상했고, 그래서 <b>살아 있는 동안에는 출판에 동의할 수 없다<\/b>고 했다. 반론을 겪어 본 경험도 대립에서 이로운 것을 기대하지 못하게 했다.", "w": "① 갈릴레이 재판(강의). 다시 에세이를 낸 두 이유: (1) 출판 단념 이유가 실제보다 더 불명예스럽게 여겨질까 봐 (2) 무한한 관찰에 타인의 도움이 필요하고, 후대의 비난을 피하려고."}]}];</script>
<script>
const SETS = window.__DATA__;
const C = '①②③④⑤';
const PARTS = ['배경','1부','2부','3부','4부','5부','6부'];
const ALL = [];
SETS.forEach(s => s.qs.forEach((q, i) => { q.id = s.id + '-' + (i + 1); q.src = s.title + ' ' + (i + 1) + '번'; q.o = q.o.concat(['답 없음']); ALL.push(q); }));
const BYID = Object.fromEntries(ALL.map(q => [q.id, q]));

const store = {
  get(k, d) { try { const v = localStorage.getItem('dm-' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('dm-' + k, JSON.stringify(v)); } catch (e) {} }
};
let mode = store.get('mode', 'practice');      // practice | exam
let wrong = new Set(store.get('wrong', []));
let best = store.get('best', {});
let partSel = new Set(store.get('parts', PARTS));
let S = null;   // 현재 풀이 상태

const $ = s => document.querySelector(s);
const app = $('#app');
const esc = t => String(t).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const stars = n => '★'.repeat(n) + '<i>' + '★'.repeat(3 - n) + '</i>';
const isRight = (q, pick) => pick != null && q.a.includes(pick);
const saveWrong = () => store.set('wrong', [...wrong]);
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function home() {
  S = null;
  location.hash = '';
  const cards = SETS.map(s => {
    const b = best[s.id];
    return `<button class="set" data-set="${s.id}">
      <span class="k">${s.kind}</span><span class="n">${s.title}</span>
      <span class="m"><span>${s.range} · ${s.qs.length}문항</span>${b != null ? `<span class="best">최고 ${b}/${s.qs.length}</span>` : '<span>아직 안 풂</span>'}</span>
    </button>`;
  }).join('');
  const pool = ALL.filter(q => partSel.has(q.part));
  app.innerHTML = `
    <div class="top">
      <div><div class="eyebrow">서양철학: 쟁점과 토론 · 데카르트</div><h1>방법서설 문제은행</h1></div>
      <div>
        <div class="seg" role="group" aria-label="풀이 방식">
          <button id="m-practice" aria-pressed="${mode === 'practice'}">연습 모드</button>
          <button id="m-exam" aria-pressed="${mode === 'exam'}">시험 모드</button>
        </div>
        <p class="hint">${mode === 'practice' ? '한 문제 고를 때마다 바로 채점하고 해설을 보여줘요.' : '끝까지 푼 뒤 제출하면 한꺼번에 채점해요.'}</p>
      </div>
    </div>
    <div class="sets">${cards}</div>
    <h2>부별로 골라 풀기</h2>
    <div class="parts">${PARTS.map(p => `<button class="chip" data-part="${p}" aria-pressed="${partSel.has(p)}">${p} <span style="color:var(--muted)">${ALL.filter(q => q.part === p).length}</span></button>`).join('')}</div>
    <div class="row">
      <button class="btn" id="mix" ${pool.length ? '' : 'disabled'}>선택한 부에서 랜덤 ${Math.min(20, pool.length)}문항</button>
      <button class="btn ghost" id="mixall" ${pool.length ? '' : 'disabled'}>선택한 부 전부 (${pool.length}문항)</button>
    </div>
    <h2>오답노트</h2>
    ${wrong.size ? `<div class="row"><button class="btn" id="wrongs">틀린 문제 다시 풀기 (${wrong.size}문항)</button><button class="btn ghost" id="clearw">오답노트 비우기</button></div>`
      : `<div class="empty">아직 틀린 문제가 없어요. 문제를 풀다 틀리면 여기에 모여요. (맞히면 자동으로 빠져요)</div>`}
    <p class="hint" style="margin-top:22px">기출 = 실제 고전읽기 점검퀴즈 1·2 / 모의고사 = 강의·PPT·원문 기반 예상 문제. 기출 퀴즈2 5번은 ②·③ 복수 정답 처리.</p>`;
  app.querySelectorAll('.set').forEach(b => b.onclick = () => start(SETS.find(s => s.id === b.dataset.set).title, SETS.find(s => s.id === b.dataset.set).qs, b.dataset.set));
  app.querySelectorAll('.chip').forEach(b => b.onclick = () => { const p = b.dataset.part; partSel.has(p) ? partSel.delete(p) : partSel.add(p); store.set('parts', [...partSel]); home(); });
  $('#m-practice').onclick = () => { mode = 'practice'; store.set('mode', mode); home(); };
  $('#m-exam').onclick = () => { mode = 'exam'; store.set('mode', mode); home(); };
  const mix = $('#mix'); if (mix) mix.onclick = () => start('부별 랜덤', shuffle(pool).slice(0, 20));
  const mixall = $('#mixall'); if (mixall) mixall.onclick = () => start('부별 전체', pool);
  const w = $('#wrongs'); if (w) w.onclick = () => start('오답노트', ALL.filter(q => wrong.has(q.id)));
  const cw = $('#clearw'); if (cw) cw.onclick = () => { if (cw.dataset.sure) { wrong.clear(); saveWrong(); home(); } else { cw.dataset.sure = 1; cw.textContent = '한 번 더 누르면 비워져요'; } };
}

function start(title, qs, setId) {
  S = { title, qs, setId, i: 0, picks: Array(qs.length).fill(null), done: false, t0: Date.now(), mode };
  location.hash = 'solve';
  render();
}

function render() {
  if (!S) return home();
  if (S.done) return result();
  const q = S.qs[S.i], pick = S.picks[S.i];
  const reveal = S.mode === 'practice' && pick != null;
  const dots = S.qs.map((qq, k) => {
    let c = 'dot';
    if (k === S.i) c += ' cur';
    const p = S.picks[k];
    if (p != null) c += S.mode === 'practice' ? (isRight(qq, p) ? ' ok' : ' bad') : ' done';
    return `<button class="${c}" data-k="${k}" aria-label="${k + 1}번">${k + 1}</button>`;
  }).join('');
  const opts = q.o.map((t, k) => {
    const n = k + 1;
    let c = 'opt';
    if (reveal) { if (q.a.includes(n)) c += ' right'; else if (pick === n) c += ' wrong'; }
    else if (pick === n) c += ' sel';
    return `<button class="${c}" data-n="${n}" ${reveal ? 'disabled' : ''}><span class="no">${C[k]}</span><span>${t}</span></button>`;
  }).join('');
  const answered = S.picks.filter(p => p != null).length;
  const ans = q.a.map(n => C[n - 1]).join(', ');
  app.innerHTML = `
    <div class="bar"><span class="ttl">${esc(S.title)}</span><span class="meta">${answered}/${S.qs.length} 풀이 · <span id="clock"></span> · ${S.mode === 'practice' ? '연습' : '시험'}</span></div>
    <div class="dots">${dots}</div>
    <div class="card">
      <div class="qhead"><span class="badge">문제 ${S.i + 1}</span><span class="star">${stars(q.s)}</span><span class="tag">${q.part}</span><span class="tag">${esc(q.src)}</span></div>
      <div class="qt">${q.q}</div>
      ${q.box ? `<div class="box">${q.box}</div>` : ''}
      <div class="opts">${opts}</div>
      ${reveal ? `<div class="fb">
        <div class="verdict ${isRight(q, pick) ? 'ok' : 'bad'}">${isRight(q, pick) ? '정답!' : '오답'} · 정답 ${ans}${q.a.length > 1 ? ' (복수 정답)' : ''}</div>
        <div class="ex">${q.e}</div>${q.w ? `<div class="wr"><b class="l">오답 체크</b> ${q.w}</div>` : ''}</div>` : ''}
    </div>
    <div class="nav">
      <button class="btn ghost" id="quit">그만 풀기</button>
      <div class="row" style="margin:0">
        <button class="btn ghost" id="prev" ${S.i === 0 ? 'disabled' : ''}>이전</button>
        ${S.i < S.qs.length - 1 ? `<button class="btn" id="next">다음</button>` : (S.back ? '' : `<button class="btn" id="submit">${S.mode === 'exam' ? '제출하고 채점' : '결과 보기'}</button>`)}
      </div>
    </div>`;
  app.querySelectorAll('.dot').forEach(b => b.onclick = () => { S.i = +b.dataset.k; render(); });
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    if (reveal) return;
    const n = +b.dataset.n;
    S.picks[S.i] = (S.mode === 'exam' && S.picks[S.i] === n) ? null : n;
    if (S.mode === 'practice') mark(q, n);
    render();
  });
  $('#quit').textContent = S.back ? '결과로 돌아가기' : '그만 풀기';
  $('#quit').onclick = () => { if (S.back) { S = S.back; render(); } else if (S.picks.some(p => p != null)) finish(); else home(); };
  $('#prev').onclick = () => { S.i--; render(); };
  const nx = $('#next'); if (nx) nx.onclick = () => { S.i++; render(); window.scrollTo(0, 0); };
  const sb = $('#submit'); if (sb) sb.onclick = () => {
    const left = S.picks.filter(p => p == null).length;
    if (S.mode === 'exam' && left && !sb.dataset.sure) { sb.dataset.sure = 1; sb.textContent = `안 푼 문제 ${left}개 — 그래도 제출`; return; }
    finish();
  };
  tick();
}

function mark(q, n) { if (isRight(q, n)) wrong.delete(q.id); else wrong.add(q.id); saveWrong(); }

function finish() {
  if (S.mode === 'exam') S.qs.forEach((q, k) => { if (S.picks[k] != null) mark(q, S.picks[k]); });
  S.done = true; S.secs = Math.round((Date.now() - S.t0) / 1000);
  const sc = S.qs.filter((q, k) => isRight(q, S.picks[k])).length;
  if (S.setId && S.picks.every(p => p != null)) { best[S.setId] = Math.max(best[S.setId] || 0, sc); store.set('best', best); }
  render();
}

function result() {
  const sc = S.qs.filter((q, k) => isRight(q, S.picks[k])).length;
  const parts = PARTS.filter(p => S.qs.some(q => q.part === p)).map(p => {
    const qs = S.qs.map((q, k) => [q, k]).filter(([q]) => q.part === p);
    const ok = qs.filter(([q, k]) => isRight(q, S.picks[k])).length;
    return `<div class="bp">${p}<b>${ok}/${qs.length}</b></div>`;
  }).join('');
  const items = S.qs.map((q, k) => {
    const ok = isRight(q, S.picks[k]), p = S.picks[k];
    return `<button class="li" data-k="${k}"><span class="mk ${ok ? 'ok' : 'bad'}">${ok ? 'O' : 'X'}</span><span class="tx">${k + 1}. ${q.q.replace(/<[^>]+>/g, '')}
      <small>내 답 ${p ? C[p - 1] : '안 풂'} · 정답 ${q.a.map(n => C[n - 1]).join(', ')} · ${q.part}</small></span></button>`;
  }).join('');
  const m = Math.floor(S.secs / 60), s = S.secs % 60;
  const wrongs = S.qs.filter((q, k) => !isRight(q, S.picks[k]));
  app.innerHTML = `
    <div class="bar"><span class="ttl">${esc(S.title)} · 결과</span><span class="meta">걸린 시간 ${m}분 ${s}초</span></div>
    <div class="card">
      <div class="score"><span class="big">${sc}</span><span class="of">/ ${S.qs.length}문항 맞힘 · ${Math.round(sc / S.qs.length * 100)}점</span></div>
      <div class="byPart">${parts}</div>
      <div class="row">
        ${wrongs.length ? `<button class="btn" id="redo">틀린 ${wrongs.length}문항만 다시</button>` : ''}
        <button class="btn ghost" id="again">처음부터 다시</button>
        <button class="btn ghost" id="home">목록으로</button>
      </div>
    </div>
    <h2>문항별 확인 (누르면 해설)</h2>
    <div class="list">${items}</div>`;
  app.querySelectorAll('.li').forEach(b => b.onclick = () => review(+b.dataset.k));
  const r = $('#redo'); if (r) r.onclick = () => start(S.title + ' · 오답', wrongs);
  $('#again').onclick = () => start(S.title, S.qs, S.setId);
  $('#home').onclick = home;
}

function review(k) {
  const prev = S;
  S = { title: prev.title + ' · 해설', qs: prev.qs, setId: null, i: k, picks: prev.picks.slice(), done: false, t0: Date.now(), mode: 'practice', back: prev };
  // 해설 보기: 연습 모드로 열어 정답과 해설이 바로 보이게 (안 푼 문제는 선택 시 채점)
  location.hash = 'solve';
  render();
}

let timer;
function tick() {
  clearInterval(timer);
  const f = () => { const el = $('#clock'); if (!el || !S) return clearInterval(timer); const t = Math.round((Date.now() - S.t0) / 1000); el.textContent = `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`; };
  f(); timer = setInterval(f, 1000);
}

window.addEventListener('hashchange', () => { if (location.hash !== '#solve' && S) home(); });
document.addEventListener('keydown', e => {
  if (!S || S.done) return;
  if (['1','2','3','4','5'].includes(e.key)) { const b = app.querySelector(`.opt[data-n="${e.key}"]`); if (b && !b.disabled) b.click(); }
  if (e.key === 'ArrowRight') { const b = $('#next'); if (b) b.click(); }
  if (e.key === 'ArrowLeft') { const b = $('#prev'); if (b && !b.disabled) b.click(); }
});
home();

</script>

</body></html>
