<title>소크라테스의 변명 점검퀴즈</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 레이아웃: 한 문제씩 넘기는 시험지 카드 + 위쪽 문항 번호 줄. 남색 잉크 + 종이빛 바탕 */
:root{
  --bg:#f5f6f9; --paper:#ffffff; --ink:#1c2333; --muted:#5d6880; --line:#d9deea;
  --navy:#1f3a68; --navy-soft:#e7ecf6; --gold:#d79a1e;
  --ok:#1f7a4a; --ok-soft:#e3f3ea; --bad:#b33a3a; --bad-soft:#f8e6e6;
  --serif:'Gowun Batang','Noto Serif KR',serif; --sans:'IBM Plex Sans KR','Noto Sans KR',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11151d; --paper:#1a202b; --ink:#e6e9f0; --muted:#9aa4b8; --line:#2c3444;
  --navy:#8fb0e8; --navy-soft:#22304a; --gold:#e8b445;
  --ok:#5cc88d; --ok-soft:#173326; --bad:#ef7d7d; --bad-soft:#3a1f22; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151d; --paper:#1a202b; --ink:#e6e9f0; --muted:#9aa4b8; --line:#2c3444;
  --navy:#8fb0e8; --navy-soft:#22304a; --gold:#e8b445;
  --ok:#5cc88d; --ok-soft:#173326; --bad:#ef7d7d; --bad-soft:#3a1f22; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1{font-family:var(--serif);font-size:28px;margin:0;color:var(--navy);text-wrap:balance}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:600}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--navy);padding-bottom:10px;margin-bottom:18px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--paper)}
.seg button{border:0;background:none;padding:6px 14px;border-radius:999px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--paper);font-weight:600}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}
.sets{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:16px}
.set{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.set:hover{border-color:var(--navy)}
.set .k{font-size:12px;font-weight:700;color:var(--navy);letter-spacing:.04em}
.set .n{font-family:var(--serif);font-size:19px;font-weight:700}
.set .m{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.set .best{color:var(--ok);font-weight:600}
h2{font-size:14px;color:var(--muted);margin:26px 0 0;font-weight:600;letter-spacing:.04em}
.parts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--navy-soft);border-color:var(--navy);color:var(--navy);font-weight:600}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.btn{border:1px solid var(--navy);background:var(--navy);color:var(--paper);border-radius:8px;padding:10px 16px;font-weight:600}
.btn.ghost{background:var(--paper);color:var(--navy)}
.btn:disabled{opacity:.4;cursor:not-allowed}
/* 문제 화면 */
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.bar .ttl{font-weight:700;color:var(--navy)}
.bar .meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 16px}
.dot{width:32px;height:32px;border-radius:7px;border:1px solid var(--line);background:var(--paper);font-size:13px;font-variant-numeric:tabular-nums}
.dot.cur{border:2px solid var(--navy)}
.dot.done{background:var(--navy-soft)}
.dot.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.dot.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:20px}
.qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{background:var(--navy);color:var(--paper);font-weight:700;font-size:13px;padding:3px 10px;border-radius:4px}
.star{color:var(--gold);letter-spacing:1px;font-size:13px}
.star i{color:var(--line);font-style:normal}
.tag{font-size:12px;border:1px solid var(--line);border-radius:4px;padding:0 6px;color:var(--muted)}
.qt{font-family:var(--serif);font-size:18px;line-height:1.65;margin:12px 0}
.qt u{text-decoration-thickness:2px;text-underline-offset:3px}
.box{border:1.5px solid var(--navy);background:var(--navy-soft);padding:10px 14px;border-radius:6px;font-family:var(--serif);font-size:15.5px;line-height:1.75;margin:0 0 12px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:11px 12px;font-family:var(--serif);font-size:16px;line-height:1.55}
.opt .no{font-family:var(--sans);font-weight:700;color:var(--navy);flex:none}
.opt:hover{border-color:var(--navy)}
.opt.sel{border:2px solid var(--navy);background:var(--navy-soft)}
.opt.right{border:2px solid var(--ok);background:var(--ok-soft)}
.opt.wrong{border:2px solid var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.fb{margin-top:16px;border-top:1px dashed var(--line);padding-top:14px}
.verdict{font-weight:700;font-size:15px}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.ex{background:var(--bg);border-left:4px solid var(--navy);padding:10px 12px;border-radius:0 6px 6px 0;margin-top:8px;font-size:14.5px}
.wr{font-size:14px;color:var(--muted);margin-top:8px}
.wr b.l{color:var(--bad)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}
/* 결과 */
.score{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.score .big{font-family:var(--serif);font-size:48px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums}
.score .of{color:var(--muted)}
.byPart{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:14px}
.bp{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--paper);font-size:13px}
.bp b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;gap:6px;margin-top:16px}
.li{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:10px 12px}
.li .mk{flex:none;font-weight:700;width:22px}
.li .mk.ok{color:var(--ok)} .li .mk.bad{color:var(--bad)}
.li .tx{min-width:0;font-size:14px}
.li .tx small{display:block;color:var(--muted)}
.empty{color:var(--muted);background:var(--paper);border:1px dashed var(--line);border-radius:10px;padding:16px;margin-top:10px;font-size:14px}
@media (prefers-reduced-motion:no-preference){.opt,.dot,.set{transition:border-color .15s,background .15s}}
@media (max-width:480px){.qt{font-size:17px}.opt{font-size:15px}h1{font-size:24px}}
</style>

<script>window.__DATA__=[{"id": "q1", "title": "점검퀴즈 1", "kind": "예상 문제", "range": "17a~21b · 서두~신탁", "qs": [{"q": "『소크라테스의 변명』 서두(17a~b)에서 고발자들이 한 많은 거짓말 가운데 소크라테스에게 '유독 정말 놀라운 것'으로 여겨진 것은?", "box": null, "o": ["소크라테스가 국가가 믿는 신들을 믿지 않는다는 말", "소크라테스가 돈을 받고 젊은이들을 가르친다는 말", "소크라테스가 말하는 데 능란하니 그에게 기만당하지 않도록 조심해야 한다는 말", "소크라테스가 땅 아래와 하늘의 일들을 탐구한다는 말"], "a": [3], "s": 1, "part": "서두", "e": "17a: 고발자들은 \"내가 말하는 데 능란하니까 여러분은 나한테 기만당하지 않도록 조심해야 한다\"고 말했다. 소크라테스는 실제로 말을 시작하면 <b>말재주가 없다는 것이 곧바로 드러날 텐데도 그 거짓말을 부끄러워하지 않는 것<\/b>을 고발자들의 가장 몰염치한 점이라고 한다.", "w": "①④는 고발 내용이긴 하지만 서두에서 '가장 놀라운 거짓말'로 꼽은 것이 아니다. ② 돈을 받고 가르친다는 소문은 19d~e에서 따로 부정한다."}, {"q": "『소크라테스의 변명』 서두(17b~18a)에서 소크라테스가 재판관들에게 요청하거나 밝힌 내용으로 옳지 <u>않은<\/u> 것은?", "box": null, "o": ["시장의 환전상 근처에서 입버릇처럼 쓰던 말로 항변하더라도 놀라거나 소란을 벌이지 말아 달라.", "일흔 살이 되어 처음 재판정에 섰으니, 미사여구로 꾸민 연설을 하더라도 너그럽게 들어 달라.", "말투가 어떤 방식인지는 문제 삼지 말고, 정의로운 말을 하는지만 살펴봐 달라.", "만약 자신이 외국인이라면 양육받을 때 쓰던 방언으로 말해도 용서해 줄 것이다."], "a": [2], "s": 2, "part": "서두", "e": "소크라테스는 오히려 <b>미사여구로 꾸미거나 질서 있게 배열한 말이 아니라 단어가 떠오르는 대로 두서없이 하는 말<\/b>을 듣게 될 것이라고 한다(17b~c). 이 나이에 젊은 애처럼 말을 지어내며 나서는 것은 적절하지 않다는 것이다.", "w": "① 17c, ③ 18a, ④ 17d~18a 외국인 비유 — 모두 본문 내용이다."}, {"q": "빈칸에 들어갈 말을 알맞게 짝지은 것은?", "box": "“말투가 어떤 방식인지는 문제 삼지 말고 (혹시 더 형편없을 수도 있고 더 괜찮을 수도 있을 테니까요) 그저 내가 정의로운 말을 하는지 그렇지 않은지만 살펴보고 그것에만 주의를 기울여 달라고 말입니다. 바로 이것이 (　㉠　)의 덕(德)이고, (　㉡　)의 덕은 진실을 말하는 것이기 때문입니다.”", "o": ["㉠ 재판관 ㉡ 연설가", "㉠ 연설가 ㉡ 재판관", "㉠ 시민 ㉡ 철학자", "㉠ 재판관 ㉡ 철학자"], "a": [1], "s": 1, "part": "서두", "e": "18a, 서두의 마지막 문장. 재판관의 덕은 <b>말투가 아니라 말이 정의로운지만 살피는 것<\/b>이고, 연설가의 덕은 <b>진실을 말하는 것<\/b>이다. 고발자들이 소크라테스를 '능란한 연설가'라 부른 것을 뒤집어, 연설가의 기준을 '설득력'에서 '진실'로 바꾼다.", "w": null}, {"q": "『소크라테스의 변명』 18b~d에서 소크라테스가 '오래전 고발자들'이 아뉘토스 등 '나중 고발자들'보다 더 무섭다고 말하며 든 이유로 옳지 <u>않은<\/u> 것은?", "box": null, "o": ["그들은 다수이고 이미 오랜 시간 동안 고발을 해 왔다.", "재판관들이 아이거나 청년이어서 아주 잘 믿어 버리는 나이일 때 그들을 상대로 말했다.", "항변하는 사람 하나 없이 순전히 결석 재판으로 고발했다.", "희극 작가 한 사람 말고는 이름조차 알 수 없어, 그림자와 싸우듯 항변해야 한다."], "a": [5], "s": 2, "part": "고발 구도", "e": "①~④ 모두 18b~d에 나오는 이유다. 오래전 고발자들은 <b>다수·오랜 기간·잘 믿는 나이의 청중·결석 재판·익명<\/b>이라는 점에서 더 상대하기 어렵다. 그래서 정답은 ⑤ 답 없음.", "w": "'희극 작가'는 아리스토파네스를 가리킨다(19c에서 『구름』을 언급)."}, {"q": "『소크라테스의 변명』 18c에서 소크라테스는 옛 고발자들의 소문을 들은 사람들이 '이런 것들을 탐구하는 사람들'에 대해 어떻게 생각한다고 말하는가?", "box": null, "o": ["돈을 받고 젊은이들을 가르친다고 생각한다.", "신들도 안 믿는다고 생각한다.", "국가의 법률을 무시한다고 생각한다.", "참주정을 꿈꾼다고 생각한다."], "a": [2], "s": 1, "part": "고발 구도", "e": "18c: \"듣는 사람들은 이런 것들을 탐구하는 사람들이 <b>신들도 안 믿는다<\/b>고 생각하거든요.\" 천상과 지하를 탐구하는 자연철학자 = 무신론자라는 당시의 통념이 옛 비방을 무섭게 만든 이유다. 이 통념이 나중에 공식 고발장의 '신을 믿지 않는다' 항목으로 이어진다.", "w": null}, {"q": "『소크라테스의 변명』 19c에서 소크라테스가 언급한 아리스토파네스의 희극 속 '소크라테스'의 모습으로 옳은 것은?", "box": null, "o": ["시장의 환전상 근처에서 돈을 받고 젊은이들에게 연설술을 가르친다.", "해는 돌이고 달은 흙이라고 주장하는 책을 써서 판다.", "공중을 걷는다고 공언하며 해먹에 실려 이리저리 흔들거린다.", "델피에 가서 자기보다 더 지혜로운 사람이 있는지를 신탁에 묻는다."], "a": [3], "s": 1, "part": "옛 고발 해명", "e": "19c: 희극에서 소크라테스라는 사람이 <b>공중을 걷는다고 공언<\/b>하고 <b>해먹에 실려 흔들거리는<\/b> 모습을 여러분도 보았다고 말한다(아리스토파네스 『구름』). 소크라테스는 그런 것들에 대해 \"크든 작든 아무것도 아는 바가 없다\"고 한다.", "w": "② 해는 돌·달은 흙은 아낙사고라스의 주장(26d). ④ 신탁에 물은 사람은 카이레폰(21a)."}, {"q": "『소크라테스의 변명』 19b에서 소크라테스가 읽어 보인 '옛 고발자들의 고발장'에 포함되지 <u>않은<\/u> 내용은?", "box": null, "o": ["땅 아래의 일들과 하늘의 일들을 탐구한다.", "더 약한 논변을 더 강하게 만든다.", "다른 사람들에게 바로 이것들을 가르친다.", "젊은이들을 망친다."], "a": [4], "s": 2, "part": "옛 고발 해명", "e": "옛 고발장(19b): \"소크라테스는 <b>땅 아래의 일들과 하늘의 일들을 탐구<\/b>하고 <b>더 약한 논변을 더 강하게<\/b> 만들며, 다른 사람들에게 바로 이것들을 <b>가르침<\/b>으로써 불의를 행하고 있고 주제넘은 일을 하고 있다.\" '젊은이들을 망친다'는 멜레토스의 <b>공식 고발장(24b~c)<\/b>에 나오는 항목이다.", "w": "두 고발장을 구분하는 문제. 옛 고발 = 자연철학자 + 소피스트 이미지 / 새 고발 = 젊은이 타락 + 국가의 신 불신 + 새로운 신령."}, {"q": "『소크라테스의 변명』 19e~20a에서 소크라테스가 언급한, 사람들을 교육하고 돈을 받는 인물과 출신지를 짝지은 것으로 옳지 <u>않은<\/u> 것은?", "box": null, "o": ["레온티니 출신 고르기아스", "케오스 출신 프로디코스", "클라조메나이 출신 히피아스", "파로스 출신 에우에노스"], "a": [3], "s": 2, "part": "옛 고발 해명", "e": "히피아스는 <b>엘리스<\/b> 출신이다(19e). 클라조메나이는 26d에 나오는 <b>아낙사고라스<\/b>의 출신지다.", "w": "고르기아스(레온티니)·프로디코스(케오스)·히피아스(엘리스)는 각 도시를 돌며 젊은이들을 설득해 돈을 받고 가르친 소피스트들이고, 에우에노스(파로스)는 칼리아스가 아들들의 교사로 둔 사람이다(20b)."}, {"q": "『소크라테스의 변명』 20a~c의 칼리아스와의 대화에 대한 설명으로 옳은 것은?", "box": null, "o": ["소크라테스는 칼리아스의 두 아들을 위한 감독자로 말 조련사를 추천했다.", "칼리아스는 소피스트들에게 다른 사람들 모두가 지불한 것보다 더 많은 돈을 지불한 사람이다.", "칼리아스에 따르면 에우에노스는 10므나를 받고 가르친다.", "소크라테스는 에우에노스가 그 기술을 가졌다 해도 너무 비싼 값을 받는다고 비판했다."], "a": [2], "s": 2, "part": "옛 고발 해명", "e": "20a: 칼리아스는 <b>소피스트들에게 다른 사람들 모두가 지불한 것보다 더 많은 돈을 지불한 사람<\/b>이다. 소크라테스는 아들이 망아지·송아지라면 말 조련사나 농부를 구하겠지만, 인간이니 <b>인간적이고 시민적인 덕<\/b>을 아는 사람이 누구냐고 묻는다.", "w": "① 말 조련사는 '아들이 망아지라면'이라는 가정 속의 예. ③ 5므나. ④ 정말 그 기술이 있고 그렇게 적당한 값에 가르친다면 '축복받은 사람'이라고 했다(반어적 표현)."}, {"q": "『소크라테스의 변명』 20d~21a의 내용으로 옳지 <u>않은<\/u> 것은?", "box": null, "o": ["소크라테스는 '인간적인 지혜'라 할 만한 어떤 지혜 때문에 '지혜로운 사람'이라는 이름을 얻게 되었다고 말한다.", "소크라테스는 자기 지혜에 대한 증인으로 델피에 있는 신을 내세운다.", "카이레폰은 소크라테스보다 더 지혜로운 사람이 있는지를 신탁에 물었고, 퓌티아는 아무도 없다고 대답했다.", "카이레폰이 직접 법정에 나와 신탁의 내용을 증언한다."], "a": [4], "s": 2, "part": "신탁과 탐색", "e": "카이레폰은 <b>이미 고인<\/b>이 되었기 때문에, 그의 <b>형제<\/b>가 증인이 되어 줄 것이라고 한다(21a).", "w": "① 20d~e 인간적인 지혜 ↔ 인간에게 속하는 것보다 더 큰 지혜. ② 20e \"이야기는 내 것이 아니라\"(에우리피데스 인용). ③ 21a."}]}, {"id": "q2", "title": "점검퀴즈 2", "kind": "예상 문제", "range": "21b~24b · 탐색~비방", "qs": [{"q": "『소크라테스의 변명』 21b~c에서 신탁을 전해 들은 소크라테스의 반응과 행동으로 옳지 <u>않은<\/u> 것은?", "box": null, "o": ["자신이 크든 작든 어떤 점에서도 지혜롭지 않다는 것을 알고 있었기에 신탁을 수수께끼로 여겼다.", "신은 절대 거짓을 말하지 않는다고 생각했다. 그것은 법도상 신에게 어울리지 않는 일이기 때문이다.", "오랜 시간 고심한 끝에 어렵사리 탐색의 방향을 잡았다.", "신탁이 옳다는 것을 처음부터 증명하기 위해 지혜롭다고 여겨지는 사람을 찾아갔다."], "a": [4], "s": 2, "part": "신탁과 탐색", "e": "21b~c: 소크라테스는 \"어디에선가 할 수 있다면 거기서 <b>그 예언을 논박<\/b>하고\" 신탁에게 \"여기 이 사람이 나보다 지혜로운데\"라고 보여 주기 위해 갔다. 출발점은 증명이 아니라 <b>반박 시도<\/b>였다. 그 시도가 실패하면서 오히려 신탁이 '논박될 수 없는 것'이 된다(22a).", "w": "①②③ 모두 21b 본문 그대로다."}, {"q": "정치인과 대화한 뒤 소크라테스가 내린 결론이다. 빈칸에 들어갈 말을 알맞게 짝지은 것은?", "box": "“이 사람보다는 내가 더 지혜롭다. 왜냐하면 우리 둘 다 아름답고 훌륭한 것을 전혀 알지 못하는 것 같은데, 이 사람은 어떤 것을 (　㉠　)도 안다고 생각하는 반면에 나는 내가 실제로 알지 못하니까 바로 그렇게 (　㉡　)고 생각도 하기 때문이다.”", "o": ["㉠ 알지 못하면서 ㉡ 알지 못한다", "㉠ 알면서 ㉡ 모른다", "㉠ 알지 못하면서 ㉡ 안다", "㉠ 알면서 ㉡ 안다"], "a": [1], "s": 1, "part": "신탁과 탐색", "e": "21d, 이른바 '무지의 자각'. 둘 다 아름답고 훌륭한 것을 모르지만, 정치인은 <b>모르면서 안다고 생각<\/b>하고 소크라테스는 <b>모르니까 모른다고 생각<\/b>한다. 바로 이 점에서 \"조금은 더 지혜로운 것 같다\".", "w": null}, {"q": "『소크라테스의 변명』에서 소크라테스가 신탁의 뜻을 따져 보기 위해 찾아간 사람들을 순서대로 바르게 배열한 것은?", "box": null, "o": ["시인들 → 정치인들 → 수공 기술자들", "정치인들 → 수공 기술자들 → 시인들", "정치인들 → 시인들 → 수공 기술자들", "소피스트들 → 정치인들 → 시인들"], "a": [3], "s": 1, "part": "신탁과 탐색", "e": "<b>정치인들(21c) → 시인들(22a, 비극·디튀람보스 시인 등) → 수공 기술자들(22c)<\/b>. 수공 기술자들한테는 \"끝으로\" 갔다고 말한다.", "w": null}, {"q": "『소크라테스의 변명』 22a~c에서 시인들에 대한 소크라테스의 평가로 옳은 것은?", "box": null, "o": ["시인들은 자기 시를 지혜로 짓기 때문에 적어도 시에 관해서는 정치인들보다 지혜롭다.", "시인들은 예언자나 신탁 전달자들처럼 모종의 본성에 따라, 신 지펴서 시를 짓는다.", "시인들은 자신이 지은 시를 참석자들 누구보다도 잘 설명했다.", "시인들은 시 짓는 기술 외의 다른 일에서는 자신이 무지하다는 것을 인정했다."], "a": [2], "s": 1, "part": "신탁과 탐색", "e": "22b~c: 시인들은 <b>지혜로 짓는 게 아니라 모종의 본성에 따라, 신 지펴서(영감으로)<\/b> 짓는다. 예언자·신탁 전달자처럼 멋진 것들을 말하지만 자기가 말하는 것을 알지 못한다.", "w": "① 지혜로 짓는 것이 아니다. ③ 거의 모든 참석자들이 그들보다 더 잘 설명할 수 있었을 것이라고 했다. ④ 오히려 시 짓는 기술 때문에 다른 것들에서도 자기들이 가장 지혜롭다고 생각했다."}, {"q": "『소크라테스의 변명』 22c~e에서 수공 기술자들과의 대화에 대한 설명으로 옳지 <u>않은<\/u> 것은?", "box": null, "o": ["소크라테스는 그들의 지혜와 무지를 둘 다 가지는 편이 자신에게 유익하다고 대답했다.", "소크라테스는 그들이 많은 멋진 것들을 알고 있으리라 기대했고, 그 기대는 틀리지 않았다.", "그들은 소크라테스가 알지 못하는 것들을 알고 있었고, 그런 면에서 소크라테스보다 더 지혜로웠다.", "그들은 자기 기술을 멋지게 실행해 낸다는 이유로 가장 중요한 다른 것들에서도 자기가 가장 지혜롭다고 생각했다."], "a": [1], "s": 2, "part": "신탁과 탐색", "e": "22e: 소크라테스는 자신과 신탁에게 <b>\"지금 내 상태 그대로 있는 게 내게 유익하다\"<\/b>고 대답했다. 즉 장인들의 기술적 지혜도 없고 그들의 무지(모르면서 안다고 생각하는 것)도 없는 상태를 택했다.", "w": "② 22d, ③ 22d, ④ 22d: 시인들과 똑같은 잘못. 이 실수가 저 지혜를 무색하게 했다."}, {"q": "빈칸에 들어갈 말로 가장 알맞은 것은?", "box": "“자, 그럼 여러분에게 나의 편력을, 예언이 논박될 수 없는 것이 되게 하려고 마치 어떤 (　　　)들을 수행하듯 펼친 나의 편력을 보여 주어야겠습니다.”", "o": ["제사", "원정", "시험", "노역"], "a": [4], "s": 3, "part": "신탁과 탐색", "e": "22a: \"예언이 논박될 수 없는 것이 되게 하려고 마치 어떤 <b>노역들<\/b>을 수행하듯 펼친 나의 편력\". 헤라클레스의 '12가지 노역'을 떠올리게 하는 표현으로, 소크라테스의 검토 활동을 신이 맡긴 고된 과업처럼 그린다.", "w": null}, {"q": "『소크라테스의 변명』 22e~23c의 내용으로 옳지 <u>않은<\/u> 것은?", "box": null, "o": ["검토로부터 가혹하고 지독한 미움이 생겨났고, 그 미움으로부터 많은 비방이 생겨났다.", "소크라테스가 누군가를 논박할 때마다 곁에 있는 사람들은 소크라테스 자신이 그 주제에 관해 지혜롭다고 생각했다.", "신은 소크라테스를 본으로 삼아, 그의 이름은 그냥 덧붙여 사용한 것으로 보인다.", "소크라테스는 신에 대한 봉사 때문에 극도로 가난한 상태에 처해 있다."], "a": [5], "s": 2, "part": "미움과 비방", "e": "①~④ 모두 본문 내용이므로 정답은 ⑤. 소크라테스의 해석에 따르면 신탁은 \"인간적인 지혜는 거의 혹은 아예 가치가 없다\"는 말이고, <b>자기가 지혜와 관련해 참으로 아무런 가치가 없다는 것을 아는 사람이 가장 지혜롭다<\/b>는 뜻이다(23a~b).", "w": "① 22e~23a ② 23a ③ 23a~b ④ 23b~c"}, {"q": "『소크라테스의 변명』 23c~d에서 젊은이들이 소크라테스를 흉내 내어 사람들을 검토한 일과 관련된 설명으로 옳은 것은?", "box": null, "o": ["소크라테스가 젊은이들에게 사람들을 검토하라고 시켰다.", "검토받은 사람들은 젊은이들이 아니라 자기 자신에게 화를 냈다.", "검토받은 사람들은 무엇을 가르치느냐는 물음에 답이 막히자, 당황한 것으로 보이지 않으려고 지혜를 사랑하는 모든 사람들에게 손쉽게 쓰이는 비난을 했다.", "검토받은 사람들은 소크라테스가 가르친 구체적인 내용을 들어 그가 젊은이들을 망친다고 말했다."], "a": [3], "s": 2, "part": "미움과 비방", "e": "23d: 그들은 아무 할 말이 없지만 <b>당황하는 것으로 보이지 않으려고<\/b> \"천상의 것들과 지하의 것들\", \"신들을 믿지 않는다\", \"더 약한 논변을 더 강한 논변으로 만든다\" 같은 <b>상투적 비난<\/b>을 한다.", "w": "① 가장 부유한 집안 아들들이 누가 시키지 않았는데도 스스로 따라다녔다. ② 자신들에게가 아니라 소크라테스에게 화를 냈다. ④ 무엇을 가르치느냐고 물으면 아무 할 말이 없다."}, {"q": "『소크라테스의 변명』 23e에서 멜레토스, 아뉘토스, 뤼콘이 각각 대변하여 성을 낸 집단을 바르게 짝지은 것은?", "box": null, "o": ["멜레토스 - 정치인들 / 아뉘토스 - 시인들 / 뤼콘 - 장인들", "멜레토스 - 시인들 / 아뉘토스 - 장인들과 정치인들 / 뤼콘 - 연설가들", "멜레토스 - 연설가들 / 아뉘토스 - 시인들 / 뤼콘 - 장인들과 정치인들", "멜레토스 - 시인들 / 아뉘토스 - 연설가들 / 뤼콘 - 장인들과 정치인들"], "a": [2], "s": 1, "part": "미움과 비방", "e": "23e: <b>멜레토스는 시인들<\/b>을, <b>아뉘토스는 장인들과 정치인들<\/b>을, <b>뤼콘은 연설가들<\/b>을 대변했다. 소크라테스의 검토에서 체면을 잃은 집단들이 세 고발자를 통해 공식 고발로 나선 셈이다.", "w": null}, {"q": "『소크라테스의 변명』 24a에서 소크라테스가 '자신이 진실을 말하고 있다는 것을 보여 주는 증거'라고 말한 것은?", "box": null, "o": ["많은 재판관들이 그의 대화를 직접 들어 본 증인이라는 것", "카이레폰의 형제가 신탁에 대해 증언해 줄 것이라는 것", "바로 이런 것들(검토 활동) 때문에 자신이 미움을 사고 있다는 것", "신은 절대 거짓을 말하지 않는다는 것"], "a": [3], "s": 3, "part": "미움과 비방", "e": "24a: \"바로 이런 것들로 해서 내가 <b>미움을 사고 있다는 걸<\/b> 나는 꽤 잘 알고 있습니다. 그게 또 내가 진실을 말하고 있다는 걸 보여 주는 증거이기도 합니다.\" 미움이라는 결과가 곧 비방의 원인이 검토 활동이라는 해명의 증거라는 논리다.", "w": "① 19d의 자연철학 관련 증인, ② 21a 신탁 증언, ④ 21b 소크라테스의 생각 — 모두 다른 맥락이다."}]}, {"id": "q3", "title": "점검퀴즈 3", "kind": "예상 문제", "range": "24b~28b · 멜레토스 심문", "qs": [{"q": "다음은 멜레토스 등 나중 고발자들의 고발장이다. 빈칸에 들어갈 말을 알맞게 짝지은 것은?", "box": "“소크라테스는 젊은이들을 (　㉠　), 국가가 믿는 신들을 믿지 않고 다른 새로운 (　㉡　)을 믿음으로써 불의를 행하고 있다.”", "o": ["㉠ 가르치고 ㉡ 신령스러운 것들", "㉠ 망치고 ㉡ 신령스러운 것들", "㉠ 망치고 ㉡ 영웅들", "㉠ 타락시키고 ㉡ 신들"], "a": [2], "s": 1, "part": "젊은이 논박", "e": "24b~c 공식 고발장: \"소크라테스는 젊은이들을 <b>망치고<\/b>, 국가가 믿는 신들을 믿지 않고 다른 새로운 <b>신령스러운 것들<\/b>을 믿음으로써 불의를 행하고 있다.\" 이 '신령스러운 것들'이 27b~e 논박의 열쇠가 된다.", "w": null}, {"q": "『소크라테스의 변명』 24c에서 소크라테스가 \"오히려 멜레토스가 불의를 행하고 있다\"고 주장한 이유로 옳은 것은?", "box": null, "o": ["조금도 관심을 가져 본 적 없는 일들에 관해 진지한 척하며 사람들을 경솔하게 법정에 세워, 진지한 일을 장난으로 대하기 때문이다.", "아뉘토스에게 돈을 받고 거짓 고발을 했기 때문이다.", "항변할 기회도 주지 않고 결석 재판으로 고발했기 때문이다.", "시인들을 대변하여 사사로운 분노로 고발했기 때문이다."], "a": [1], "s": 2, "part": "젊은이 논박", "e": "24c: 멜레토스는 <b>관심을 가져 본 적 없는 일들에 관해 진지한 척, 마음을 쓰는 척<\/b>하며 사람들을 경솔하게 법정에 세워 <b>진지한 일을 장난으로 대한다<\/b>. '멜레토스(Melētos)'라는 이름과 '관심을 갖다(melei)'를 엮은 말장난이 심문 내내 이어진다.", "w": "③ 결석 재판은 오래전 고발자들(18c)에 대한 말. ④ 멜레토스가 시인들을 대변했다는 것은 23e의 설명이지 '불의를 행한다'는 근거가 아니다."}, {"q": "『소크라테스의 변명』 24d~25a에서 \"누가 젊은이들을 더 훌륭하게 만드는가?\"라는 소크라테스의 물음에 멜레토스가 답한 순서로 옳은 것은?", "box": null, "o": ["재판관들 → 법률들 → 방청객들 → 평의회 의원들 → 민회 구성원들", "법률들 → 재판관들 → 평의회 의원들 → 방청객들 → 민회 구성원들", "법률들 → 평의회 의원들 → 재판관들 → 민회 구성원들 → 방청객들", "법률들 → 민회 구성원들 → 재판관들 → 방청객들 → 평의회 의원들"], "a": [5], "s": 3, "part": "젊은이 논박", "e": "실제 순서는 <b>법률들 → 재판관들 → 방청객들 → 평의회 의원들 → 민회 구성원들<\/b>이다(24d~25a). 보기 중 이 순서와 같은 것이 없으므로 정답은 ⑤. 결국 \"나를 빼놓고 아테네인들 전부가\" 젊은이를 훌륭하게 만든다는 답에 이른다.", "w": "② 방청객과 평의회 의원의 순서가 바뀌었다. ①은 처음 두 개의 순서가 바뀌었다."}, {"q": "『소크라테스의 변명』 25a~c의 말(馬)의 비유를 통해 소크라테스가 보여 주려 한 것으로 가장 적절한 것은?", "box": null, "o": ["젊은이도 말처럼 국가가 직접 맡아 공적으로 교육해야 한다.", "아테네인 전부가 젊은이를 훌륭하게 만든다는 멜레토스의 말은 말(馬)의 경우에도 들어맞는다.", "더 훌륭하게 만드는 사람은 한 사람이거나 아주 소수이고 다수는 오히려 망치는데, 멜레토스는 그 반대를 주장하므로 젊은이 문제에 관심을 가져 본 적이 없음이 드러난다.", "젊은이와 말은 본성이 같으므로 말 조련사가 젊은이도 가르쳐야 한다."], "a": [3], "s": 2, "part": "젊은이 논박", "e": "25b~c: 말을 더 훌륭하게 만드는 사람은 <b>말 조련사 같은 한 사람 또는 아주 소수<\/b>이고, 많은 사람들은 다루면 오히려 망친다. 멜레토스의 \"모두가 훌륭하게 만들고 나만 망친다\"는 주장은 이와 정반대이므로, 그가 <b>젊은이들에게 신경 써 본 적이 한 번도 없다<\/b>는 것이 드러난다.", "w": null}, {"q": "『소크라테스의 변명』 25c~26a에서 멜레토스가 소크라테스가 젊은이들을 \"의도적으로\" 망친다고 답한 뒤 이어진 소크라테스의 반박으로 옳지 <u>않은<\/u> 것은?", "box": null, "o": ["사악한 사람들은 늘 가장 가까이 있는 사람들에게 나쁜 일을 한다는 데 멜레토스도 동의했다.", "의도하지 않은 잘못이라도 법정에 세워 처벌하는 것이 법이다.", "함께 있는 사람을 몹쓸 사람으로 만들면 자신이 해를 입을 위험이 있다는 것도 모를 만큼 무지할 수는 없다.", "그러므로 자신은 망치고 있지 않거나, 망친다 해도 의도 없이 그러는 것이다."], "a": [2], "s": 2, "part": "젊은이 논박", "e": "26a: 의도하지 않은 잘못은 <b>법정에 세우는 게 아니라 개인적으로 붙잡아 가르치고 훈계하는 것이 법<\/b>이다. 배움이 아니라 처벌이 필요한 사람들을 법정에 세우는 것이다. 그런데 멜레토스는 가르치기는 피하고 법정에 세웠다.", "w": "① 25c 동의 ③ 25d~e ④ 25e~26a: 둘 중 어느 쪽으로 보든 멜레토스가 틀렸다."}, {"q": "『소크라테스의 변명』 26b~c에서 소크라테스가 두 가지 해석 중 어느 것이냐고 묻자, 멜레토스가 택한 고발 내용은?", "box": null, "o": ["소크라테스는 국가가 믿는 신들이 아닌 다른 신들이 있다고 믿으라고 가르친다.", "소크라테스는 신령들만 믿고 신들은 믿지 않는다.", "소크라테스는 해와 달을 새로운 신으로 섬기라고 가르친다.", "소크라테스는 전적으로 신들을 믿지 않으며, 다른 사람들에게도 그렇게 가르친다."], "a": [4], "s": 2, "part": "신 논박", "e": "26c: 멜레토스는 \"후자를, 즉 당신이 <b>전적으로 신들을 믿지 않는다<\/b>는 걸\" 말한다고 답한다. 그런데 이것은 고발장의 '다른 새로운 신령스러운 것들을 믿는다'와 충돌하고, 소크라테스는 바로 이 틈을 27a~e에서 파고든다.", "w": "① 소크라테스가 제시한 첫 번째 해석인데, 멜레토스는 이것을 택하지 않았다."}, {"q": "『소크라테스의 변명』 26d~e의 내용으로 옳은 것은?", "box": null, "o": ["멜레토스는 소크라테스가 해는 돌이고 달은 흙이라고 주장한다고 말했다.", "그런 주장이 담긴 책은 아브데라 출신 데모크리토스의 책이다.", "그 책들은 오르케스트라에서 많아 봐야 1므나면 살 수 있다.", "소크라테스는 해와 달이 신이 아니라는 데 동의하면서도 다른 신들은 믿는다고 말했다."], "a": [1], "s": 2, "part": "신 논박", "e": "26d: 멜레토스 — \"해는 돌이고 달은 흙이라고 주장하니까요.\" 소크라테스는 그건 <b>클라조메나이 출신 아낙사고라스<\/b>의 책 내용이며, <b>오르케스트라에서 많아 봐야 1드라크마<\/b>면 살 수 있다고 반박한다. 젊은이들이 그런 걸 굳이 자기한테서 배울 리 없다는 것이다.", "w": "② 아낙사고라스. ③ 1드라크마(1므나=100드라크마). ④ 해와 달에 대한 자기 생각은 밝히지 않는다."}, {"q": "『소크라테스의 변명』 28a에서 소크라테스가 \"나를 잡을 것\"이라고 말한 것은?", "box": null, "o": ["멜레토스의 고발장", "아뉘토스의 정치적 영향력", "많은 사람들의 비방과 시기", "재판관들의 무지"], "a": [3], "s": 1, "part": "항변 마무리", "e": "28a: \"나를 잡을 게 바로 이겁니다. <b>멜레토스도 아뉘토스도 아니고, 많은 사람들의 비방과 시기<\/b>입니다.\" 공식 고발의 논박은 이것으로 충분하고, 진짜 위험은 오래전부터 쌓인 미움이라는 것으로 항변을 마무리한다. 그것들이 다른 많은 훌륭한 사람들도 잡았고 앞으로도 잡을 것이라고 덧붙인다.", "w": null}, {"q": "『소크라테스의 변명』 27b~e에서 소크라테스가 멜레토스의 고발장이 자기모순임을 보이는 논증의 순서로 옳은 것은?<br>ㄱ. 신령스러운 활동들은 있다고 믿으면서 신령들은 믿지 않는 사람은 없다.<br>ㄴ. 멜레토스는 고발장에서 소크라테스가 신령스러운 것들을 믿는다고 서약까지 했다.<br>ㄷ. 신령들은 신들이거나 신들의 자식들이다.<br>ㄹ. 따라서 소크라테스는 신들을 믿는다.", "box": null, "o": ["ㄷ → ㄱ → ㄴ → ㄹ", "ㄴ → ㄷ → ㄱ → ㄹ", "ㄱ → ㄷ → ㄴ → ㄹ", "ㄱ → ㄴ → ㄷ → ㄹ"], "a": [4], "s": 3, "part": "신 논박", "e": "27b~d: 먼저 <b>ㄱ<\/b>(인간 활동↔인간, 말 활동↔말, 피리 연주↔피리 연주자처럼 신령스러운 활동↔신령)에 동의를 받고, <b>ㄴ<\/b> 고발장에 따르면 소크라테스는 신령스러운 것들을 믿으므로 신령들도 믿는다. 이어서 <b>ㄷ<\/b> 신령들은 신들이거나 신들의 자식이므로, <b>ㄹ<\/b> 어느 쪽이든 소크라테스는 신들을 믿는다. 결국 고발장은 \"신들을 믿지 않으면서 믿는다\"는 수수께끼가 된다.", "w": null}, {"q": "『소크라테스의 변명』 27d~e에서 신들의 자식들은 있다고 믿으면서 신들은 안 믿는 것이 엉뚱한 일임을 보이기 위해 소크라테스가 든 비유는?", "box": null, "o": ["피리 연주자들은 믿지 않으면서 피리 연주에 관련된 활동들은 믿는 것", "말과 나귀의 새끼인 노새들은 믿으면서 말과 나귀가 있다는 것은 믿지 않는 것", "말 조련사는 믿지 않으면서 훌륭한 말은 믿는 것", "인간에 관련된 활동들은 믿으면서 인간들은 믿지 않는 것"], "a": [2], "s": 2, "part": "신 논박", "e": "27e: \"누군가가 말들과 나귀들의 새끼들, 즉 <b>노새들은 믿으면서 말들과 나귀들이 있다는 건 믿지 않을<\/b> 때와 꼭 마찬가지로 엉뚱한 일\". 신령 = 신들의 (서출) 자식이라는 두 번째 경우에 쓰인 비유다.", "w": "①④ 피리 연주자·인간 비유는 27b에서 '활동을 믿으면 그 활동의 주체도 믿는다'(ㄱ단계)를 보이는 데 쓰였다. ③ 말 조련사는 25b 젊은이 논박의 비유. 부모-자식 관계(신령 = 신들의 자식)를 보이는 비유는 노새다."}]}];</script>
<script>
const SETS = window.__DATA__;
const C = '①②③④⑤';
const PARTS = ["서두", "고발 구도", "옛 고발 해명", "신탁과 탐색", "미움과 비방", "젊은이 논박", "신 논박", "항변 마무리"];
const ALL = [];
SETS.forEach(s => s.qs.forEach((q, i) => { q.id = s.id + '-' + (i + 1); q.src = s.title + ' ' + (i + 1) + '번'; q.o = q.o.concat(['답 없음']); ALL.push(q); }));
const BYID = Object.fromEntries(ALL.map(q => [q.id, q]));

const store = {
  get(k, d) { try { const v = localStorage.getItem('ap-' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('ap-' + k, JSON.stringify(v)); } catch (e) {} }
};
let mode = store.get('mode', 'practice');      // practice | exam
let wrong = new Set(store.get('wrong', []));
let best = store.get('best', {});
let partSel = new Set(store.get('parts', PARTS));
let S = null;   // 현재 풀이 상태

const $ = s => document.querySelector(s);
const app = $('#app');
const esc = t => String(t).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const stars = n => '★'.repeat(n) + '<i>' + '★'.repeat(3 - n) + '</i>';
const isRight = (q, pick) => pick != null && q.a.includes(pick);
const saveWrong = () => store.set('wrong', [...wrong]);
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function home() {
  S = null;
  location.hash = '';
  const cards = SETS.map(s => {
    const b = best[s.id];
    return `<button class="set" data-set="${s.id}">
      <span class="k">${s.kind}</span><span class="n">${s.title}</span>
      <span class="m"><span>${s.range} · ${s.qs.length}문항</span>${b != null ? `<span class="best">최고 ${b}/${s.qs.length}</span>` : '<span>아직 안 풂</span>'}</span>
    </button>`;
  }).join('');
  const pool = ALL.filter(q => partSel.has(q.part));
  app.innerHTML = `
    <div class="top">
      <div><div class="eyebrow">서양철학: 쟁점과 토론 · 플라톤</div><h1>소크라테스의 변명 점검퀴즈</h1></div>
      <div>
        <div class="seg" role="group" aria-label="풀이 방식">
          <button id="m-practice" aria-pressed="${mode === 'practice'}">연습 모드</button>
          <button id="m-exam" aria-pressed="${mode === 'exam'}">시험 모드</button>
        </div>
        <p class="hint">${mode === 'practice' ? '한 문제 고를 때마다 바로 채점하고 해설을 보여줘요.' : '끝까지 푼 뒤 제출하면 한꺼번에 채점해요.'}</p>
      </div>
    </div>
    <div class="sets">${cards}</div>
    <h2>단락별로 골라 풀기</h2>
    <div class="parts">${PARTS.map(p => `<button class="chip" data-part="${p}" aria-pressed="${partSel.has(p)}">${p} <span style="color:var(--muted)">${ALL.filter(q => q.part === p).length}</span></button>`).join('')}</div>
    <div class="row">
      <button class="btn" id="mix" ${pool.length ? '' : 'disabled'}>선택한 단락에서 랜덤 ${Math.min(20, pool.length)}문항</button>
      <button class="btn ghost" id="mixall" ${pool.length ? '' : 'disabled'}>선택한 단락 전부 (${pool.length}문항)</button>
    </div>
    <h2>오답노트</h2>
    ${wrong.size ? `<div class="row"><button class="btn" id="wrongs">틀린 문제 다시 풀기 (${wrong.size}문항)</button><button class="btn ghost" id="clearw">오답노트 비우기</button></div>`
      : `<div class="empty">아직 틀린 문제가 없어요. 문제를 풀다 틀리면 여기에 모여요. (맞히면 자동으로 빠져요)</div>`}
    <p class="hint" style="margin-top:22px">범위: 17a~28b (서두 ~ 멜레토스 심문, 항변의 마무리까지). 고전읽기 점검퀴즈 형식(5지선다, ⑤ 답 없음)으로 만든 예상 문제예요.</p>`;
  app.querySelectorAll('.set').forEach(b => b.onclick = () => start(SETS.find(s => s.id === b.dataset.set).title, SETS.find(s => s.id === b.dataset.set).qs, b.dataset.set));
  app.querySelectorAll('.chip').forEach(b => b.onclick = () => { const p = b.dataset.part; partSel.has(p) ? partSel.delete(p) : partSel.add(p); store.set('parts', [...partSel]); home(); });
  $('#m-practice').onclick = () => { mode = 'practice'; store.set('mode', mode); home(); };
  $('#m-exam').onclick = () => { mode = 'exam'; store.set('mode', mode); home(); };
  const mix = $('#mix'); if (mix) mix.onclick = () => start('단락별 랜덤', shuffle(pool).slice(0, 20));
  const mixall = $('#mixall'); if (mixall) mixall.onclick = () => start('단락별 전체', pool);
  const w = $('#wrongs'); if (w) w.onclick = () => start('오답노트', ALL.filter(q => wrong.has(q.id)));
  const cw = $('#clearw'); if (cw) cw.onclick = () => { if (cw.dataset.sure) { wrong.clear(); saveWrong(); home(); } else { cw.dataset.sure = 1; cw.textContent = '한 번 더 누르면 비워져요'; } };
}

function start(title, qs, setId) {
  S = { title, qs, setId, i: 0, picks: Array(qs.length).fill(null), done: false, t0: Date.now(), mode };
  location.hash = 'solve';
  render();
}

function render() {
  if (!S) return home();
  if (S.done) return result();
  const q = S.qs[S.i], pick = S.picks[S.i];
  const reveal = S.mode === 'practice' && pick != null;
  const dots = S.qs.map((qq, k) => {
    let c = 'dot';
    if (k === S.i) c += ' cur';
    const p = S.picks[k];
    if (p != null) c += S.mode === 'practice' ? (isRight(qq, p) ? ' ok' : ' bad') : ' done';
    return `<button class="${c}" data-k="${k}" aria-label="${k + 1}번">${k + 1}</button>`;
  }).join('');
  const opts = q.o.map((t, k) => {
    const n = k + 1;
    let c = 'opt';
    if (reveal) { if (q.a.includes(n)) c += ' right'; else if (pick === n) c += ' wrong'; }
    else if (pick === n) c += ' sel';
    return `<button class="${c}" data-n="${n}" ${reveal ? 'disabled' : ''}><span class="no">${C[k]}</span><span>${t}</span></button>`;
  }).join('');
  const answered = S.picks.filter(p => p != null).length;
  const ans = q.a.map(n => C[n - 1]).join(', ');
  app.innerHTML = `
    <div class="bar"><span class="ttl">${esc(S.title)}</span><span class="meta">${answered}/${S.qs.length} 풀이 · <span id="clock"></span> · ${S.mode === 'practice' ? '연습' : '시험'}</span></div>
    <div class="dots">${dots}</div>
    <div class="card">
      <div class="qhead"><span class="badge">문제 ${S.i + 1}</span><span class="star">${stars(q.s)}</span><span class="tag">${q.part}</span><span class="tag">${esc(q.src)}</span></div>
      <div class="qt">${q.q}</div>
      ${q.box ? `<div class="box">${q.box}</div>` : ''}
      <div class="opts">${opts}</div>
      ${reveal ? `<div class="fb">
        <div class="verdict ${isRight(q, pick) ? 'ok' : 'bad'}">${isRight(q, pick) ? '정답!' : '오답'} · 정답 ${ans}${q.a.length > 1 ? ' (복수 정답)' : ''}</div>
        <div class="ex">${q.e}</div>${q.w ? `<div class="wr"><b class="l">오답 체크</b> ${q.w}</div>` : ''}</div>` : ''}
    </div>
    <div class="nav">
      <button class="btn ghost" id="quit">그만 풀기</button>
      <div class="row" style="margin:0">
        <button class="btn ghost" id="prev" ${S.i === 0 ? 'disabled' : ''}>이전</button>
        ${S.i < S.qs.length - 1 ? `<button class="btn" id="next">다음</button>` : (S.back ? '' : `<button class="btn" id="submit">${S.mode === 'exam' ? '제출하고 채점' : '결과 보기'}</button>`)}
      </div>
    </div>`;
  app.querySelectorAll('.dot').forEach(b => b.onclick = () => { S.i = +b.dataset.k; render(); });
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    if (reveal) return;
    const n = +b.dataset.n;
    S.picks[S.i] = (S.mode === 'exam' && S.picks[S.i] === n) ? null : n;
    if (S.mode === 'practice') mark(q, n);
    render();
  });
  $('#quit').textContent = S.back ? '결과로 돌아가기' : '그만 풀기';
  $('#quit').onclick = () => { if (S.back) { S = S.back; render(); } else if (S.picks.some(p => p != null)) finish(); else home(); };
  $('#prev').onclick = () => { S.i--; render(); };
  const nx = $('#next'); if (nx) nx.onclick = () => { S.i++; render(); window.scrollTo(0, 0); };
  const sb = $('#submit'); if (sb) sb.onclick = () => {
    const left = S.picks.filter(p => p == null).length;
    if (S.mode === 'exam' && left && !sb.dataset.sure) { sb.dataset.sure = 1; sb.textContent = `안 푼 문제 ${left}개 — 그래도 제출`; return; }
    finish();
  };
  tick();
}

function mark(q, n) { if (isRight(q, n)) wrong.delete(q.id); else wrong.add(q.id); saveWrong(); }

function finish() {
  if (S.mode === 'exam') S.qs.forEach((q, k) => { if (S.picks[k] != null) mark(q, S.picks[k]); });
  S.done = true; S.secs = Math.round((Date.now() - S.t0) / 1000);
  const sc = S.qs.filter((q, k) => isRight(q, S.picks[k])).length;
  if (S.setId && S.picks.every(p => p != null)) { best[S.setId] = Math.max(best[S.setId] || 0, sc); store.set('best', best); }
  render();
}

function result() {
  const sc = S.qs.filter((q, k) => isRight(q, S.picks[k])).length;
  const parts = PARTS.filter(p => S.qs.some(q => q.part === p)).map(p => {
    const qs = S.qs.map((q, k) => [q, k]).filter(([q]) => q.part === p);
    const ok = qs.filter(([q, k]) => isRight(q, S.picks[k])).length;
    return `<div class="bp">${p}<b>${ok}/${qs.length}</b></div>`;
  }).join('');
  const items = S.qs.map((q, k) => {
    const ok = isRight(q, S.picks[k]), p = S.picks[k];
    return `<button class="li" data-k="${k}"><span class="mk ${ok ? 'ok' : 'bad'}">${ok ? 'O' : 'X'}</span><span class="tx">${k + 1}. ${q.q.replace(/<[^>]+>/g, '')}
      <small>내 답 ${p ? C[p - 1] : '안 풂'} · 정답 ${q.a.map(n => C[n - 1]).join(', ')} · ${q.part}</small></span></button>`;
  }).join('');
  const m = Math.floor(S.secs / 60), s = S.secs % 60;
  const wrongs = S.qs.filter((q, k) => !isRight(q, S.picks[k]));
  app.innerHTML = `
    <div class="bar"><span class="ttl">${esc(S.title)} · 결과</span><span class="meta">걸린 시간 ${m}분 ${s}초</span></div>
    <div class="card">
      <div class="score"><span class="big">${sc}</span><span class="of">/ ${S.qs.length}문항 맞힘 · ${Math.round(sc / S.qs.length * 100)}점</span></div>
      <div class="byPart">${parts}</div>
      <div class="row">
        ${wrongs.length ? `<button class="btn" id="redo">틀린 ${wrongs.length}문항만 다시</button>` : ''}
        <button class="btn ghost" id="again">처음부터 다시</button>
        <button class="btn ghost" id="home">목록으로</button>
      </div>
    </div>
    <h2>문항별 확인 (누르면 해설)</h2>
    <div class="list">${items}</div>`;
  app.querySelectorAll('.li').forEach(b => b.onclick = () => review(+b.dataset.k));
  const r = $('#redo'); if (r) r.onclick = () => start(S.title + ' · 오답', wrongs);
  $('#again').onclick = () => start(S.title, S.qs, S.setId);
  $('#home').onclick = home;
}

function review(k) {
  const prev = S;
  S = { title: prev.title + ' · 해설', qs: prev.qs, setId: null, i: k, picks: prev.picks.slice(), done: false, t0: Date.now(), mode: 'practice', back: prev };
  // 해설 보기: 연습 모드로 열어 정답과 해설이 바로 보이게 (안 푼 문제는 선택 시 채점)
  location.hash = 'solve';
  render();
}

let timer;
function tick() {
  clearInterval(timer);
  const f = () => { const el = $('#clock'); if (!el || !S) return clearInterval(timer); const t = Math.round((Date.now() - S.t0) / 1000); el.textContent = `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`; };
  f(); timer = setInterval(f, 1000);
}

window.addEventListener('hashchange', () => { if (location.hash !== '#solve' && S) home(); });
document.addEventListener('keydown', e => {
  if (!S || S.done) return;
  if (['1','2','3','4','5'].includes(e.key)) { const b = app.querySelector(`.opt[data-n="${e.key}"]`); if (b && !b.disabled) b.click(); }
  if (e.key === 'ArrowRight') { const b = $('#next'); if (b) b.click(); }
  if (e.key === 'ArrowLeft') { const b = $('#prev'); if (b && !b.disabled) b.click(); }
});
home();

</script>
