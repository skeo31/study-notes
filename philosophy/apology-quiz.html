<style>
/* 레이아웃: 한 문제씩 넘기는 시험지 카드 + 위쪽 문항 번호 줄. 남색 잉크 + 종이빛 바탕 */

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

</style>

<script>window.__DATA__=[{"id": "g1", "title": "기출 점검퀴즈", "kind": "기출", "range": "17a~28b · 실제 출제 10문항", "qs": [{"q": "소크라테스가 법정에서 처음에 자신의 말투를 이해해달라고 부탁하며 든 비유는 무엇인가?", "box": null, "o": ["전쟁터에서 처음 무기를 잡은 병사", "외국에서 자기 나라 말을 하는 이방인", "부모에게 칭얼거리는 어린아이", "물건을 팔기 위해 홍보하는 장사꾼"], "a": [2], "s": 1, "part": "서두", "e": "17d~18a <b>외국인 비유<\/b>: 일흔 살에 처음 법정에 선 자신은 이곳 말투에 외국인이나 다름없으니, 외국인이 자라면서 쓰던 방언으로 말해도 용서하듯 말투는 문제 삼지 말고 말이 정의로운지만 봐 달라.", "w": null}, {"q": "소크라테스가 말하는 오래된 고발자들에 대한 설명이 아닌 것은?", "box": null, "o": ["그들은 배심원들이 어릴 때부터 소크라테스에 대한 편견을 심어주었다.", "그들은 소크라테스를 하늘의 일들을 탐구하는 자라고 매도했다.", "그들 중에는 희극 작가인 아리스토파네스도 포함되어 있다.", "이들은 이름조차 알 수 없는 경우가 많아 반박하기가 훨씬 까다롭다."], "a": [5], "s": 2, "part": "고발 구도", "e": "①~④ 모두 본문 내용(18b~d, 19c) → ⑤ 답 없음.", "w": null}, {"q": "옛 고발자들이 퍼뜨린 비방 중 소크라테스를 '자연철학자'로 오해받게 만든 내용은 무엇인가?", "box": null, "o": ["부모를 공경하지 말라고 가르친다.", "하늘 위의 일들을 탐구하고 땅 밑의 일들을 캐내고 다닌다.", "국가가 지정한 신을 믿지 말고 자연을 숭배하라 한다.", "민주주의 체제를 전복하고 참주제를 지지한다."], "a": [2], "s": 1, "part": "옛 고발 해명", "e": "18b, 19b: \"<b>하늘에 있는 것들에 관해 사색하고 지하의 온갖 것들을 탐색<\/b>하며 더 약한 논변을 더 강하게 만든다.\"", "w": null}, {"q": "소크라테스가 시인들과의 대화를 통해 알아낸 것이 아닌 것은?", "box": null, "o": ["시인들은 자신들이 쓴 멋진 시의 의미를 제대로 설명하지 못했다.", "시인들은 지혜가 아니라 본성에 따라서, 신 지펴서 시를 쓴다.", "시인들은 시 짓는 기술 때문에 자신들이 다른 모든 일에도 지혜롭다고 착각했다.", "소크라테스는 시인들보다 지혜 면에서 자신이 부족함을 느끼고 자괴했다."], "a": [4], "s": 1, "part": "신탁과 탐색", "e": "22c: 오히려 정치인들에게서와 <b>같은 점에서 자신이 낫다<\/b>고 생각하며 떠났다. 자괴했다는 내용은 없다.", "w": null}, {"q": "소크라테스와 수공 기술자(장인)들과의 만남에 관한 설명 중 틀린 것은?", "box": null, "o": ["소크라테스는 기술자들이 자신보다 아는 것이 많을 것이라고 예상했다.", "실제로 기술자들은 소크라테스가 모르는 많은 멋진 것들을 알고 있었다.", "기술자들은 자신이 국가의 중대한 일들에 대해 지혜롭다고 생각했다.", "기술자들은 시인들과는 다르게 '자신이 잘 아는 것' 때문에 '모르는 것'까지 안다고 믿는 오류를 범했다."], "a": [4], "s": 2, "part": "신탁과 탐색", "e": "22d: 장인들은 <b>시인들과 똑같은 잘못<\/b>을 했다(다르게 ✗). 자기 기술을 멋지게 해낸다는 이유로 가장 중요한 다른 것들에서도 가장 지혜롭다고 생각했다.", "w": null}, {"q": "소크라테스의 다음 말에서, 빈 칸에 들어갈 알맞은 말은? \"나는 적어도 이 사람보다는 바로 이 점에서 조금은 더 지혜로운 것 같다. 나는 내가 알지 못하는 것들을 (　) 고 생각한다는 점에서 말이다.\"", "box": null, "o": ["알지 못한다", "실천하지 않는다", "중요하다", "불가능하다"], "a": [1], "s": 1, "part": "신탁과 탐색", "e": "21d <b>무지의 자각<\/b>: 모르는 것을 <b>모른다고<\/b> 생각한다.", "w": null}, {"q": "멜레토스, 아뉘토스, 뤼콘은 각각 어떤 부류의 사람들을 대변하여 소크라테스를 고발했는가?", "box": null, "o": ["[멜레토스 - 시인], [아뉘토스 - 장인과 정치가], [뤼콘 - 연설가]", "[멜레토스 - 장인], [아뉘토스 - 시인], [뤼콘 - 정치가]", "[멜레토스 - 연설가], [아뉘토스 - 정치가], [뤼콘 - 시인]", "[멜레토스 - 시인], [아뉘토스 - 연설가], [뤼콘 - 장인과 정치가]"], "a": [1], "s": 1, "part": "미움과 비방", "e": "23e.", "w": null}, {"q": "소크라테스가 젊은이들을 의도적으로 망친다는 멜레토스의 주장을 반박하는 논리로 가장 적절한 것은?", "box": null, "o": ["젊은이들이 나쁜 사람이 되는 것은 함께 지내는 사람의 가르침이 아니라 각자의 본성에 달려 있으므로, 소크라테스에게는 책임이 없다.", "함께 지내는 젊은이들을 나쁜 사람으로 만들면 자신도 그들에게서 해를 입을 위험이 있는데, 누구도 자신이 해를 입기를 바라지는 않는다.", "나쁜 사람들도 자신과 가까이 지내는 사람들에게는 이득을 주므로, 젊은이들을 망치는 일은 소크라테스 자신에게도 이익이 된다.", "소크라테스는 젊은이들과 함께 지내지 않으므로, 그들이 나쁜 사람이 되더라도 자신이 해를 입을 가능성은 없다."], "a": [2], "s": 2, "part": "젊은이 논박", "e": "25c~e: 나쁜 사람은 가까운 사람에게 나쁜 일을 하고, 아무도 해를 입기를 바라지 않으므로, 일부러 망칠 리 없다 → 망치지 않거나 의도 없이 망친다.", "w": null}, {"q": "어떤 일을 추구하다가 죽을 위험에 처했다는 이유로 그 일을 비난하는 사람에게, 소크라테스가 제시하는 행위의 판단 기준으로 가장 적절한 것은?", "box": null, "o": ["그 일이 정의로운 일인지 부정의한 일인지, 훌륭한 사람의 행동인지 나쁜 사람의 행동인지", "그 일이 자신의 목숨을 보전하는 데 도움이 되는지, 죽을 위험을 높이는지", "그 일이 많은 사람들에게 칭찬받는 일인지, 비난받는 일인지", "그 일이 자신의 의도에 따른 것인지, 다른 사람이 시켜서 한 것인지"], "a": [1], "s": 1, "part": "죽음과 사명", "e": "28b: 사느냐 죽느냐가 아니라 <b>정의로운가 부정의한가, 훌륭한 사람의 행동인가 나쁜 사람의 행동인가<\/b>만 따져야 한다.", "w": null}, {"q": "소크라테스가 많은 사람들의 비방과 시기에 관해 말한 내용으로 적절하지 않은 것은?", "box": null, "o": ["많은 사람들 사이에 자신에 대한 미움이 생겨나 있다고 말한다.", "자신이 실제로 파멸하게 된다면, 그 원인은 많은 사람들의 비방과 시기일 것이라고 본다.", "비방과 시기가 이미 다른 많은 훌륭한 사람들도 파멸시켰다고 밝힌다.", "비방과 시기가 앞으로도 계속 다른 사람들을 파멸시킬 것이며, 그 일이 자신에게서 끝나지는 않을 것이라고 본다."], "a": [5], "s": 1, "part": "항변 마무리", "e": "28a: ①~④ 모두 본문 내용 → ⑤ 답 없음.", "w": null}]}, {"id": "q1", "title": "점검퀴즈 1", "kind": "예상 문제", "range": "17a~21b · 서두~신탁", "qs": [{"q": "『소크라테스의 변명』 서두(17a~b)에서 고발자들이 한 많은 거짓말 가운데 소크라테스에게 '유독 정말 놀라운 것'으로 여겨진 것은?", "box": null, "o": ["소크라테스가 국가가 믿는 신들을 믿지 않는다는 말", "소크라테스가 돈을 받고 젊은이들을 가르친다는 말", "소크라테스가 말하는 데 능란하니 그에게 기만당하지 않도록 조심해야 한다는 말", "소크라테스가 땅 아래와 하늘의 일들을 탐구한다는 말"], "a": [3], "s": 1, "part": "서두", "e": "17a: 고발자들은 \"내가 말하는 데 능란하니까 여러분은 나한테 기만당하지 않도록 조심해야 한다\"고 말했다. 소크라테스는 실제로 말을 시작하면 <b>말재주가 없다는 것이 곧바로 드러날 텐데도 그 거짓말을 부끄러워하지 않는 것<\/b>을 고발자들의 가장 몰염치한 점이라고 한다.", "w": "①④는 고발 내용이긴 하지만 서두에서 '가장 놀라운 거짓말'로 꼽은 것이 아니다. ② 돈을 받고 가르친다는 소문은 19d~e에서 따로 부정한다."}, {"q": "『소크라테스의 변명』 서두(17b~18a)에서 소크라테스가 재판관들에게 요청하거나 밝힌 내용으로 옳지 <u>않은<\/u> 것은?", "box": null, "o": ["시장의 환전상 근처에서 입버릇처럼 쓰던 말로 항변하더라도 놀라거나 소란을 벌이지 말아 달라.", "일흔 살이 되어 처음 재판정에 섰으니, 미사여구로 꾸민 연설을 하더라도 너그럽게 들어 달라.", "말투가 어떤 방식인지는 문제 삼지 말고, 정의로운 말을 하는지만 살펴봐 달라.", "만약 자신이 외국인이라면 양육받을 때 쓰던 방언으로 말해도 용서해 줄 것이다."], "a": [2], "s": 2, "part": "서두", "e": "소크라테스는 오히려 <b>미사여구로 꾸미거나 질서 있게 배열한 말이 아니라 단어가 떠오르는 대로 두서없이 하는 말<\/b>을 듣게 될 것이라고 한다(17b~c). 이 나이에 젊은 애처럼 말을 지어내며 나서는 것은 적절하지 않다는 것이다.", "w": "① 17c, ③ 18a, ④ 17d~18a 외국인 비유 — 모두 본문 내용이다."}, {"q": "빈칸에 들어갈 말을 알맞게 짝지은 것은?", "box": "“말투가 어떤 방식인지는 문제 삼지 말고 (혹시 더 형편없을 수도 있고 더 괜찮을 수도 있을 테니까요) 그저 내가 정의로운 말을 하는지 그렇지 않은지만 살펴보고 그것에만 주의를 기울여 달라고 말입니다. 바로 이것이 (　㉠　)의 덕(德)이고, (　㉡　)의 덕은 진실을 말하는 것이기 때문입니다.”", "o": ["㉠ 재판관 ㉡ 연설가", "㉠ 연설가 ㉡ 재판관", "㉠ 시민 ㉡ 철학자", "㉠ 재판관 ㉡ 철학자"], "a": [1], "s": 1, "part": "서두", "e": "18a, 서두의 마지막 문장. 재판관의 덕은 <b>말투가 아니라 말이 정의로운지만 살피는 것<\/b>이고, 연설가의 덕은 <b>진실을 말하는 것<\/b>이다. 고발자들이 소크라테스를 '능란한 연설가'라 부른 것을 뒤집어, 연설가의 기준을 '설득력'에서 '진실'로 바꾼다.", "w": null}, {"q": "『소크라테스의 변명』 18b~d에서 소크라테스가 '오래전 고발자들'이 아뉘토스 등 '나중 고발자들'보다 더 무섭다고 말하며 든 이유로 옳지 <u>않은<\/u> 것은?", "box": null, "o": ["그들은 다수이고 이미 오랜 시간 동안 고발을 해 왔다.", "재판관들이 아이거나 청년이어서 아주 잘 믿어 버리는 나이일 때 그들을 상대로 말했다.", "항변하는 사람 하나 없이 순전히 결석 재판으로 고발했다.", "희극 작가 한 사람 말고는 이름조차 알 수 없어, 그림자와 싸우듯 항변해야 한다."], "a": [5], "s": 2, "part": "고발 구도", "e": "①~④ 모두 18b~d에 나오는 이유다. 오래전 고발자들은 <b>다수·오랜 기간·잘 믿는 나이의 청중·결석 재판·익명<\/b>이라는 점에서 더 상대하기 어렵다. 그래서 정답은 ⑤ 답 없음.", "w": "'희극 작가'는 아리스토파네스를 가리킨다(19c에서 『구름』을 언급)."}, {"q": "『소크라테스의 변명』 18c에서 소크라테스는 옛 고발자들의 소문을 들은 사람들이 '이런 것들을 탐구하는 사람들'에 대해 어떻게 생각한다고 말하는가?", "box": null, "o": ["돈을 받고 젊은이들을 가르친다고 생각한다.", "신들도 안 믿는다고 생각한다.", "국가의 법률을 무시한다고 생각한다.", "참주정을 꿈꾼다고 생각한다."], "a": [2], "s": 1, "part": "고발 구도", "e": "18c: \"듣는 사람들은 이런 것들을 탐구하는 사람들이 <b>신들도 안 믿는다<\/b>고 생각하거든요.\" 천상과 지하를 탐구하는 자연철학자 = 무신론자라는 당시의 통념이 옛 비방을 무섭게 만든 이유다. 이 통념이 나중에 공식 고발장의 '신을 믿지 않는다' 항목으로 이어진다.", "w": null}, {"q": "『소크라테스의 변명』 19c에서 소크라테스가 언급한 아리스토파네스의 희극 속 '소크라테스'의 모습으로 옳은 것은?", "box": null, "o": ["시장의 환전상 근처에서 돈을 받고 젊은이들에게 연설술을 가르친다.", "해는 돌이고 달은 흙이라고 주장하는 책을 써서 판다.", "공중을 걷는다고 공언하며 해먹에 실려 이리저리 흔들거린다.", "델피에 가서 자기보다 더 지혜로운 사람이 있는지를 신탁에 묻는다."], "a": [3], "s": 1, "part": "옛 고발 해명", "e": "19c: 희극에서 소크라테스라는 사람이 <b>공중을 걷는다고 공언<\/b>하고 <b>해먹에 실려 흔들거리는<\/b> 모습을 여러분도 보았다고 말한다(아리스토파네스 『구름』). 소크라테스는 그런 것들에 대해 \"크든 작든 아무것도 아는 바가 없다\"고 한다.", "w": "② 해는 돌·달은 흙은 아낙사고라스의 주장(26d). ④ 신탁에 물은 사람은 카이레폰(21a)."}, {"q": "『소크라테스의 변명』 19b에서 소크라테스가 읽어 보인 '옛 고발자들의 고발장'에 포함되지 <u>않은<\/u> 내용은?", "box": null, "o": ["땅 아래의 일들과 하늘의 일들을 탐구한다.", "더 약한 논변을 더 강하게 만든다.", "다른 사람들에게 바로 이것들을 가르친다.", "젊은이들을 망친다."], "a": [4], "s": 2, "part": "옛 고발 해명", "e": "옛 고발장(19b): \"소크라테스는 <b>땅 아래의 일들과 하늘의 일들을 탐구<\/b>하고 <b>더 약한 논변을 더 강하게<\/b> 만들며, 다른 사람들에게 바로 이것들을 <b>가르침<\/b>으로써 불의를 행하고 있고 주제넘은 일을 하고 있다.\" '젊은이들을 망친다'는 멜레토스의 <b>공식 고발장(24b~c)<\/b>에 나오는 항목이다.", "w": "두 고발장을 구분하는 문제. 옛 고발 = 자연철학자 + 소피스트 이미지 / 새 고발 = 젊은이 타락 + 국가의 신 불신 + 새로운 신령."}, {"q": "『소크라테스의 변명』 19e~20a에서 소크라테스가 언급한, 사람들을 교육하고 돈을 받는 인물과 출신지를 짝지은 것으로 옳지 <u>않은<\/u> 것은?", "box": null, "o": ["레온티니 출신 고르기아스", "케오스 출신 프로디코스", "클라조메나이 출신 히피아스", "파로스 출신 에우에노스"], "a": [3], "s": 2, "part": "옛 고발 해명", "e": "히피아스는 <b>엘리스<\/b> 출신이다(19e). 클라조메나이는 26d에 나오는 <b>아낙사고라스<\/b>의 출신지다.", "w": "고르기아스(레온티니)·프로디코스(케오스)·히피아스(엘리스)는 각 도시를 돌며 젊은이들을 설득해 돈을 받고 가르친 소피스트들이고, 에우에노스(파로스)는 칼리아스가 아들들의 교사로 둔 사람이다(20b)."}, {"q": "『소크라테스의 변명』 20a~c의 칼리아스와의 대화에 대한 설명으로 옳은 것은?", "box": null, "o": ["소크라테스는 칼리아스의 두 아들을 위한 감독자로 말 조련사를 추천했다.", "칼리아스는 소피스트들에게 다른 사람들 모두가 지불한 것보다 더 많은 돈을 지불한 사람이다.", "칼리아스에 따르면 에우에노스는 10므나를 받고 가르친다.", "소크라테스는 에우에노스가 그 기술을 가졌다 해도 너무 비싼 값을 받는다고 비판했다."], "a": [2], "s": 2, "part": "옛 고발 해명", "e": "20a: 칼리아스는 <b>소피스트들에게 다른 사람들 모두가 지불한 것보다 더 많은 돈을 지불한 사람<\/b>이다. 소크라테스는 아들이 망아지·송아지라면 말 조련사나 농부를 구하겠지만, 인간이니 <b>인간적이고 시민적인 덕<\/b>을 아는 사람이 누구냐고 묻는다.", "w": "① 말 조련사는 '아들이 망아지라면'이라는 가정 속의 예. ③ 5므나. ④ 정말 그 기술이 있고 그렇게 적당한 값에 가르친다면 '축복받은 사람'이라고 했다(반어적 표현)."}, {"q": "『소크라테스의 변명』 20d~21a의 내용으로 옳지 <u>않은<\/u> 것은?", "box": null, "o": ["소크라테스는 '인간적인 지혜'라 할 만한 어떤 지혜 때문에 '지혜로운 사람'이라는 이름을 얻게 되었다고 말한다.", "소크라테스는 자기 지혜에 대한 증인으로 델피에 있는 신을 내세운다.", "카이레폰은 소크라테스보다 더 지혜로운 사람이 있는지를 신탁에 물었고, 퓌티아는 아무도 없다고 대답했다.", "카이레폰이 직접 법정에 나와 신탁의 내용을 증언한다."], "a": [4], "s": 2, "part": "신탁과 탐색", "e": "카이레폰은 <b>이미 고인<\/b>이 되었기 때문에, 그의 <b>형제<\/b>가 증인이 되어 줄 것이라고 한다(21a).", "w": "① 20d~e 인간적인 지혜 ↔ 인간에게 속하는 것보다 더 큰 지혜. ② 20e \"이야기는 내 것이 아니라\"(에우리피데스 인용). ③ 21a."}]}, {"id": "q2", "title": "점검퀴즈 2", "kind": "예상 문제", "range": "21b~24b · 탐색~비방", "qs": [{"q": "『소크라테스의 변명』 21b~c에서 신탁을 전해 들은 소크라테스의 반응과 행동으로 옳지 <u>않은<\/u> 것은?", "box": null, "o": ["자신이 크든 작든 어떤 점에서도 지혜롭지 않다는 것을 알고 있었기에 신탁을 수수께끼로 여겼다.", "신은 절대 거짓을 말하지 않는다고 생각했다. 그것은 법도상 신에게 어울리지 않는 일이기 때문이다.", "오랜 시간 고심한 끝에 어렵사리 탐색의 방향을 잡았다.", "신탁이 옳다는 것을 처음부터 증명하기 위해 지혜롭다고 여겨지는 사람을 찾아갔다."], "a": [4], "s": 2, "part": "신탁과 탐색", "e": "21b~c: 소크라테스는 \"어디에선가 할 수 있다면 거기서 <b>그 예언을 논박<\/b>하고\" 신탁에게 \"여기 이 사람이 나보다 지혜로운데\"라고 보여 주기 위해 갔다. 출발점은 증명이 아니라 <b>반박 시도<\/b>였다. 그 시도가 실패하면서 오히려 신탁이 '논박될 수 없는 것'이 된다(22a).", "w": "①②③ 모두 21b 본문 그대로다."}, {"q": "정치인과 대화한 뒤 소크라테스가 내린 결론이다. 빈칸에 들어갈 말을 알맞게 짝지은 것은?", "box": "“이 사람보다는 내가 더 지혜롭다. 왜냐하면 우리 둘 다 아름답고 훌륭한 것을 전혀 알지 못하는 것 같은데, 이 사람은 어떤 것을 (　㉠　)도 안다고 생각하는 반면에 나는 내가 실제로 알지 못하니까 바로 그렇게 (　㉡　)고 생각도 하기 때문이다.”", "o": ["㉠ 알지 못하면서 ㉡ 알지 못한다", "㉠ 알면서 ㉡ 모른다", "㉠ 알지 못하면서 ㉡ 안다", "㉠ 알면서 ㉡ 안다"], "a": [1], "s": 1, "part": "신탁과 탐색", "e": "21d, 이른바 '무지의 자각'. 둘 다 아름답고 훌륭한 것을 모르지만, 정치인은 <b>모르면서 안다고 생각<\/b>하고 소크라테스는 <b>모르니까 모른다고 생각<\/b>한다. 바로 이 점에서 \"조금은 더 지혜로운 것 같다\".", "w": null}, {"q": "『소크라테스의 변명』에서 소크라테스가 신탁의 뜻을 따져 보기 위해 찾아간 사람들을 순서대로 바르게 배열한 것은?", "box": null, "o": ["시인들 → 정치인들 → 수공 기술자들", "정치인들 → 수공 기술자들 → 시인들", "정치인들 → 시인들 → 수공 기술자들", "소피스트들 → 정치인들 → 시인들"], "a": [3], "s": 1, "part": "신탁과 탐색", "e": "<b>정치인들(21c) → 시인들(22a, 비극·디튀람보스 시인 등) → 수공 기술자들(22c)<\/b>. 수공 기술자들한테는 \"끝으로\" 갔다고 말한다.", "w": null}, {"q": "『소크라테스의 변명』 22a~c에서 시인들에 대한 소크라테스의 평가로 옳은 것은?", "box": null, "o": ["시인들은 자기 시를 지혜로 짓기 때문에 적어도 시에 관해서는 정치인들보다 지혜롭다.", "시인들은 예언자나 신탁 전달자들처럼 모종의 본성에 따라, 신 지펴서 시를 짓는다.", "시인들은 자신이 지은 시를 참석자들 누구보다도 잘 설명했다.", "시인들은 시 짓는 기술 외의 다른 일에서는 자신이 무지하다는 것을 인정했다."], "a": [2], "s": 1, "part": "신탁과 탐색", "e": "22b~c: 시인들은 <b>지혜로 짓는 게 아니라 모종의 본성에 따라, 신 지펴서(영감으로)<\/b> 짓는다. 예언자·신탁 전달자처럼 멋진 것들을 말하지만 자기가 말하는 것을 알지 못한다.", "w": "① 지혜로 짓는 것이 아니다. ③ 거의 모든 참석자들이 그들보다 더 잘 설명할 수 있었을 것이라고 했다. ④ 오히려 시 짓는 기술 때문에 다른 것들에서도 자기들이 가장 지혜롭다고 생각했다."}, {"q": "『소크라테스의 변명』 22c~e에서 수공 기술자들과의 대화에 대한 설명으로 옳지 <u>않은<\/u> 것은?", "box": null, "o": ["소크라테스는 그들의 지혜와 무지를 둘 다 가지는 편이 자신에게 유익하다고 대답했다.", "소크라테스는 그들이 많은 멋진 것들을 알고 있으리라 기대했고, 그 기대는 틀리지 않았다.", "그들은 소크라테스가 알지 못하는 것들을 알고 있었고, 그런 면에서 소크라테스보다 더 지혜로웠다.", "그들은 자기 기술을 멋지게 실행해 낸다는 이유로 가장 중요한 다른 것들에서도 자기가 가장 지혜롭다고 생각했다."], "a": [1], "s": 2, "part": "신탁과 탐색", "e": "22e: 소크라테스는 자신과 신탁에게 <b>\"지금 내 상태 그대로 있는 게 내게 유익하다\"<\/b>고 대답했다. 즉 장인들의 기술적 지혜도 없고 그들의 무지(모르면서 안다고 생각하는 것)도 없는 상태를 택했다.", "w": "② 22d, ③ 22d, ④ 22d: 시인들과 똑같은 잘못. 이 실수가 저 지혜를 무색하게 했다."}, {"q": "빈칸에 들어갈 말로 가장 알맞은 것은?", "box": "“자, 그럼 여러분에게 나의 편력을, 예언이 논박될 수 없는 것이 되게 하려고 마치 어떤 (　　　)들을 수행하듯 펼친 나의 편력을 보여 주어야겠습니다.”", "o": ["제사", "원정", "시험", "노역"], "a": [4], "s": 3, "part": "신탁과 탐색", "e": "22a: \"예언이 논박될 수 없는 것이 되게 하려고 마치 어떤 <b>노역들<\/b>을 수행하듯 펼친 나의 편력\". 헤라클레스의 '12가지 노역'을 떠올리게 하는 표현으로, 소크라테스의 검토 활동을 신이 맡긴 고된 과업처럼 그린다.", "w": null}, {"q": "『소크라테스의 변명』 22e~23c의 내용으로 옳지 <u>않은<\/u> 것은?", "box": null, "o": ["검토로부터 가혹하고 지독한 미움이 생겨났고, 그 미움으로부터 많은 비방이 생겨났다.", "소크라테스가 누군가를 논박할 때마다 곁에 있는 사람들은 소크라테스 자신이 그 주제에 관해 지혜롭다고 생각했다.", "신은 소크라테스를 본으로 삼아, 그의 이름은 그냥 덧붙여 사용한 것으로 보인다.", "소크라테스는 신에 대한 봉사 때문에 극도로 가난한 상태에 처해 있다."], "a": [5], "s": 2, "part": "미움과 비방", "e": "①~④ 모두 본문 내용이므로 정답은 ⑤. 소크라테스의 해석에 따르면 신탁은 \"인간적인 지혜는 거의 혹은 아예 가치가 없다\"는 말이고, <b>자기가 지혜와 관련해 참으로 아무런 가치가 없다는 것을 아는 사람이 가장 지혜롭다<\/b>는 뜻이다(23a~b).", "w": "① 22e~23a ② 23a ③ 23a~b ④ 23b~c"}, {"q": "『소크라테스의 변명』 23c~d에서 젊은이들이 소크라테스를 흉내 내어 사람들을 검토한 일과 관련된 설명으로 옳은 것은?", "box": null, "o": ["소크라테스가 젊은이들에게 사람들을 검토하라고 시켰다.", "검토받은 사람들은 젊은이들이 아니라 자기 자신에게 화를 냈다.", "검토받은 사람들은 무엇을 가르치느냐는 물음에 답이 막히자, 당황한 것으로 보이지 않으려고 지혜를 사랑하는 모든 사람들에게 손쉽게 쓰이는 비난을 했다.", "검토받은 사람들은 소크라테스가 가르친 구체적인 내용을 들어 그가 젊은이들을 망친다고 말했다."], "a": [3], "s": 2, "part": "미움과 비방", "e": "23d: 그들은 아무 할 말이 없지만 <b>당황하는 것으로 보이지 않으려고<\/b> \"천상의 것들과 지하의 것들\", \"신들을 믿지 않는다\", \"더 약한 논변을 더 강한 논변으로 만든다\" 같은 <b>상투적 비난<\/b>을 한다.", "w": "① 가장 부유한 집안 아들들이 누가 시키지 않았는데도 스스로 따라다녔다. ② 자신들에게가 아니라 소크라테스에게 화를 냈다. ④ 무엇을 가르치느냐고 물으면 아무 할 말이 없다."}, {"q": "『소크라테스의 변명』 23e에서 멜레토스, 아뉘토스, 뤼콘이 각각 대변하여 성을 낸 집단을 바르게 짝지은 것은?", "box": null, "o": ["멜레토스 - 정치인들 / 아뉘토스 - 시인들 / 뤼콘 - 장인들", "멜레토스 - 시인들 / 아뉘토스 - 장인들과 정치인들 / 뤼콘 - 연설가들", "멜레토스 - 연설가들 / 아뉘토스 - 시인들 / 뤼콘 - 장인들과 정치인들", "멜레토스 - 시인들 / 아뉘토스 - 연설가들 / 뤼콘 - 장인들과 정치인들"], "a": [2], "s": 1, "part": "미움과 비방", "e": "23e: <b>멜레토스는 시인들<\/b>을, <b>아뉘토스는 장인들과 정치인들<\/b>을, <b>뤼콘은 연설가들<\/b>을 대변했다. 소크라테스의 검토에서 체면을 잃은 집단들이 세 고발자를 통해 공식 고발로 나선 셈이다.", "w": null}, {"q": "『소크라테스의 변명』 24a에서 소크라테스가 '자신이 진실을 말하고 있다는 것을 보여 주는 증거'라고 말한 것은?", "box": null, "o": ["많은 재판관들이 그의 대화를 직접 들어 본 증인이라는 것", "카이레폰의 형제가 신탁에 대해 증언해 줄 것이라는 것", "바로 이런 것들(검토 활동) 때문에 자신이 미움을 사고 있다는 것", "신은 절대 거짓을 말하지 않는다는 것"], "a": [3], "s": 3, "part": "미움과 비방", "e": "24a: \"바로 이런 것들로 해서 내가 <b>미움을 사고 있다는 걸<\/b> 나는 꽤 잘 알고 있습니다. 그게 또 내가 진실을 말하고 있다는 걸 보여 주는 증거이기도 합니다.\" 미움이라는 결과가 곧 비방의 원인이 검토 활동이라는 해명의 증거라는 논리다.", "w": "① 19d의 자연철학 관련 증인, ② 21a 신탁 증언, ④ 21b 소크라테스의 생각 — 모두 다른 맥락이다."}]}, {"id": "q3", "title": "점검퀴즈 3", "kind": "예상 문제", "range": "24b~28b · 멜레토스 심문", "qs": [{"q": "다음은 멜레토스 등 나중 고발자들의 고발장이다. 빈칸에 들어갈 말을 알맞게 짝지은 것은?", "box": "“소크라테스는 젊은이들을 (　㉠　), 국가가 믿는 신들을 믿지 않고 다른 새로운 (　㉡　)을 믿음으로써 불의를 행하고 있다.”", "o": ["㉠ 가르치고 ㉡ 신령스러운 것들", "㉠ 망치고 ㉡ 신령스러운 것들", "㉠ 망치고 ㉡ 영웅들", "㉠ 타락시키고 ㉡ 신들"], "a": [2], "s": 1, "part": "젊은이 논박", "e": "24b~c 공식 고발장: \"소크라테스는 젊은이들을 <b>망치고<\/b>, 국가가 믿는 신들을 믿지 않고 다른 새로운 <b>신령스러운 것들<\/b>을 믿음으로써 불의를 행하고 있다.\" 이 '신령스러운 것들'이 27b~e 논박의 열쇠가 된다.", "w": null}, {"q": "『소크라테스의 변명』 24c에서 소크라테스가 \"오히려 멜레토스가 불의를 행하고 있다\"고 주장한 이유로 옳은 것은?", "box": null, "o": ["조금도 관심을 가져 본 적 없는 일들에 관해 진지한 척하며 사람들을 경솔하게 법정에 세워, 진지한 일을 장난으로 대하기 때문이다.", "아뉘토스에게 돈을 받고 거짓 고발을 했기 때문이다.", "항변할 기회도 주지 않고 결석 재판으로 고발했기 때문이다.", "시인들을 대변하여 사사로운 분노로 고발했기 때문이다."], "a": [1], "s": 2, "part": "젊은이 논박", "e": "24c: 멜레토스는 <b>관심을 가져 본 적 없는 일들에 관해 진지한 척, 마음을 쓰는 척<\/b>하며 사람들을 경솔하게 법정에 세워 <b>진지한 일을 장난으로 대한다<\/b>. '멜레토스(Melētos)'라는 이름과 '관심을 갖다(melei)'를 엮은 말장난이 심문 내내 이어진다.", "w": "③ 결석 재판은 오래전 고발자들(18c)에 대한 말. ④ 멜레토스가 시인들을 대변했다는 것은 23e의 설명이지 '불의를 행한다'는 근거가 아니다."}, {"q": "『소크라테스의 변명』 24d~25a에서 \"누가 젊은이들을 더 훌륭하게 만드는가?\"라는 소크라테스의 물음에 멜레토스가 답한 순서로 옳은 것은?", "box": null, "o": ["재판관들 → 법률들 → 방청객들 → 평의회 의원들 → 민회 구성원들", "법률들 → 재판관들 → 평의회 의원들 → 방청객들 → 민회 구성원들", "법률들 → 평의회 의원들 → 재판관들 → 민회 구성원들 → 방청객들", "법률들 → 민회 구성원들 → 재판관들 → 방청객들 → 평의회 의원들"], "a": [5], "s": 3, "part": "젊은이 논박", "e": "실제 순서는 <b>법률들 → 재판관들 → 방청객들 → 평의회 의원들 → 민회 구성원들<\/b>이다(24d~25a). 보기 중 이 순서와 같은 것이 없으므로 정답은 ⑤. 결국 \"나를 빼놓고 아테네인들 전부가\" 젊은이를 훌륭하게 만든다는 답에 이른다.", "w": "② 방청객과 평의회 의원의 순서가 바뀌었다. ①은 처음 두 개의 순서가 바뀌었다."}, {"q": "『소크라테스의 변명』 25a~c의 말(馬)의 비유를 통해 소크라테스가 보여 주려 한 것으로 가장 적절한 것은?", "box": null, "o": ["젊은이도 말처럼 국가가 직접 맡아 공적으로 교육해야 한다.", "아테네인 전부가 젊은이를 훌륭하게 만든다는 멜레토스의 말은 말(馬)의 경우에도 들어맞는다.", "더 훌륭하게 만드는 사람은 한 사람이거나 아주 소수이고 다수는 오히려 망치는데, 멜레토스는 그 반대를 주장하므로 젊은이 문제에 관심을 가져 본 적이 없음이 드러난다.", "젊은이와 말은 본성이 같으므로 말 조련사가 젊은이도 가르쳐야 한다."], "a": [3], "s": 2, "part": "젊은이 논박", "e": "25b~c: 말을 더 훌륭하게 만드는 사람은 <b>말 조련사 같은 한 사람 또는 아주 소수<\/b>이고, 많은 사람들은 다루면 오히려 망친다. 멜레토스의 \"모두가 훌륭하게 만들고 나만 망친다\"는 주장은 이와 정반대이므로, 그가 <b>젊은이들에게 신경 써 본 적이 한 번도 없다<\/b>는 것이 드러난다.", "w": null}, {"q": "『소크라테스의 변명』 25c~26a에서 멜레토스가 소크라테스가 젊은이들을 \"의도적으로\" 망친다고 답한 뒤 이어진 소크라테스의 반박으로 옳지 <u>않은<\/u> 것은?", "box": null, "o": ["사악한 사람들은 늘 가장 가까이 있는 사람들에게 나쁜 일을 한다는 데 멜레토스도 동의했다.", "의도하지 않은 잘못이라도 법정에 세워 처벌하는 것이 법이다.", "함께 있는 사람을 몹쓸 사람으로 만들면 자신이 해를 입을 위험이 있다는 것도 모를 만큼 무지할 수는 없다.", "그러므로 자신은 망치고 있지 않거나, 망친다 해도 의도 없이 그러는 것이다."], "a": [2], "s": 2, "part": "젊은이 논박", "e": "26a: 의도하지 않은 잘못은 <b>법정에 세우는 게 아니라 개인적으로 붙잡아 가르치고 훈계하는 것이 법<\/b>이다. 배움이 아니라 처벌이 필요한 사람들을 법정에 세우는 것이다. 그런데 멜레토스는 가르치기는 피하고 법정에 세웠다.", "w": "① 25c 동의 ③ 25d~e ④ 25e~26a: 둘 중 어느 쪽으로 보든 멜레토스가 틀렸다."}, {"q": "『소크라테스의 변명』 26b~c에서 소크라테스가 두 가지 해석 중 어느 것이냐고 묻자, 멜레토스가 택한 고발 내용은?", "box": null, "o": ["소크라테스는 국가가 믿는 신들이 아닌 다른 신들이 있다고 믿으라고 가르친다.", "소크라테스는 신령들만 믿고 신들은 믿지 않는다.", "소크라테스는 해와 달을 새로운 신으로 섬기라고 가르친다.", "소크라테스는 전적으로 신들을 믿지 않으며, 다른 사람들에게도 그렇게 가르친다."], "a": [4], "s": 2, "part": "신 논박", "e": "26c: 멜레토스는 \"후자를, 즉 당신이 <b>전적으로 신들을 믿지 않는다<\/b>는 걸\" 말한다고 답한다. 그런데 이것은 고발장의 '다른 새로운 신령스러운 것들을 믿는다'와 충돌하고, 소크라테스는 바로 이 틈을 27a~e에서 파고든다.", "w": "① 소크라테스가 제시한 첫 번째 해석인데, 멜레토스는 이것을 택하지 않았다."}, {"q": "『소크라테스의 변명』 26d~e의 내용으로 옳은 것은?", "box": null, "o": ["멜레토스는 소크라테스가 해는 돌이고 달은 흙이라고 주장한다고 말했다.", "그런 주장이 담긴 책은 아브데라 출신 데모크리토스의 책이다.", "그 책들은 오르케스트라에서 많아 봐야 1므나면 살 수 있다.", "소크라테스는 해와 달이 신이 아니라는 데 동의하면서도 다른 신들은 믿는다고 말했다."], "a": [1], "s": 2, "part": "신 논박", "e": "26d: 멜레토스 — \"해는 돌이고 달은 흙이라고 주장하니까요.\" 소크라테스는 그건 <b>클라조메나이 출신 아낙사고라스<\/b>의 책 내용이며, <b>오르케스트라에서 많아 봐야 1드라크마<\/b>면 살 수 있다고 반박한다. 젊은이들이 그런 걸 굳이 자기한테서 배울 리 없다는 것이다.", "w": "② 아낙사고라스. ③ 1드라크마(1므나=100드라크마). ④ 해와 달에 대한 자기 생각은 밝히지 않는다."}, {"q": "『소크라테스의 변명』 28a에서 소크라테스가 \"나를 잡을 것\"이라고 말한 것은?", "box": null, "o": ["멜레토스의 고발장", "아뉘토스의 정치적 영향력", "많은 사람들의 비방과 시기", "재판관들의 무지"], "a": [3], "s": 1, "part": "항변 마무리", "e": "28a: \"나를 잡을 게 바로 이겁니다. <b>멜레토스도 아뉘토스도 아니고, 많은 사람들의 비방과 시기<\/b>입니다.\" 공식 고발의 논박은 이것으로 충분하고, 진짜 위험은 오래전부터 쌓인 미움이라는 것으로 항변을 마무리한다. 그것들이 다른 많은 훌륭한 사람들도 잡았고 앞으로도 잡을 것이라고 덧붙인다.", "w": null}, {"q": "『소크라테스의 변명』 27b~e에서 소크라테스가 멜레토스의 고발장이 자기모순임을 보이는 논증의 순서로 옳은 것은?<br>ㄱ. 신령스러운 활동들은 있다고 믿으면서 신령들은 믿지 않는 사람은 없다.<br>ㄴ. 멜레토스는 고발장에서 소크라테스가 신령스러운 것들을 믿는다고 서약까지 했다.<br>ㄷ. 신령들은 신들이거나 신들의 자식들이다.<br>ㄹ. 따라서 소크라테스는 신들을 믿는다.", "box": null, "o": ["ㄷ → ㄱ → ㄴ → ㄹ", "ㄴ → ㄷ → ㄱ → ㄹ", "ㄱ → ㄷ → ㄴ → ㄹ", "ㄱ → ㄴ → ㄷ → ㄹ"], "a": [4], "s": 3, "part": "신 논박", "e": "27b~d: 먼저 <b>ㄱ<\/b>(인간 활동↔인간, 말 활동↔말, 피리 연주↔피리 연주자처럼 신령스러운 활동↔신령)에 동의를 받고, <b>ㄴ<\/b> 고발장에 따르면 소크라테스는 신령스러운 것들을 믿으므로 신령들도 믿는다. 이어서 <b>ㄷ<\/b> 신령들은 신들이거나 신들의 자식이므로, <b>ㄹ<\/b> 어느 쪽이든 소크라테스는 신들을 믿는다. 결국 고발장은 \"신들을 믿지 않으면서 믿는다\"는 수수께끼가 된다.", "w": null}, {"q": "『소크라테스의 변명』 27d~e에서 신들의 자식들은 있다고 믿으면서 신들은 안 믿는 것이 엉뚱한 일임을 보이기 위해 소크라테스가 든 비유는?", "box": null, "o": ["피리 연주자들은 믿지 않으면서 피리 연주에 관련된 활동들은 믿는 것", "말과 나귀의 새끼인 노새들은 믿으면서 말과 나귀가 있다는 것은 믿지 않는 것", "말 조련사는 믿지 않으면서 훌륭한 말은 믿는 것", "인간에 관련된 활동들은 믿으면서 인간들은 믿지 않는 것"], "a": [2], "s": 2, "part": "신 논박", "e": "27e: \"누군가가 말들과 나귀들의 새끼들, 즉 <b>노새들은 믿으면서 말들과 나귀들이 있다는 건 믿지 않을<\/b> 때와 꼭 마찬가지로 엉뚱한 일\". 신령 = 신들의 (서출) 자식이라는 두 번째 경우에 쓰인 비유다.", "w": "①④ 피리 연주자·인간 비유는 27b에서 '활동을 믿으면 그 활동의 주체도 믿는다'(ㄱ단계)를 보이는 데 쓰였다. ③ 말 조련사는 25b 젊은이 논박의 비유. 부모-자식 관계(신령 = 신들의 자식)를 보이는 비유는 노새다."}]}, {"id": "q4", "title": "점검퀴즈 4", "kind": "예상 문제", "range": "28b~31c · 죽음과 사명", "qs": [{"q": "『소크라테스의 변명』 28b~d에서 소크라테스가 예로 든 테티스의 아들(아킬레우스)이 죽음과 위험보다 훨씬 더 무서워한 것은?", "box": null, "o": ["여신인 어머니를 슬프게 하는 일", "비겁한 사람으로 살게 되는 일과 친구들을 위해 복수하지 못하는 일", "헥토르와의 싸움에서 패배하는 일", "트로이 전쟁에서 그리스군이 지는 일"], "a": [2], "s": 1, "part": "죽음과 사명", "e": "28c~d: 아킬레우스는 \"헥토르 다음엔 네가 곧바로 죽는다\"는 어머니 테티스의 경고를 듣고도 죽음과 위험은 사소하게 여기고, <b>비겁한 사람으로 사는 일<\/b>과 <b>친구(파트로클로스)를 위해 복수하지 못하는 일<\/b>을 훨씬 더 무서워했다. \"곧바로 죽어도 좋습니다. 불의를 행한 사람에게 대가를 받아 낸다면.\"", "w": "어머니 테티스는 경고한 사람이고, 헥토르는 복수 대상이다."}, {"q": "『소크라테스의 변명』 28e에서 소크라테스가 지휘관의 명령에 따라 자리를 지키며 죽을 위험을 무릅썼다고 언급한 전투 장소가 <u>아닌<\/u> 것은?", "box": null, "o": ["포테이다이아", "마라톤", "암피폴리스", "델리온"], "a": [2], "s": 1, "part": "죽음과 사명", "e": "28e: \"<b>포테이다이아<\/b>에서든 <b>암피폴리스<\/b>에서든 <b>델리온<\/b>에서든\" 지휘관이 명령한 자리를 지켰다. 그런데 이제 신이 \"지혜를 사랑하며 나와 남을 검토하며 살라\"고 명령했는데 죽음이 무서워 그 자리를 떠난다면 무서운 일이라는 논리(<b>병사 비유<\/b>)다.", "w": "마라톤 전투(기원전 490)는 소크라테스가 태어나기 전의 일이다."}, {"q": "빈칸에 들어갈 말로 가장 알맞은 것은?", "box": "“알다시피, 여러분, 죽음을 무서워한다는 것은 (　　　　　　)에 다름 아니거든요. 그건 알지 못하는 것들을 안다고 생각하는 거니까요.”", "o": ["지혜롭지 않은데도 지혜롭다고 생각하는 것", "신들이 있다고 믿지 않는 것", "용기가 없어 비겁한 것", "삶을 지나치게 사랑하는 것"], "a": [1], "s": 1, "part": "죽음과 사명", "e": "29a: 죽음을 무서워하는 것은 <b>지혜롭지 않은데도 지혜롭다고 생각하는 것<\/b>, 즉 알지 못하는 것을 안다고 생각하는 것이다. 아무도 죽음이 최대로 좋은 것인지조차 모르는데, 최대로 나쁜 것임을 아는 것처럼 무서워하기 때문이다. 21d의 <b>무지의 자각<\/b>이 죽음 문제에 그대로 적용된다.", "w": null}, {"q": "『소크라테스의 변명』 29b에서 소크라테스가 \"나는 안다\"고 분명하게 말한 것은?", "box": null, "o": ["죽음이 인간에게 생길 수 있는 좋은 것들 가운데 최대로 좋은 것이라는 것", "하데스(저승)의 일들이 어떠한지", "불의를 행하는 일과, 신이건 인간이건 자기보다 더 훌륭한 이에게 불복하는 일이 나쁘고 추하다는 것", "영혼은 죽지 않고 다른 곳으로 옮겨 간다는 것"], "a": [3], "s": 2, "part": "죽음과 사명", "e": "29b: 하데스의 일들은 <b>충분히 알지 못하니까 알지 못한다고 생각<\/b>한다. 그러나 <b>불의를 행하는 일<\/b>과 <b>더 훌륭한 이(신이든 인간이든)에게 불복하는 일<\/b>이 나쁘고 추하다는 것은 안다. 그래서 나쁘다고 아는 것보다, 좋은지 나쁜지도 모르는 것(죽음)을 두려워하지 않겠다는 결론이 나온다.", "w": "① 죽음이 최대로 좋은 것인지조차 모른다고 했다. ②④ 모른다고 하거나 \"전해지는 말\"(40c)로만 언급한다."}, {"q": "『소크라테스의 변명』 29c~d에서 재판관들이 \"더 이상 탐색과 지혜 사랑을 하지 않는다는 조건으로 방면하겠다\"고 한다면, 소크라테스는 어떻게 하겠다고 말했는가?", "box": null, "o": ["조건을 받아들이고 아테네를 떠나 조용히 살겠다.", "지혜 사랑은 그만두되 젊은이들과의 대화는 계속하겠다.", "여러분을 좋아하고 사랑하지만, 여러분보다는 신에게 복종하여 숨 쉬는 한 지혜 사랑을 멈추지 않겠다.", "공적인 자리에서만 조언하고 개인적인 검토는 그만두겠다."], "a": [3], "s": 1, "part": "죽음과 사명", "e": "29d: \"아테네인 여러분, 나는 여러분을 좋아하고 사랑하지만, <b>여러분보다는 오히려 신에게 복종<\/b>할 겁니다. 그래서 내가 숨 쉬고 있고 할 수 있는 한은 지혜 사랑하는 일을 멈추지 않을 겁니다.\" 30c에서도 \"여러 번 죽게 될 거라 해도 다른 일들을 하지는 않을 것\"이라고 못 박는다.", "w": null}, {"q": "『소크라테스의 변명』 29d~e에서 소크라테스가 아테네인들에게 \"수치스럽지 않습니까?\"라고 물으며, 그들이 <b>돌보지도 신경 쓰지도 않는다<\/b>고 지적한 것이 <u>아닌<\/u> 것은?", "box": null, "o": ["현명함", "진실", "영혼이 최대한 훌륭해지게 하는 일", "명성과 명예"], "a": [4], "s": 2, "part": "죽음과 사명", "e": "29d~e: 아테네 사람들은 <b>돈·명성·명예<\/b>는 돌보면서 <b>현명함·진실·영혼이 최대한 훌륭해지게 하는 일<\/b>은 돌보지 않는다. 명성과 명예는 오히려 \"돌보는\" 쪽이다.", "w": "돌보는 것(돈, 명성, 명예) vs 돌보지 않는 것(현명함, 진실, 영혼) — 대비 구조를 기억하자."}, {"q": "빈칸에 공통으로 들어갈 말로 알맞은 것은?", "box": "“돈으로부터 (　　)이 생기는 게 아니라, (　　)으로부터 돈과 인간들에게 좋은 다른 모든 것들이 사적인 영역에서든 공적인 영역에서든 생깁니다.”", "o": ["덕", "지혜", "명예", "행복"], "a": [1], "s": 1, "part": "죽음과 사명", "e": "30b: \"돈으로부터 <b>덕<\/b>이 생기는 게 아니라, <b>덕<\/b>으로부터 돈과 인간들에게 좋은 다른 모든 것들이 사적인 영역에서든 공적인 영역에서든 생깁니다.\" 영혼(덕)을 돌보는 것을 육체나 돈보다 앞세우라는 권고다.", "w": null}, {"q": "『소크라테스의 변명』 30c~e에서 소크라테스가 한 주장으로 옳지 <u>않은<\/u> 것은?", "box": null, "o": ["자신을 죽인다면 자신보다 아테네인들 자신에게 더 큰 해를 주게 될 것이다.", "더 훌륭한 사람이 더 형편없는 사람에게서 해를 입는 것은 법도에 맞지 않으므로, 멜레토스도 아뉘토스도 자신에게 해를 끼치지 못한다.", "사람을 죽이거나 추방하는 것보다, 사람을 부정의하게 죽이려 시도하는 것이 훨씬 더 나쁘다.", "지금 자신은 무엇보다 자기 자신의 목숨을 구하기 위해 항변하고 있다."], "a": [4], "s": 2, "part": "죽음과 사명", "e": "30d~e: \"지금 나는 <b>나 자신을 위해서 항변을 하고 있는 게 전혀 아닙니다<\/b>. 오히려 <b>여러분을 위해서<\/b>, 즉 여러분이 유죄 표를 던져 <b>신이 준 선물<\/b>에 대해 잘못을 범하지 않도록 하려고 항변하는 겁니다.\"", "w": "①②③ 모두 30c~d 본문 내용."}, {"q": "『소크라테스의 변명』 30e~31a에서 소크라테스는 자신을 국가에 붙여 놓은 '등에'에 비유한다. 이때 국가는 무엇에 비유되었는가?", "box": null, "o": ["크고 혈통 좋지만 큰 덩치 때문에 꽤 굼떠서, 일깨워 줄 필요가 있는 말(馬)", "키잡이 없이 표류하는 배", "양 떼를 잃어버린 목자", "병이 들어 의사가 필요한 환자"], "a": [1], "s": 1, "part": "죽음과 사명", "e": "30e: 국가 = <b>크고 혈통 좋지만 굼뜬 말<\/b>, 소크라테스 = 신이 붙여 놓은 <b>등에(쇠파리)<\/b>. 하루 종일 붙어 앉아 일깨우고 설득하고 꾸짖는다. 짜증이 난 아테네인들은 졸다 깬 사람처럼 등에를 탁 때려 죽이고 남은 삶을 쿨쿨 잘지도 모른다(31a).", "w": "②~④는 플라톤의 다른 대화편(『국가』 등)에 나오는 비유이거나 본문에 없는 비유다."}, {"q": "『소크라테스의 변명』 31a~c의 내용으로 옳지 <u>않은<\/u> 것은?", "box": null, "o": ["소크라테스는 숱한 세월 동안 자기 자신의 일과 집안일을 돌보지 않았다.", "아버지나 형처럼 각자에게 개인적으로 찾아가 덕을 돌보라고 설득해 왔다.", "고발자들도 소크라테스가 누군가에게서 보수를 받거나 요구했다는 증인만큼은 내세우지 못했다.", "소크라테스는 자신이 진실을 말한다는 증인으로 자신의 가난을 내세운다."], "a": [5], "s": 2, "part": "죽음과 사명", "e": "①~④ 모두 본문 내용이므로 정답은 ⑤. 자기 일은 돌보지 않고 남의 덕을 돌본 것은 \"<b>인간에게 속한 일 같지 않다<\/b>\" → 신이 준 선물이라는 증거. 보수를 받은 적이 없다는 증인은 <b>나의 가난<\/b>(31c).", "w": "① 31a~b ② 31b ③ 31b~c ④ 31c"}]}, {"id": "q5", "title": "점검퀴즈 5", "kind": "예상 문제", "range": "31c~35d · 공적 활동·맺는 말", "qs": [{"q": "『소크라테스의 변명』 31c~d에서 소크라테스가 말한 '신적인 혹은 신령스러운 것'에 대한 설명으로 옳지 <u>않은<\/u> 것은?", "box": null, "o": ["어린 시절부터 시작된 일종의 목소리다.", "생길 때마다 늘 소크라테스가 하려는 일을 못하게 말린다.", "때로는 마땅히 해야 할 일을 하라고 부추기기도 한다.", "소크라테스가 정치적인 활동을 하는 것에 반대했다."], "a": [3], "s": 1, "part": "공적 활동", "e": "31d: \"어떤 목소리가 생겨나는데, 생길 때마다 늘 내가 하려는 일을 못하게 <b>말리긴 해도 하라고 부추기는 적은 한 번도 없지요<\/b>.\" 멜레토스가 고발장에서 희화화한 \"새로운 신령스러운 것\"이 바로 이것이다.", "w": "이 신호가 40a~c에서는 \"반대하지 않았다\"는 점에서 다시 중요해진다."}, {"q": "『소크라테스의 변명』 31d~32a에서 소크라테스가 공적으로 국가를 위해 조언하지 않은 이유로 가장 적절한 것은?", "box": null, "o": ["자신은 연설에 재능이 없어 대중 앞에서 말할 수 없었기 때문이다.", "보수를 받지 않고서는 정치 활동을 할 수 없었기 때문이다.", "아테네의 민주정 자체를 혐오했기 때문이다.", "정치 활동을 했다면 오래전에 죽어 아무 이득도 주지 못했을 것이며, 정의를 위해 싸우려는 사람은 사적인 삶을 살아야 하기 때문이다."], "a": [4], "s": 2, "part": "공적 활동", "e": "31d~32a: 다수 대중에게 진정성 있게 반대하며 불의를 막으면서 <b>목숨을 보전할 사람은 아무도 없다<\/b>. 그러니 참으로 정의를 위해 싸우려는 사람은 잠깐이라도 살아남으려면 <b>공적인 삶이 아니라 사적인 삶<\/b>을 살아야 한다.", "w": null}, {"q": "『소크라테스의 변명』 32a~c에서 소크라테스가 평의회 의원으로서 혼자 반대하고 반대표를 던진 일은?", "box": null, "o": ["30인 통치자들을 선출하자는 의결", "해전에서 사람들을 건져 주지 못한 열 명의 장군을 한꺼번에 묶어(병합하여) 심리하자는 의결", "시칠리아 원정을 떠나자는 의결", "소피스트들을 아테네에서 추방하자는 의결"], "a": [2], "s": 2, "part": "공적 활동", "e": "32b: 마침 <b>안티오키스 부족<\/b>이 평의회 운영을 맡았을 때, 해전(아르기누사이 해전, 406)에서 사람들을 건지지 못한 <b>열 명의 장군을 병합 심리<\/b>하자는 불법적 의결에 운영위원 중 <b>소크라테스만<\/b> 반대했다. 연설가들이 고발·체포하려 하고 대중이 소리쳐도 \"법과 정의의 편에서 위험을 무릅써야 한다\"고 생각했다.", "w": "나중에 모두가 그것이 불법이었다고 인정했다."}, {"q": "『소크라테스의 변명』 32c~d의 30인 통치자 시기 일화에 대한 설명으로 옳지 <u>않은<\/u> 것은?", "box": null, "o": ["30인 통치자들은 소크라테스를 비롯해 다섯 사람을 원형 청사로 불렀다.", "소크라테스는 레온에게 미리 사람을 보내 도망치라고 알려 주었다.", "30인은 살라미스 사람 레온을 죽일 작정으로 잡아 오라고 명령했다.", "정권이 빨리 무너지지 않았다면 소크라테스는 이 일 때문에 죽었을 것이다."], "a": [2], "s": 2, "part": "공적 활동", "e": "32d: 네 사람은 살라미스로 가서 레온을 잡아 왔지만 <b>소크라테스는 그냥 헤어져 집으로 갔다<\/b>. 레온에게 알렸다는 내용은 없다. \"죽음에 대해서는 눈곱만큼도 관심이 없지만, <b>부정의하거나 불경건한 일을 저지르지 않는 것<\/b>에는 온통 관심을 쏟는다.\"", "w": "30인이 여러 사람에게 이런 명령을 한 이유: 가능한 한 많은 사람을 자기들의 죄악에 물들이려고(32c)."}, {"q": "『소크라테스의 변명』에서 소크라테스가 \"말이 아니라 행동\"의 증거로 든 두 사건을 당시 정체(政體)와 바르게 짝지은 것은?", "box": null, "o": ["열 장군 병합 심리 반대 - 민주정 / 레온 체포 거부 - 과두정(30인)", "열 장군 병합 심리 반대 - 과두정(30인) / 레온 체포 거부 - 민주정", "두 사건 모두 민주정", "두 사건 모두 과두정(30인)"], "a": [1], "s": 1, "part": "공적 활동", "e": "32c: \"이건 우리 나라가 <b>아직 민주정 치하<\/b>일 때의 일이었지요. 그런데 <b>과두정<\/b>이 들어서자, 이번에는 30인 통치자들이…\" → 소크라테스는 <b>어느 정체 아래에서든<\/b> 죽음이 두려워 불의에 굴복하지 않았다.", "w": null}, {"q": "『소크라테스의 변명』 33a~b에서 소크라테스가 자신에 대해 한 말로 옳지 <u>않은<\/u> 것은?", "box": null, "o": ["자신은 어느 누구의 선생도 되어 본 적이 없다.", "부자에게든 가난한 사람에게든 똑같이 질문하라고 자신을 내어놓는다.", "누구에게도 배울거리를 약속하거나 가르친 적이 없으니, 그들이 쓸 만한 사람이 되는지의 책임을 떠맡는 것은 정의롭지 않다.", "자신에게서 개인적으로 남들은 들어 보지 못한 특별한 가르침을 받은 제자들이 있다."], "a": [4], "s": 2, "part": "공적 활동", "e": "33b: \"누군가가 언젠가 나한테서 뭔가를 개인적으로 배우거나 들은 적이 있다고 주장한다면(<b>다른 사람들은 다 그런 적이 없는<\/b> 그런 뭔가를 말이에요), 그는 <b>진실되지 않은 말<\/b>을 하고 있다.\" 비밀 교육이나 사적인 가르침은 없었다는 것.", "w": "\"제자들\"은 비방하는 사람들이 그렇게 부를 뿐이다(33a). 알키비아데스·크리티아스 같은 인물에 대한 책임을 떠맡지 않는다는 숨은 뜻."}, {"q": "『소크라테스의 변명』 33b~c에서 몇몇 사람들이 소크라테스와 많은 시간을 보내며 즐거워하는 이유로 소크라테스가 말한 것은?", "box": null, "o": ["지혜롭다고 생각하지만 실은 그렇지 않은 사람들이 검토받는 것을 들으며 즐거워한다.", "소크라테스가 수사학을 공짜로 가르쳐 준다.", "소크라테스가 재미있는 옛날이야기를 많이 들려준다.", "소크라테스와 어울리면 정치적 출세에 도움이 된다."], "a": [1], "s": 1, "part": "공적 활동", "e": "33c: 그들은 \"<b>지혜롭다고 생각은 하지만 실은 그렇지 않은 사람들이 검토받는 것<\/b>을 들으면서 즐거워하는\" 것이다. 그리고 이 검토는 신이 <b>예언·꿈·온갖 신적 섭리<\/b>를 통해 하라고 명한 일이다.", "w": null}, {"q": "『소크라테스의 변명』 33d~34a에서 소크라테스가 법정에 와 있다고 거명한 사람들의 관계로 옳지 <u>않은<\/u> 것은?", "box": null, "o": ["크리톤 - 소크라테스와 동년배이자 같은 마을 사람, 크리토불로스의 아버지", "뤼사니아스 - 아이스키네스의 아버지", "아폴로도로스 - 크리톤의 아들", "아데이만토스 - 플라톤의 형제"], "a": [3], "s": 2, "part": "공적 활동", "e": "34a: <b>아폴로도로스<\/b>는 <b>아이안토도로스의 형제<\/b>다. 소크라테스는 \"망쳐졌다\"는 젊은이들의 아버지·형제가 와 있는데도 아무도 고발하지 않고, 오히려 자신을 도우려 한다는 점을 증거로 삼는다. 멜레토스는 그들 중 누구도 증인으로 세우지 못했다.", "w": "이 대목은 플라톤이 『변명』에서 자기 이름을 넣은 첫 장면이기도 하다(34a, 38b)."}, {"q": "『소크라테스의 변명』 34c~d에서 소크라테스가 자신의 가족에 대해 한 말로 옳은 것은?", "box": null, "o": ["자식이 없어서 법정에 데려올 사람이 없다.", "\"나무에서나 바위에서\" 태어난 게 아니라 인간에게서 태어났고, 아들이 셋(하나는 청년, 둘은 어린애) 있지만 법정에 올라오게 해서 간청하지는 않겠다.", "아들 둘을 법정에 올라오게 해 방면을 간청하게 했다.", "아들들이 모두 성인이 되어 스스로 아버지를 변호할 것이다."], "a": [2], "s": 1, "part": "맺는 말", "e": "34d: 호메로스의 말을 인용해 \"나도 <b>나무에서나 바위에서<\/b> 태어난 게 아니라 인간들에게서 태어났으니\" 집안사람도 아들도 있다. <b>아들은 셋<\/b> — 하나는 벌써 청년, 둘은 어린애. 그래도 누구도 올라오게 해서 방면을 간청하지 않겠다.", "w": null}, {"q": "『소크라테스의 변명』 34e~35d에서 소크라테스가 재판관들에게 눈물로 동정을 호소하지 않는 이유로 언급되지 <u>않은<\/u> 것은?", "box": null, "o": ["이 나이에 그런 이름으로 불리는 자신이 그런 일을 하는 것은 자신에게도 국가 전체에도 명성과 관련해 아름답지 못하다.", "불쌍한 행위들을 연출하는 사람은 국가를 웃음거리로 만든다.", "재판관은 호의를 베풀겠다가 아니라 법에 따라 판결하겠다고 서약했으므로, 간청해서 죄를 벗는 것은 정의롭지 않다.", "재판관이 서약을 깨게 만들면, 신들이 있다는 걸 믿지 말라고 가르치는 셈이 되어 스스로를 불경죄로 고발하는 꼴이 된다."], "a": [5], "s": 3, "part": "맺는 말", "e": "①~④ 모두 본문에 나오므로 정답은 ⑤. 이유는 세 갈래로 정리된다: <b>명예<\/b>(아름답지 않다, 34e~35b) · <b>정의<\/b>(간청이 아니라 가르치며 설득해야, 35b~c) · <b>경건<\/b>(서약을 깨게 하면 불경, 35c~d).", "w": "① 34e~35a ② 35b ③ 35c ④ 35c~d"}]}, {"id": "q6", "title": "점검퀴즈 6", "kind": "예상 문제", "range": "35e~42a · 둘째·셋째 연설", "qs": [{"q": "『소크라테스의 변명』 35e~36a에서 유죄 판결이 나온 직후 소크라테스가 \"훨씬 더 놀라워한\" 것은?", "box": null, "o": ["유죄 판결이 나왔다는 사실 그 자체", "유무죄 양편의 표 차이가 근소해서, 30표만 바뀌었어도 죄를 벗었을 것 같다는 점", "멜레토스가 사형을 형량으로 제안했다는 점", "친구들이 벌금을 대신 내겠다고 나선 점"], "a": [2], "s": 1, "part": "둘째 연설", "e": "36a: 유죄 판결은 \"예상 못 한 일이 아니었다\". 놀라운 것은 <b>근소한 표차<\/b> — \"<b>30표<\/b>만 바뀌었다 해도 죄를 벗을 수 있었을 것\". 또 아뉘토스와 뤼콘이 없었다면 멜레토스는 총투표수의 <b>5분의 1<\/b>을 못 얻어 <b>천 드라크마<\/b>를 물었을 것이라고 비꼰다.", "w": null}, {"q": "『소크라테스의 변명』 36b~37a에서 소크라테스가 \"정의에 합당하게 받아 마땅한 것\"으로 처음 제안한 형량은?", "box": null, "o": ["시 중앙 청사에서 받는 식사 대접", "은화 1므나의 벌금", "아테네에서의 추방", "11인 관리 아래에서의 옥살이"], "a": [1], "s": 1, "part": "둘째 연설", "e": "36d~37a: 가난한 사람이요 <b>유공자<\/b>이며 권고하는 일을 위해 여유가 필요한 자신에게는 <b>시 중앙 청사(프뤼타네이온)에서의 식사 대접<\/b>이 가장 어울린다. 올림피아 경기 승자는 여러분을 행복해 <b>보이게<\/b> 하지만 나는 행복하게 <b>만들며<\/b>, 승자는 부양이 필요 없지만 나는 필요하다.", "w": "② 1므나는 나중에(38b) 현실적으로 제안한 벌금. ③④는 고려했다가 거부한 형벌."}, {"q": "『소크라테스의 변명』 37b~e에서 소크라테스가 대안 형량으로 고려했다가 거부한 형벌과 그 이유를 짝지은 것으로 옳지 <u>않은<\/u> 것은?", "box": null, "o": ["옥살이 - 그때그때 임명되는 11인 관리에게 종노릇하며 감옥에서 살 이유가 없다.", "벌금(완납 때까지 구금) - 벌금을 물 돈이 없으니 결국 옥살이와 같다.", "추방 - 동료 시민도 견디지 못한 담론과 논변을 다른 나라 사람들이 쉽게 견딜 리 없다.", "추방 - 다른 나라의 젊은이들은 자기 말에 귀를 기울이지 않을 테니 할 일이 없다."], "a": [4], "s": 2, "part": "둘째 연설", "e": "37d~e: 오히려 \"어딜 가든 젊은이들은 <b>여기서 그러는 것과 꼭 마찬가지로 내 말에 귀를 기울일 것<\/b>\"이다. 그러면 젊은이들을 쫓아 버리든(그들이 연장자를 설득해 추방) 쫓아 버리지 않든(그들의 아버지·집안사람이 추방) 결국 또 추방당한다.", "w": null}, {"q": "다음은 \"침묵을 지키고 조용히 지내면 추방되어도 살 수 있지 않느냐\"는 물음에 대한 소크라테스의 대답이다. 빈칸에 들어갈 말로 알맞은 것은?", "box": "“날마다 덕에 관해서 그리고 다른 것들에 관해서 이야기를 만들어 가는 것, 이것이 그야말로 인간이 누릴 수 있는 최상의 좋음이며, 검토 없이 사는 삶은 (　　　　　　)고 말하면, 여러분은 이런 말을 하는 나를 훨씬 더 못 미더워할 겁니다.”", "o": ["인간에게 위험하다", "신에게 불경하다", "인간에게 살 가치가 없다", "국가에 해롭다"], "a": [3], "s": 1, "part": "둘째 연설", "e": "38a: \"날마다 덕에 관해 이야기를 만들어 가는 것이 인간이 누릴 수 있는 <b>최상의 좋음<\/b>이며, <b>검토 없이 사는 삶은 인간에게 살 가치가 없다<\/b>.\" 조용히 지낼 수 없는 첫째 이유는 그것이 <b>신에게 불복하는 일<\/b>이기 때문이다(37e) — 그러나 그렇게 말하면 '의뭉을 떤다'(반어)고 믿지 않을 것.", "w": null}, {"q": "『소크라테스의 변명』 38b의 벌금 제안에 대한 설명으로 옳은 것은?", "box": null, "o": ["소크라테스는 처음부터 30므나를 벌금으로 제안했다.", "처음에는 은화 1므나를 제안했다가, 플라톤·크리톤·크리토불로스·아폴로도로스가 보증을 서겠다고 하여 30므나를 제안했다.", "카이레폰과 그의 형제가 보증인이 되어 주었다.", "벌금을 낼 수 없으므로 추방과 벌금을 함께 제안했다."], "a": [2], "s": 1, "part": "둘째 연설", "e": "38b: 돈이 없으니 물 능력이 되는 <b>은화 1므나<\/b>를 제안 → \"여기 이 <b>플라톤과 크리톤과 크리토불로스와 아폴로도로스<\/b>가 30므나를 제안하라고 권하는군요. 자기들이 직접 보증을 서겠다네요\" → <b>30므나<\/b> 제안. 배심원들은 결국 멜레토스의 사형을 택했다.", "w": "③ 카이레폰은 이미 고인(21a)."}, {"q": "다음은 사형 판결 후 소크라테스의 말이다. ㉠, ㉡에 들어갈 말을 알맞게 짝지은 것은?", "box": "“지금 나는 느리고 나이 든 사람이라서 더 느린 것, 즉 (　㉠　)에게 잡혔지만, 내 고발자들은 능란하고 기민해서 더 빠른 것, 즉 (　㉡　)에게 잡혔지요.”", "o": ["㉠ 죽음 ㉡ 악(사악)", "㉠ 악(사악) ㉡ 죽음", "㉠ 시간 ㉡ 명예", "㉠ 죽음 ㉡ 진실"], "a": [1], "s": 2, "part": "사형 투표자에게", "e": "39a~b: 죽음을 피하는 것보다 훨씬 어려운 것은 <b>사악을 피하는 것<\/b> — 그것은 죽음보다 더 빨리 달려온다. 느리고 늙은 소크라테스는 더 느린 <b>죽음<\/b>에게, 능란하고 기민한 고발자들은 더 빠른 <b>악<\/b>에게 잡혔다. 소크라테스는 여러분에 의해 죽음을, 고발자들은 <b>진실에 의해<\/b> 악덕과 불의를 선고받고 떠난다.", "w": null}, {"q": "『소크라테스의 변명』 39c~d에서 소크라테스가 유죄 표를 던진 사람들에게 한 예언으로 옳지 <u>않은<\/u> 것은?", "box": null, "o": ["자신의 죽음 이후 곧바로 훨씬 더 혹독한 앙갚음이 그들에게 닥칠 것이다.", "그들을 논박하는 사람들이 더 많아질 것이며, 지금까지는 소크라테스가 그들을 자제시켜 왔다.", "새로 나타날 논박자들은 더 젊은 만큼 더 혹독할 것이다.", "사람들을 죽이는 것이 비난에서 벗어나는 가장 쉽고 확실한 방법이다."], "a": [4], "s": 2, "part": "사형 투표자에게", "e": "39d: 사람들을 죽여서 비난을 막는 길은 \"<b>가능하지도 아름답지도 않으며<\/b>\", 가장 아름답고 쉽게 벗어나는 길은 <b>남들을 억누르는 게 아니라 자신을 가능한 한 훌륭하게 되도록 다잡는 것<\/b>이다.", "w": "죽기 직전이 인간이 예언을 가장 잘하는 때라는 당시 통념(39c)도 함께 기억."}, {"q": "『소크라테스의 변명』 39e~40c에 대한 설명으로 옳지 <u>않은<\/u> 것은?", "box": null, "o": ["소크라테스는 방면 쪽에 투표한 사람들을 비로소 \"재판관 여러분\"이라고 부른다.", "신령스러운 것의 예언은 이전에는 대단히 사소한 일에도 반대하곤 했다.", "신호가 반대하지 않은 것을 보면, 자신에게 일어난 일은 분명 나쁜 일이다.", "이번에는 아침에 집을 나설 때도, 재판정에 올라올 때도, 연설 중에도 신호가 반대하지 않았다."], "a": [3], "s": 2, "part": "무죄 투표자에게", "e <script>
const SETS = window.__DATA__;

const ALL = [];
SETS.forEach(s => s.qs.forEach((q, i) => { q.id = s.id + '-' + (i + 1); q.src = s.title + ' ' + (i + 1) + '번'; q.o = q.o.concat(['답 없음']); ALL.push(q); }));
const BYID = Object.fromEntries(ALL.map(q => [q.id, q]));

const store = {
  get(k, d) { try { const v = localStorage.getItem('ap-' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('ap-' + k, JSON.stringify(v)); } catch (e) {} }
};
let mode = store.get('mode', 'practice');      // practice | exam
let wrong = new Set(store.get('wrong', []));
let best = store.get('best', {});
let partSel = new Set(store.get('parts', PARTS));
let S = null;   // 현재 풀이 상태

const esc = t => String(t).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const stars = n => '★'.repeat(n) + '<i>' + '★'.repeat(3 - n) + '</i>';
const isRight = (q, pick) => pick != null && q.a.includes(pick);
const saveWrong = () => store.set('wrong', [...wrong]);
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function home() {
  S = null;
  location.hash = '';

    return `<button class="set" data-set="${s.id}">

      <span class="m"><span>${s.range} · ${s.qs.length}문항</span>${b != null ? `<span class="best">최고 ${b}/${s.qs.length}</span>` : '<span>아직 안 풂</span>'}</span>
    </button>`;
  }).join('');
  const pool = ALL.filter(q => partSel.has(q.part));
  app.innerHTML = `
    <div class="top">
      <div><div class="eyebrow">서양철학: 쟁점과 토론 · 플라톤</div><h1>소크라테스의 변명 점검퀴즈</h1></div>
      <div>
        <div class="seg" role="group" aria-label="풀이 방식">
          <button id="m-practice" aria-pressed="${mode === 'practice'}">연습 모드</button>
          <button id="m-exam" aria-pressed="${mode === 'exam'}">시험 모드</button>

      </div>
    </div>
    <div class="sets">${cards}</div>
    <h2>단락별로 골라 풀기</h2>
    <div class="parts">${PARTS.map(p => `<button class="chip" data-part="${p}" aria-pressed="${partSel.has(p)}">${p} <span style="color:var(--muted)">${ALL.filter(q => q.part === p).length}</span></button>`).join('')}</div>
    <div class="row">
      <button class="btn" id="mix" ${pool.length ? '' : 'disabled'}>선택한 단락에서 랜덤 ${Math.min(20, pool.length)}문항</button>
      <button class="btn ghost" id="mixall" ${pool.length ? '' : 'disabled'}>선택한 단락 전부 (${pool.length}문항)</button>
    </div>
    <h2>오답노트</h2>
    ${wrong.size ? `<div class="row"><button class="btn" id="wrongs">틀린 문제 다시 풀기 (${wrong.size}문항)</button><button class="btn ghost" id="clearw">오답노트 비우기</button></div>`
      : `<div class="empty">아직 틀린 문제가 없어요. 문제를 풀다 틀리면 여기에 모여요. (맞히면 자동으로 빠져요)</div>`}
    <p class="hint" style="margin-top:22px">범위: 17a~42a 전체. 기출 = 실제 출제된 ~28b 점검퀴즈(정답·해설은 본문 기준으로 작성) · 점검퀴즈 1~3 = 17a~28b 예상 문제 · 점검퀴즈 4~6 = 28b~42a 예상 문제. 5지선다, ⑤ 답 없음.</p>`;
  app.querySelectorAll('.set').forEach(b => b.onclick = () => start(SETS.find(s => s.id === b.dataset.set).title, SETS.find(s => s.id === b.dataset.set).qs, b.dataset.set));
  app.querySelectorAll('.chip').forEach(b => b.onclick = () => { const p = b.dataset.part; partSel.has(p) ? partSel.delete(p) : partSel.add(p); store.set('parts', [...partSel]); home(); });
  $('#m-practice').onclick = () => { mode = 'practice'; store.set('mode', mode); home(); };
  $('#m-exam').onclick = () => { mode = 'exam'; store.set('mode', mode); home(); };
  const mix = $('#mix'); if (mix) mix.onclick = () => start('단락별 랜덤', shuffle(pool).slice(0, 20));
  const mixall = $('#mixall'); if (mixall) mixall.onclick = () => start('단락별 전체', pool);
  const w = $('#wrongs'); if (w) w.onclick = () => start('오답노트', ALL.filter(q => wrong.has(q.id)));
  const cw = $('#clearw'); if (cw) cw.onclick = () => { if (cw.dataset.sure) { wrong.clear(); saveWrong(); home(); } else { cw.dataset.sure = 1; cw.textContent = '한 번 더 누르면 비워져요'; } };
}

function start(title, qs, setId) {
  S = { title, qs, setId, i: 0, picks: Array(qs.length).fill(null), done: false, t0: Date.now(), mode };
  location.hash = 'solve';
  render();
}

function render() {
  if (!S) return home();
  if (S.done) return result();
  const q = S.qs[S.i], pick = S.picks[S.i];
  const reveal = S.mode === 'practice' && pick != null;
  const dots = S.qs.map((qq, k) => {
    let c = 'dot';
    if (k === S.i) c += ' cur';
    const p = S.picks[k];
    if (p != null) c += S.mode === 'practice' ? (isRight(qq, p) ? ' ok' : ' bad') : ' done';
    return `<button class="${c}" data-k="${k}" aria-label="${k + 1}번">${k + 1}</button>`;
  }).join('');
  const opts = q.o.map((t, k) => {
    const n = k + 1;
    let c = 'opt';
    if (reveal) { if (q.a.includes(n)) c += ' right'; else if (pick === n) c += ' wrong'; }
    else if (pick === n) c += ' sel';
    return `<button class="${c}" data-n="${n}" ${reveal ? 'disabled' : ''}><span class="no">${C[k]}</span><span>${t}</span></button>`;
  }).join('');
  const answered = S.picks.filter(p => p != null).length;
  const ans = q.a.map(n => C[n - 1]).join(', ');
  app.innerHTML = `
    <div class="bar"><span class="ttl">${esc(S.title)}</span><span class="meta">${answered}/${S.qs.length} 풀이 · <span id="clock"></span> · ${S.mode === 'practice' ? '연습' : '시험'}</span></div>
    <div class="dots">${dots}</div>
    <div class="card">
      <div class="qhead"><span class="badge">문제 ${S.i + 1}</span><span class="star">${stars(q.s)}</span><span class="tag">${q.part}</span><span class="tag">${esc(q.src)}</span></div>
      <div class="qt">${q.q}</div>
      ${q.box ? `<div class="box">${q.box}</div>` : ''}
      <div class="opts">${opts}</div>
      ${reveal ? `<div class="fb">
        <div class="verdict ${isRight(q, pick) ? 'ok' : 'bad'}">${isRight(q, pick) ? '정답!' : '오답'} · 정답 ${ans}${q.a.length > 1 ? ' (복수 정답)' : ''}</div>
        <div class="ex">${q.e}</div>${q.w ? `<div class="wr"><b class="l">오답 체크</b> ${q.w}</div>` : ''}</div>` : ''}
    </div>
    <div class="nav">
      <button class="btn ghost" id="quit">그만 풀기</button>
      <div class="row" style="margin:0">
        <button class="btn ghost" id="prev" ${S.i === 0 ? 'disabled' : ''}>이전</button>
        ${S.i < S.qs.length - 1 ? `<button class="btn" id="next">다음</button>` : (S.back ? '' : `<button class="btn" id="submit">${S.mode === 'exam' ? '제출하고 채점' : '결과 보기'}</button>`)}
      </div>
    </div>`;
  app.querySelectorAll('.dot').forEach(b => b.onclick = () => { S.i = +b.dataset.k; render(); });
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    if (reveal) return;
    const n = +b.dataset.n;
    S.picks[S.i] = (S.mode === 'exam' && S.picks[S.i] === n) ? null : n;
    if (S.mode === 'practice') mark(q, n);
    render();
  });
  $('#quit').textContent = S.back ? '결과로 돌아가기' : '그만 풀기';
  $('#quit').onclick = () => { if (S.back) { S = S.back; render(); } else if (S.picks.some(p => p != null)) finish(); else home(); };
  $('#prev').onclick = () => { S.i--; render(); };
  const nx = $('#next'); if (nx) nx.onclick = () => { S.i++; render(); window.scrollTo(0, 0); };
  const sb = $('#submit'); if (sb) sb.onclick = () => {
    const left = S.picks.filter(p => p == null).length;
    if (S.mode === 'exam' && left && !sb.dataset.sure) { sb.dataset.sure = 1; sb.textContent = `안 푼 문제 ${left}개 — 그래도 제출`; return; }
    finish();
  };
  tick();
}

function mark(q, n) { if (isRight(q, n)) wrong.delete(q.id); else wrong.add(q.id); saveWrong(); }

function finish() {
  if (S.mode === 'exam') S.qs.forEach((q, k) => { if (S.picks[k] != null) mark(q, S.picks[k]); });
  S.done = true; S.secs = Math.round((Date.now() - S.t0) / 1000);
  const sc = S.qs.filter((q, k) => isRight(q, S.picks[k])).length;
  if (S.setId && S.picks.every(p => p != null)) { best[S.setId] = Math.max(best[S.setId] || 0, sc); store.set('best', best); }
  render();
}

function result() {
  const sc = S.qs.filter((q, k) => isRight(q, S.picks[k])).length;
  const parts = PARTS.filter(p => S.qs.some(q => q.part === p)).map(p => {
    const qs = S.qs.map((q, k) => [q, k]).filter(([q]) => q.part === p);
    const ok = qs.filter(([q, k]) => isRight(q, S.picks[k])).length;
    return `<div class="bp">${p}<b>${ok}/${qs.length}</b></div>`;
  }).join('');
  const items = S.qs.map((q, k) => {
    const ok = isRight(q, S.picks[k]), p = S.picks[k];
    return `<button class="li" data-k="${k}"><span class="mk ${ok ? 'ok' : 'bad'}">${ok ? 'O' : 'X'}</span><span class="tx">${k + 1}. ${q.q.replace(/<[^>]+>/g, '')}
      <small>내 답 ${p ? C[p - 1] : '안 풂'} · 정답 ${q.a.map(n => C[n - 1]).join(', ')} · ${q.part}</small></span></button>`;
  }).join('');
  const m = Math.floor(S.secs / 60), s = S.secs % 60;
  const wrongs = S.qs.filter((q, k) => !isRight(q, S.picks[k]));
  app.innerHTML = `
    <div class="bar"><span class="ttl">${esc(S.title)} · 결과</span><span class="meta">걸린 시간 ${m}분 ${s}초</span></div>
    <div class="card">
      <div class="score"><span class="big">${sc}</span><span class="of">/ ${S.qs.length}문항 맞힘 · ${Math.round(sc / S.qs.length * 100)}점</span></div>
      <div class="byPart">${parts}</div>
      <div class="row">
        ${wrongs.length ? `<button class="btn" id="redo">틀린 ${wrongs.length}문항만 다시</button>` : ''}
        <button class="btn ghost" id="again">처음부터 다시</button>
        <button class="btn ghost" id="home">목록으로</button>
      </div>
    </div>
    <h2>문항별 확인 (누르면 해설)</h2>
    <div class="list">${items}</div>`;
  app.querySelectorAll('.li').forEach(b => b.onclick = () => review(+b.dataset.k));
  const r = $('#redo'); if (r) r.onclick = () => start(S.title + ' · 오답', wrongs);
  $('#again').onclick = () => start(S.title, S.qs, S.setId);
  $('#home').onclick = home;
}

function review(k) {
  const prev = S;
  S = { title: prev.title + ' · 해설', qs: prev.qs, setId: null, i: k, picks: prev.picks.slice(), done: false, t0: Date.now(), mode: 'practice', back: prev };
  // 해설 보기: 연습 모드로 열어 정답과 해설이 바로 보이게 (안 푼 문제는 선택 시 채점)
  location.hash = 'solve';
  render();
}

let timer;
function tick() {
  clearInterval(timer);
  const f = () => { const el = $('#clock'); if (!el || !S) return clearInterval(timer); const t = Math.round((Date.now() - S.t0) / 1000); el.textContent = `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`; };
  f(); timer = setInterval(f, 1000);
}

window.addEventListener('hashchange', () => { if (location.hash !== '#solve' && S) home(); });
document.addEventListener('keydown', e => {
  if (!S || S.done) return;
  if (['1','2','3','4','5'].includes(e.key)) { const b = app.querySelector(`.opt[data-n="${e.key}"]`); if (b && !b.disabled) b.click(); }
  if (e.key === 'ArrowRight') { const b = $('#next'); if (b) b.click(); }
  if (e.key === 'ArrowLeft') { const b = $('#prev'); if (b && !b.disabled) b.click(); }
});
home();

</script>
