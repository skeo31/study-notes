<title>소크라테스의 변명 점검퀴즈 2</title>

<style>
/* 레이아웃: 한 문제씩 넘기는 시험지 카드 + 위쪽 문항 번호 줄. 남색 잉크 + 종이빛 바탕 */
:root{
  --bg:#f5f6f9; --paper:#ffffff; --ink:#1c2333; --muted:#5d6880; --line:#d9deea;
  --navy:#1f3a68; --navy-soft:#e7ecf6; --gold:#d79a1e;
  --ok:#1f7a4a; --ok-soft:#e3f3ea; --bad:#b33a3a; --bad-soft:#f8e6e6;
  --serif:'Gowun Batang','Noto Serif KR',serif; --sans:'IBM Plex Sans KR','Noto Sans KR',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11151d; --paper:#1a202b; --ink:#e6e9f0; --muted:#9aa4b8; --line:#2c3444;
  --navy:#8fb0e8; --navy-soft:#22304a; --gold:#e8b445;
  --ok:#5cc88d; --ok-soft:#173326; --bad:#ef7d7d; --bad-soft:#3a1f22; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151d; --paper:#1a202b; --ink:#e6e9f0; --muted:#9aa4b8; --line:#2c3444;
  --navy:#8fb0e8; --navy-soft:#22304a; --gold:#e8b445;
  --ok:#5cc88d; --ok-soft:#173326; --bad:#ef7d7d; --bad-soft:#3a1f22; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1{font-family:var(--serif);font-size:28px;margin:0;color:var(--navy);text-wrap:balance}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:600}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--navy);padding-bottom:10px;margin-bottom:18px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--paper)}
.seg button{border:0;background:none;padding:6px 14px;border-radius:999px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--paper);font-weight:600}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}
.sets{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:16px}
.set{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.set:hover{border-color:var(--navy)}
.set .k{font-size:12px;font-weight:700;color:var(--navy);letter-spacing:.04em}
.set .n{font-family:var(--serif);font-size:19px;font-weight:700}
.set .m{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.set .best{color:var(--ok);font-weight:600}
h2{font-size:14px;color:var(--muted);margin:26px 0 0;font-weight:600;letter-spacing:.04em}
.parts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--navy-soft);border-color:var(--navy);color:var(--navy);font-weight:600}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.btn{border:1px solid var(--navy);background:var(--navy);color:var(--paper);border-radius:8px;padding:10px 16px;font-weight:600}
.btn.ghost{background:var(--paper);color:var(--navy)}
.btn:disabled{opacity:.4;cursor:not-allowed}
/* 문제 화면 */
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.bar .ttl{font-weight:700;color:var(--navy)}
.bar .meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 16px}
.dot{width:32px;height:32px;border-radius:7px;border:1px solid var(--line);background:var(--paper);font-size:13px;font-variant-numeric:tabular-nums}
.dot.cur{border:2px solid var(--navy)}
.dot.done{background:var(--navy-soft)}
.dot.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.dot.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:20px}
.qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{background:var(--navy);color:var(--paper);font-weight:700;font-size:13px;padding:3px 10px;border-radius:4px}
.star{color:var(--gold);letter-spacing:1px;font-size:13px}
.star i{color:var(--line);font-style:normal}
.tag{font-size:12px;border:1px solid var(--line);border-radius:4px;padding:0 6px;color:var(--muted)}
.qt{font-family:var(--serif);font-size:18px;line-height:1.65;margin:12px 0}
.qt u{text-decoration-thickness:2px;text-underline-offset:3px}
.box{border:1.5px solid var(--navy);background:var(--navy-soft);padding:10px 14px;border-radius:6px;font-family:var(--serif);font-size:15.5px;line-height:1.75;margin:0 0 12px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:11px 12px;font-family:var(--serif);font-size:16px;line-height:1.55}
.opt .no{font-family:var(--sans);font-weight:700;color:var(--navy);flex:none}
.opt:hover{border-color:var(--navy)}
.opt.sel{border:2px solid var(--navy);background:var(--navy-soft)}
.opt.right{border:2px solid var(--ok);background:var(--ok-soft)}
.opt.wrong{border:2px solid var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.fb{margin-top:16px;border-top:1px dashed var(--line);padding-top:14px}
.verdict{font-weight:700;font-size:15px}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.ex{background:var(--bg);border-left:4px solid var(--navy);padding:10px 12px;border-radius:0 6px 6px 0;margin-top:8px;font-size:14.5px}
.wr{font-size:14px;color:var(--muted);margin-top:8px}
.wr b.l{color:var(--bad)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}
/* 결과 */
.score{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.score .big{font-family:var(--serif);font-size:48px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums}
.score .of{color:var(--muted)}
.byPart{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:14px}
.bp{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--paper);font-size:13px}
.bp b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;gap:6px;margin-top:16px}
.li{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:10px 12px}
.li .mk{flex:none;font-weight:700;width:22px}
.li .mk.ok{color:var(--ok)} .li .mk.bad{color:var(--bad)}
.li .tx{min-width:0;font-size:14px}
.li .tx small{display:block;color:var(--muted)}
.empty{color:var(--muted);background:var(--paper);border:1px dashed var(--line);border-radius:10px;padding:16px;margin-top:10px;font-size:14px}
@media (prefers-reduced-motion:no-preference){.opt,.dot,.set{transition:border-color .15s,background .15s}}
@media (max-width:480px){.qt{font-size:17px}.opt{font-size:15px}h1{font-size:24px}}
</style>

<script>window.__DATA__=[{"id": "b1", "title": "대비 1회", "kind": "예상 문제", "range": "28b~31c · 죽음과 사명", "qs": [{"q": "『소크라테스의 변명』 28b~d에서 소크라테스가 예로 든 테티스의 아들(아킬레우스)이 죽음과 위험보다 훨씬 더 무서워한 것은?", "box": null, "o": ["여신인 어머니를 슬프게 하는 일", "비겁한 사람으로 살게 되는 일과 친구들을 위해 복수하지 못하는 일", "헥토르와의 싸움에서 패배하는 일", "트로이 전쟁에서 그리스군이 지는 일"], "a": [2], "s": 1, "part": "죽음과 사명", "e": "28c~d: 아킬레우스는 \"헥토르 다음엔 네가 곧바로 죽는다\"는 어머니 테티스의 경고를 듣고도 죽음과 위험은 사소하게 여기고, <b>비겁한 사람으로 사는 일<\/b>과 <b>친구(파트로클로스)를 위해 복수하지 못하는 일<\/b>을 훨씬 더 무서워했다. \"곧바로 죽어도 좋습니다. 불의를 행한 사람에게 대가를 받아 낸다면.\"", "w": "어머니 테티스는 경고한 사람이고, 헥토르는 복수 대상이다."}, {"q": "『소크라테스의 변명』 28e에서 소크라테스가 지휘관의 명령에 따라 자리를 지키며 죽을 위험을 무릅썼다고 언급한 전투 장소가 <u>아닌<\/u> 것은?", "box": null, "o": ["포테이다이아", "마라톤", "암피폴리스", "델리온"], "a": [2], "s": 1, "part": "죽음과 사명", "e": "28e: \"<b>포테이다이아<\/b>에서든 <b>암피폴리스<\/b>에서든 <b>델리온<\/b>에서든\" 지휘관이 명령한 자리를 지켰다. 그런데 이제 신이 \"지혜를 사랑하며 나와 남을 검토하며 살라\"고 명령했는데 죽음이 무서워 그 자리를 떠난다면 무서운 일이라는 논리(<b>병사 비유<\/b>)다.", "w": "마라톤 전투(기원전 490)는 소크라테스가 태어나기 전의 일이다."}, {"q": "빈칸에 들어갈 말로 가장 알맞은 것은?", "box": "“알다시피, 여러분, 죽음을 무서워한다는 것은 (　　　　　　)에 다름 아니거든요. 그건 알지 못하는 것들을 안다고 생각하는 거니까요.”", "o": ["지혜롭지 않은데도 지혜롭다고 생각하는 것", "신들이 있다고 믿지 않는 것", "용기가 없어 비겁한 것", "삶을 지나치게 사랑하는 것"], "a": [1], "s": 1, "part": "죽음과 사명", "e": "29a: 죽음을 무서워하는 것은 <b>지혜롭지 않은데도 지혜롭다고 생각하는 것<\/b>, 즉 알지 못하는 것을 안다고 생각하는 것이다. 아무도 죽음이 최대로 좋은 것인지조차 모르는데, 최대로 나쁜 것임을 아는 것처럼 무서워하기 때문이다. 21d의 <b>무지의 자각<\/b>이 죽음 문제에 그대로 적용된다.", "w": null}, {"q": "『소크라테스의 변명』 29b에서 소크라테스가 \"나는 안다\"고 분명하게 말한 것은?", "box": null, "o": ["죽음이 인간에게 생길 수 있는 좋은 것들 가운데 최대로 좋은 것이라는 것", "하데스(저승)의 일들이 어떠한지", "불의를 행하는 일과, 신이건 인간이건 자기보다 더 훌륭한 이에게 불복하는 일이 나쁘고 추하다는 것", "영혼은 죽지 않고 다른 곳으로 옮겨 간다는 것"], "a": [3], "s": 2, "part": "죽음과 사명", "e": "29b: 하데스의 일들은 <b>충분히 알지 못하니까 알지 못한다고 생각<\/b>한다. 그러나 <b>불의를 행하는 일<\/b>과 <b>더 훌륭한 이(신이든 인간이든)에게 불복하는 일<\/b>이 나쁘고 추하다는 것은 안다. 그래서 나쁘다고 아는 것보다, 좋은지 나쁜지도 모르는 것(죽음)을 두려워하지 않겠다는 결론이 나온다.", "w": "① 죽음이 최대로 좋은 것인지조차 모른다고 했다. ②④ 모른다고 하거나 \"전해지는 말\"(40c)로만 언급한다."}, {"q": "『소크라테스의 변명』 29c~d에서 재판관들이 \"더 이상 탐색과 지혜 사랑을 하지 않는다는 조건으로 방면하겠다\"고 한다면, 소크라테스는 어떻게 하겠다고 말했는가?", "box": null, "o": ["조건을 받아들이고 아테네를 떠나 조용히 살겠다.", "지혜 사랑은 그만두되 젊은이들과의 대화는 계속하겠다.", "여러분을 좋아하고 사랑하지만, 여러분보다는 신에게 복종하여 숨 쉬는 한 지혜 사랑을 멈추지 않겠다.", "공적인 자리에서만 조언하고 개인적인 검토는 그만두겠다."], "a": [3], "s": 1, "part": "죽음과 사명", "e": "29d: \"아테네인 여러분, 나는 여러분을 좋아하고 사랑하지만, <b>여러분보다는 오히려 신에게 복종<\/b>할 겁니다. 그래서 내가 숨 쉬고 있고 할 수 있는 한은 지혜 사랑하는 일을 멈추지 않을 겁니다.\" 30c에서도 \"여러 번 죽게 될 거라 해도 다른 일들을 하지는 않을 것\"이라고 못 박는다.", "w": null}, {"q": "『소크라테스의 변명』 29d~e에서 소크라테스가 아테네인들에게 \"수치스럽지 않습니까?\"라고 물으며, 그들이 <b>돌보지도 신경 쓰지도 않는다<\/b>고 지적한 것이 <u>아닌<\/u> 것은?", "box": null, "o": ["현명함", "진실", "영혼이 최대한 훌륭해지게 하는 일", "명성과 명예"], "a": [4], "s": 2, "part": "죽음과 사명", "e": "29d~e: 아테네 사람들은 <b>돈·명성·명예<\/b>는 돌보면서 <b>현명함·진실·영혼이 최대한 훌륭해지게 하는 일<\/b>은 돌보지 않는다. 명성과 명예는 오히려 \"돌보는\" 쪽이다.", "w": "돌보는 것(돈, 명성, 명예) vs 돌보지 않는 것(현명함, 진실, 영혼) — 대비 구조를 기억하자."}, {"q": "빈칸에 공통으로 들어갈 말로 알맞은 것은?", "box": "“돈으로부터 (　　)이 생기는 게 아니라, (　　)으로부터 돈과 인간들에게 좋은 다른 모든 것들이 사적인 영역에서든 공적인 영역에서든 생깁니다.”", "o": ["덕", "지혜", "명예", "행복"], "a": [1], "s": 1, "part": "죽음과 사명", "e": "30b: \"돈으로부터 <b>덕<\/b>이 생기는 게 아니라, <b>덕<\/b>으로부터 돈과 인간들에게 좋은 다른 모든 것들이 사적인 영역에서든 공적인 영역에서든 생깁니다.\" 영혼(덕)을 돌보는 것을 육체나 돈보다 앞세우라는 권고다.", "w": null}, {"q": "『소크라테스의 변명』 30c~e에서 소크라테스가 한 주장으로 옳지 <u>않은<\/u> 것은?", "box": null, "o": ["자신을 죽인다면 자신보다 아테네인들 자신에게 더 큰 해를 주게 될 것이다.", "더 훌륭한 사람이 더 형편없는 사람에게서 해를 입는 것은 법도에 맞지 않으므로, 멜레토스도 아뉘토스도 자신에게 해를 끼치지 못한다.", "사람을 죽이거나 추방하는 것보다, 사람을 부정의하게 죽이려 시도하는 것이 훨씬 더 나쁘다.", "지금 자신은 무엇보다 자기 자신의 목숨을 구하기 위해 항변하고 있다."], "a": [4], "s": 2, "part": "죽음과 사명", "e": "30d~e: \"지금 나는 <b>나 자신을 위해서 항변을 하고 있는 게 전혀 아닙니다<\/b>. 오히려 <b>여러분을 위해서<\/b>, 즉 여러분이 유죄 표를 던져 <b>신이 준 선물<\/b>에 대해 잘못을 범하지 않도록 하려고 항변하는 겁니다.\"", "w": "①②③ 모두 30c~d 본문 내용."}, {"q": "『소크라테스의 변명』 30e~31a에서 소크라테스는 자신을 국가에 붙여 놓은 '등에'에 비유한다. 이때 국가는 무엇에 비유되었는가?", "box": null, "o": ["크고 혈통 좋지만 큰 덩치 때문에 꽤 굼떠서, 일깨워 줄 필요가 있는 말(馬)", "키잡이 없이 표류하는 배", "양 떼를 잃어버린 목자", "병이 들어 의사가 필요한 환자"], "a": [1], "s": 1, "part": "죽음과 사명", "e": "30e: 국가 = <b>크고 혈통 좋지만 굼뜬 말<\/b>, 소크라테스 = 신이 붙여 놓은 <b>등에(쇠파리)<\/b>. 하루 종일 붙어 앉아 일깨우고 설득하고 꾸짖는다. 짜증이 난 아테네인들은 졸다 깬 사람처럼 등에를 탁 때려 죽이고 남은 삶을 쿨쿨 잘지도 모른다(31a).", "w": "②~④는 플라톤의 다른 대화편(『국가』 등)에 나오는 비유이거나 본문에 없는 비유다."}, {"q": "『소크라테스의 변명』 31a~c의 내용으로 옳지 <u>않은<\/u> 것은?", "box": null, "o": ["소크라테스는 숱한 세월 동안 자기 자신의 일과 집안일을 돌보지 않았다.", "아버지나 형처럼 각자에게 개인적으로 찾아가 덕을 돌보라고 설득해 왔다.", "고발자들도 소크라테스가 누군가에게서 보수를 받거나 요구했다는 증인만큼은 내세우지 못했다.", "소크라테스는 자신이 진실을 말한다는 증인으로 자신의 가난을 내세운다."], "a": [5], "s": 2, "part": "죽음과 사명", "e": "①~④ 모두 본문 내용이므로 정답은 ⑤. 자기 일은 돌보지 않고 남의 덕을 돌본 것은 \"<b>인간에게 속한 일 같지 않다<\/b>\" → 신이 준 선물이라는 증거. 보수를 받은 적이 없다는 증인은 <b>나의 가난<\/b>(31c).", "w": "① 31a~b ② 31b ③ 31b~c ④ 31c"}]}, {"id": "b2", "title": "대비 2회", "kind": "예상 문제", "range": "31c~35d · 공적 활동·맺는 말", "qs": [{"q": "『소크라테스의 변명』 31c~d에서 소크라테스가 말한 '신적인 혹은 신령스러운 것'에 대한 설명으로 옳지 <u>않은<\/u> 것은?", "box": null, "o": ["어린 시절부터 시작된 일종의 목소리다.", "생길 때마다 늘 소크라테스가 하려는 일을 못하게 말린다.", "때로는 마땅히 해야 할 일을 하라고 부추기기도 한다.", "소크라테스가 정치적인 활동을 하는 것에 반대했다."], "a": [3], "s": 1, "part": "공적 활동", "e": "31d: \"어떤 목소리가 생겨나는데, 생길 때마다 늘 내가 하려는 일을 못하게 <b>말리긴 해도 하라고 부추기는 적은 한 번도 없지요<\/b>.\" 멜레토스가 고발장에서 희화화한 \"새로운 신령스러운 것\"이 바로 이것이다.", "w": "이 신호가 40a~c에서는 \"반대하지 않았다\"는 점에서 다시 중요해진다."}, {"q": "『소크라테스의 변명』 31d~32a에서 소크라테스가 공적으로 국가를 위해 조언하지 않은 이유로 가장 적절한 것은?", "box": null, "o": ["자신은 연설에 재능이 없어 대중 앞에서 말할 수 없었기 때문이다.", "보수를 받지 않고서는 정치 활동을 할 수 없었기 때문이다.", "아테네의 민주정 자체를 혐오했기 때문이다.", "정치 활동을 했다면 오래전에 죽어 아무 이득도 주지 못했을 것이며, 정의를 위해 싸우려는 사람은 사적인 삶을 살아야 하기 때문이다."], "a": [4], "s": 2, "part": "공적 활동", "e": "31d~32a: 다수 대중에게 진정성 있게 반대하며 불의를 막으면서 <b>목숨을 보전할 사람은 아무도 없다<\/b>. 그러니 참으로 정의를 위해 싸우려는 사람은 잠깐이라도 살아남으려면 <b>공적인 삶이 아니라 사적인 삶<\/b>을 살아야 한다.", "w": null}, {"q": "『소크라테스의 변명』 32a~c에서 소크라테스가 평의회 의원으로서 혼자 반대하고 반대표를 던진 일은?", "box": null, "o": ["30인 통치자들을 선출하자는 의결", "해전에서 사람들을 건져 주지 못한 열 명의 장군을 한꺼번에 묶어(병합하여) 심리하자는 의결", "시칠리아 원정을 떠나자는 의결", "소피스트들을 아테네에서 추방하자는 의결"], "a": [2], "s": 2, "part": "공적 활동", "e": "32b: 마침 <b>안티오키스 부족<\/b>이 평의회 운영을 맡았을 때, 해전(아르기누사이 해전, 406)에서 사람들을 건지지 못한 <b>열 명의 장군을 병합 심리<\/b>하자는 불법적 의결에 운영위원 중 <b>소크라테스만<\/b> 반대했다. 연설가들이 고발·체포하려 하고 대중이 소리쳐도 \"법과 정의의 편에서 위험을 무릅써야 한다\"고 생각했다.", "w": "나중에 모두가 그것이 불법이었다고 인정했다."}, {"q": "『소크라테스의 변명』 32c~d의 30인 통치자 시기 일화에 대한 설명으로 옳지 <u>않은<\/u> 것은?", "box": null, "o": ["30인 통치자들은 소크라테스를 비롯해 다섯 사람을 원형 청사로 불렀다.", "소크라테스는 레온에게 미리 사람을 보내 도망치라고 알려 주었다.", "30인은 살라미스 사람 레온을 죽일 작정으로 잡아 오라고 명령했다.", "정권이 빨리 무너지지 않았다면 소크라테스는 이 일 때문에 죽었을 것이다."], "a": [2], "s": 2, "part": "공적 활동", "e": "32d: 네 사람은 살라미스로 가서 레온을 잡아 왔지만 <b>소크라테스는 그냥 헤어져 집으로 갔다<\/b>. 레온에게 알렸다는 내용은 없다. \"죽음에 대해서는 눈곱만큼도 관심이 없지만, <b>부정의하거나 불경건한 일을 저지르지 않는 것<\/b>에는 온통 관심을 쏟는다.\"", "w": "30인이 여러 사람에게 이런 명령을 한 이유: 가능한 한 많은 사람을 자기들의 죄악에 물들이려고(32c)."}, {"q": "『소크라테스의 변명』에서 소크라테스가 \"말이 아니라 행동\"의 증거로 든 두 사건을 당시 정체(政體)와 바르게 짝지은 것은?", "box": null, "o": ["열 장군 병합 심리 반대 - 민주정 / 레온 체포 거부 - 과두정(30인)", "열 장군 병합 심리 반대 - 과두정(30인) / 레온 체포 거부 - 민주정", "두 사건 모두 민주정", "두 사건 모두 과두정(30인)"], "a": [1], "s": 1, "part": "공적 활동", "e": "32c: \"이건 우리 나라가 <b>아직 민주정 치하<\/b>일 때의 일이었지요. 그런데 <b>과두정<\/b>이 들어서자, 이번에는 30인 통치자들이…\" → 소크라테스는 <b>어느 정체 아래에서든<\/b> 죽음이 두려워 불의에 굴복하지 않았다.", "w": null}, {"q": "『소크라테스의 변명』 33a~b에서 소크라테스가 자신에 대해 한 말로 옳지 <u>않은<\/u> 것은?", "box": null, "o": ["자신은 어느 누구의 선생도 되어 본 적이 없다.", "부자에게든 가난한 사람에게든 똑같이 질문하라고 자신을 내어놓는다.", "누구에게도 배울거리를 약속하거나 가르친 적이 없으니, 그들이 쓸 만한 사람이 되는지의 책임을 떠맡는 것은 정의롭지 않다.", "자신에게서 개인적으로 남들은 들어 보지 못한 특별한 가르침을 받은 제자들이 있다."], "a": [4], "s": 2, "part": "공적 활동", "e": "33b: \"누군가가 언젠가 나한테서 뭔가를 개인적으로 배우거나 들은 적이 있다고 주장한다면(<b>다른 사람들은 다 그런 적이 없는<\/b> 그런 뭔가를 말이에요), 그는 <b>진실되지 않은 말<\/b>을 하고 있다.\" 비밀 교육이나 사적인 가르침은 없었다는 것.", "w": "\"제자들\"은 비방하는 사람들이 그렇게 부를 뿐이다(33a). 알키비아데스·크리티아스 같은 인물에 대한 책임을 떠맡지 않는다는 숨은 뜻."}, {"q": "『소크라테스의 변명』 33b~c에서 몇몇 사람들이 소크라테스와 많은 시간을 보내며 즐거워하는 이유로 소크라테스가 말한 것은?", "box": null, "o": ["지혜롭다고 생각하지만 실은 그렇지 않은 사람들이 검토받는 것을 들으며 즐거워한다.", "소크라테스가 수사학을 공짜로 가르쳐 준다.", "소크라테스가 재미있는 옛날이야기를 많이 들려준다.", "소크라테스와 어울리면 정치적 출세에 도움이 된다."], "a": [1], "s": 1, "part": "공적 활동", "e": "33c: 그들은 \"<b>지혜롭다고 생각은 하지만 실은 그렇지 않은 사람들이 검토받는 것<\/b>을 들으면서 즐거워하는\" 것이다. 그리고 이 검토는 신이 <b>예언·꿈·온갖 신적 섭리<\/b>를 통해 하라고 명한 일이다.", "w": null}, {"q": "『소크라테스의 변명』 33d~34a에서 소크라테스가 법정에 와 있다고 거명한 사람들의 관계로 옳지 <u>않은<\/u> 것은?", "box": null, "o": ["크리톤 - 소크라테스와 동년배이자 같은 마을 사람, 크리토불로스의 아버지", "뤼사니아스 - 아이스키네스의 아버지", "아폴로도로스 - 크리톤의 아들", "아데이만토스 - 플라톤의 형제"], "a": [3], "s": 2, "part": "공적 활동", "e": "34a: <b>아폴로도로스<\/b>는 <b>아이안토도로스의 형제<\/b>다. 소크라테스는 \"망쳐졌다\"는 젊은이들의 아버지·형제가 와 있는데도 아무도 고발하지 않고, 오히려 자신을 도우려 한다는 점을 증거로 삼는다. 멜레토스는 그들 중 누구도 증인으로 세우지 못했다.", "w": "이 대목은 플라톤이 『변명』에서 자기 이름을 넣은 첫 장면이기도 하다(34a, 38b)."}, {"q": "『소크라테스의 변명』 34c~d에서 소크라테스가 자신의 가족에 대해 한 말로 옳은 것은?", "box": null, "o": ["자식이 없어서 법정에 데려올 사람이 없다.", "\"나무에서나 바위에서\" 태어난 게 아니라 인간에게서 태어났고, 아들이 셋(하나는 청년, 둘은 어린애) 있지만 법정에 올라오게 해서 간청하지는 않겠다.", "아들 둘을 법정에 올라오게 해 방면을 간청하게 했다.", "아들들이 모두 성인이 되어 스스로 아버지를 변호할 것이다."], "a": [2], "s": 1, "part": "맺는 말", "e": "34d: 호메로스의 말을 인용해 \"나도 <b>나무에서나 바위에서<\/b> 태어난 게 아니라 인간들에게서 태어났으니\" 집안사람도 아들도 있다. <b>아들은 셋<\/b> — 하나는 벌써 청년, 둘은 어린애. 그래도 누구도 올라오게 해서 방면을 간청하지 않겠다.", "w": null}, {"q": "『소크라테스의 변명』 34e~35d에서 소크라테스가 재판관들에게 눈물로 동정을 호소하지 않는 이유로 언급되지 <u>않은<\/u> 것은?", "box": null, "o": ["이 나이에 그런 이름으로 불리는 자신이 그런 일을 하는 것은 자신에게도 국가 전체에도 명성과 관련해 아름답지 못하다.", "불쌍한 행위들을 연출하는 사람은 국가를 웃음거리로 만든다.", "재판관은 호의를 베풀겠다가 아니라 법에 따라 판결하겠다고 서약했으므로, 간청해서 죄를 벗는 것은 정의롭지 않다.", "재판관이 서약을 깨게 만들면, 신들이 있다는 걸 믿지 말라고 가르치는 셈이 되어 스스로를 불경죄로 고발하는 꼴이 된다."], "a": [5], "s": 3, "part": "맺는 말", "e": "①~④ 모두 본문에 나오므로 정답은 ⑤. 이유는 세 갈래로 정리된다: <b>명예<\/b>(아름답지 않다, 34e~35b) · <b>정의<\/b>(간청이 아니라 가르치며 설득해야, 35b~c) · <b>경건<\/b>(서약을 깨게 하면 불경, 35c~d).", "w": "① 34e~35a ② 35b ③ 35c ④ 35c~d"}]}, {"id": "b3", "title": "대비 3회", "kind": "예상 문제", "range": "35e~42a · 둘째·셋째 연설", "qs": [{"q": "『소크라테스의 변명』 35e~36a에서 유죄 판결이 나온 직후 소크라테스가 \"훨씬 더 놀라워한\" 것은?", "box": null, "o": ["유죄 판결이 나왔다는 사실 그 자체", "유무죄 양편의 표 차이가 근소해서, 30표만 바뀌었어도 죄를 벗었을 것 같다는 점", "멜레토스가 사형을 형량으로 제안했다는 점", "친구들이 벌금을 대신 내겠다고 나선 점"], "a": [2], "s": 1, "part": "둘째 연설", "e": "36a: 유죄 판결은 \"예상 못 한 일이 아니었다\". 놀라운 것은 <b>근소한 표차<\/b> — \"<b>30표<\/b>만 바뀌었다 해도 죄를 벗을 수 있었을 것\". 또 아뉘토스와 뤼콘이 없었다면 멜레토스는 총투표수의 <b>5분의 1<\/b>을 못 얻어 <b>천 드라크마<\/b>를 물었을 것이라고 비꼰다.", "w": null}, {"q": "『소크라테스의 변명』 36b~37a에서 소크라테스가 \"정의에 합당하게 받아 마땅한 것\"으로 처음 제안한 형량은?", "box": null, "o": ["시 중앙 청사에서 받는 식사 대접", "은화 1므나의 벌금", "아테네에서의 추방", "11인 관리 아래에서의 옥살이"], "a": [1], "s": 1, "part": "둘째 연설", "e": "36d~37a: 가난한 사람이요 <b>유공자<\/b>이며 권고하는 일을 위해 여유가 필요한 자신에게는 <b>시 중앙 청사(프뤼타네이온)에서의 식사 대접<\/b>이 가장 어울린다. 올림피아 경기 승자는 여러분을 행복해 <b>보이게<\/b> 하지만 나는 행복하게 <b>만들며<\/b>, 승자는 부양이 필요 없지만 나는 필요하다.", "w": "② 1므나는 나중에(38b) 현실적으로 제안한 벌금. ③④는 고려했다가 거부한 형벌."}, {"q": "『소크라테스의 변명』 37b~e에서 소크라테스가 대안 형량으로 고려했다가 거부한 형벌과 그 이유를 짝지은 것으로 옳지 <u>않은<\/u> 것은?", "box": null, "o": ["옥살이 - 그때그때 임명되는 11인 관리에게 종노릇하며 감옥에서 살 이유가 없다.", "벌금(완납 때까지 구금) - 벌금을 물 돈이 없으니 결국 옥살이와 같다.", "추방 - 동료 시민도 견디지 못한 담론과 논변을 다른 나라 사람들이 쉽게 견딜 리 없다.", "추방 - 다른 나라의 젊은이들은 자기 말에 귀를 기울이지 않을 테니 할 일이 없다."], "a": [4], "s": 2, "part": "둘째 연설", "e": "37d~e: 오히려 \"어딜 가든 젊은이들은 <b>여기서 그러는 것과 꼭 마찬가지로 내 말에 귀를 기울일 것<\/b>\"이다. 그러면 젊은이들을 쫓아 버리든(그들이 연장자를 설득해 추방) 쫓아 버리지 않든(그들의 아버지·집안사람이 추방) 결국 또 추방당한다.", "w": null}, {"q": "다음은 \"침묵을 지키고 조용히 지내면 추방되어도 살 수 있지 않느냐\"는 물음에 대한 소크라테스의 대답이다. 빈칸에 들어갈 말로 알맞은 것은?", "box": "“날마다 덕에 관해서 그리고 다른 것들에 관해서 이야기를 만들어 가는 것, 이것이 그야말로 인간이 누릴 수 있는 최상의 좋음이며, 검토 없이 사는 삶은 (　　　　　　)고 말하면, 여러분은 이런 말을 하는 나를 훨씬 더 못 미더워할 겁니다.”", "o": ["인간에게 위험하다", "신에게 불경하다", "인간에게 살 가치가 없다", "국가에 해롭다"], "a": [3], "s": 1, "part": "둘째 연설", "e": "38a: \"날마다 덕에 관해 이야기를 만들어 가는 것이 인간이 누릴 수 있는 <b>최상의 좋음<\/b>이며, <b>검토 없이 사는 삶은 인간에게 살 가치가 없다<\/b>.\" 조용히 지낼 수 없는 첫째 이유는 그것이 <b>신에게 불복하는 일<\/b>이기 때문이다(37e) — 그러나 그렇게 말하면 '의뭉을 떤다'(반어)고 믿지 않을 것.", "w": null}, {"q": "『소크라테스의 변명』 38b의 벌금 제안에 대한 설명으로 옳은 것은?", "box": null, "o": ["소크라테스는 처음부터 30므나를 벌금으로 제안했다.", "처음에는 은화 1므나를 제안했다가, 플라톤·크리톤·크리토불로스·아폴로도로스가 보증을 서겠다고 하여 30므나를 제안했다.", "카이레폰과 그의 형제가 보증인이 되어 주었다.", "벌금을 낼 수 없으므로 추방과 벌금을 함께 제안했다."], "a": [2], "s": 1, "part": "둘째 연설", "e": "38b: 돈이 없으니 물 능력이 되는 <b>은화 1므나<\/b>를 제안 → \"여기 이 <b>플라톤과 크리톤과 크리토불로스와 아폴로도로스<\/b>가 30므나를 제안하라고 권하는군요. 자기들이 직접 보증을 서겠다네요\" → <b>30므나<\/b> 제안. 배심원들은 결국 멜레토스의 사형을 택했다.", "w": "③ 카이레폰은 이미 고인(21a)."}, {"q": "다음은 사형 판결 후 소크라테스의 말이다. ㉠, ㉡에 들어갈 말을 알맞게 짝지은 것은?", "box": "“지금 나는 느리고 나이 든 사람이라서 더 느린 것, 즉 (　㉠　)에게 잡혔지만, 내 고발자들은 능란하고 기민해서 더 빠른 것, 즉 (　㉡　)에게 잡혔지요.”", "o": ["㉠ 죽음 ㉡ 악(사악)", "㉠ 악(사악) ㉡ 죽음", "㉠ 시간 ㉡ 명예", "㉠ 죽음 ㉡ 진실"], "a": [1], "s": 2, "part": "사형 투표자에게", "e": "39a~b: 죽음을 피하는 것보다 훨씬 어려운 것은 <b>사악을 피하는 것<\/b> — 그것은 죽음보다 더 빨리 달려온다. 느리고 늙은 소크라테스는 더 느린 <b>죽음<\/b>에게, 능란하고 기민한 고발자들은 더 빠른 <b>악<\/b>에게 잡혔다. 소크라테스는 여러분에 의해 죽음을, 고발자들은 <b>진실에 의해<\/b> 악덕과 불의를 선고받고 떠난다.", "w": null}, {"q": "『소크라테스의 변명』 39c~d에서 소크라테스가 유죄 표를 던진 사람들에게 한 예언으로 옳지 <u>않은<\/u> 것은?", "box": null, "o": ["자신의 죽음 이후 곧바로 훨씬 더 혹독한 앙갚음이 그들에게 닥칠 것이다.", "그들을 논박하는 사람들이 더 많아질 것이며, 지금까지는 소크라테스가 그들을 자제시켜 왔다.", "새로 나타날 논박자들은 더 젊은 만큼 더 혹독할 것이다.", "사람들을 죽이는 것이 비난에서 벗어나는 가장 쉽고 확실한 방법이다."], "a": [4], "s": 2, "part": "사형 투표자에게", "e": "39d: 사람들을 죽여서 비난을 막는 길은 \"<b>가능하지도 아름답지도 않으며<\/b>\", 가장 아름답고 쉽게 벗어나는 길은 <b>남들을 억누르는 게 아니라 자신을 가능한 한 훌륭하게 되도록 다잡는 것<\/b>이다.", "w": "죽기 직전이 인간이 예언을 가장 잘하는 때라는 당시 통념(39c)도 함께 기억."}, {"q": "『소크라테스의 변명』 39e~40c에 대한 설명으로 옳지 <u>않은<\/u> 것은?", "box": null, "o": ["소크라테스는 방면 쪽에 투표한 사람들을 비로소 \"재판관 여러분\"이라고 부른다.", "신령스러운 것의 예언은 이전에는 대단히 사소한 일에도 반대하곤 했다.", "신호가 반대하지 않은 것을 보면, 자신에게 일어난 일은 분명 나쁜 일이다.", "이번에는 아침에 집을 나설 때도, 재판정에 올라올 때도, 연설 중에도 신호가 반대하지 않았다."], "a": [3], "s": 2, "part": "무죄 투표자에게", "e": "40b~c: 신호가 반대하지 않았다는 것은 <b>이 일이 좋은 것<\/b>이라는 큰 증거다. \"죽음이 나쁜 것이라고 생각한다면 우리는 올바르게 상정하고 있는 것일 수가 없다.\" 앞에서 사형 투표자들에게는 계속 \"아테네인 여러분\"이라 부르다가, 무죄 투표자들에게만 \"<b>재판관 여러분<\/b>\"이라고 부르는 점도 시험 포인트.", "w": null}, {"q": "『소크라테스의 변명』 40c~41c에서 소크라테스가 말한 죽음에 대한 설명으로 옳지 <u>않은<\/u> 것은?", "box": null, "o": ["죽음은 아무 감각도 없는 것이거나, 영혼이 이곳에서 딴 곳으로 옮겨 사는 것, 둘 중 하나다.", "꿈조차 꾸지 않는 깊은 잠과 같다면, 대왕조차 그런 밤은 손에 꼽을 정도일 것이니 놀랄 만한 이득이다.", "하데스로 옮겨 간다면 미노스, 라다만튀스, 아이아코스, 트립톨레모스 같은 진짜 재판관들을 만날 것이다.", "그곳에서도 사람들을 검토하며 지낼 수 있는데, 그곳 사람들은 이 일 때문에 누군가를 죽이는 일이 확실히 없다."], "a": [5], "s": 2, "part": "무죄 투표자에게", "e": "①~④ 모두 본문 내용이므로 정답은 ⑤. 저승에서는 오르페우스·무사이오스·헤시오도스·호메로스와 함께하고, <b>팔라메데스<\/b>·<b>텔라몬의 아들 아이아스<\/b>처럼 부정의한 심판으로 죽은 사람들과 처지를 견주며, 아가멤논(트로이 원정 대장)·오뒷세우스·시쉬포스를 <b>검토<\/b>하는 것이 \"최대로 좋은 일\"이다.", "w": "① 40c ② 40d~e ③ 41a ④ 41c"}, {"q": "『소크라테스의 변명』 41c~42a의 마지막 말에 대한 설명으로 옳은 것은?", "box": null, "o": ["자신의 아들들을 잘 보살펴 달라고 크리톤에게 따로 부탁했다.", "아들들이 덕보다 돈 같은 것을 우선하여 돌보거나 아무것도 아니면서 한인물 한다고 생각하면, 자신이 그랬던 것처럼 괴롭히고 꾸짖어 달라고 부탁했다.", "자신을 고발하고 유죄 표를 던진 사람들에게 복수해 달라고 부탁했다.", "\"우리 중 어느 쪽이 더 좋은 일을 향해 가고 있는지는 나는 분명히 안다\"라는 말로 연설을 끝맺었다."], "a": [2], "s": 1, "part": "무죄 투표자에게", "e": "41e~42a: 아들들이 자라면 \"<b>내가 여러분을 괴롭혔던 것과 똑같이 그들을 괴롭히는 것<\/b>으로 갚아 주세요.\" 고발자들에게는 <b>악감정이 전혀 없다<\/b>(41d). 마지막 말: \"나는 죽으러, 여러분은 살러 갈 시간. 우리 중 어느 쪽이 더 좋은 일을 향해 가고 있는지는 <b>신 말고는 그 누구에게도 분명치 않습니다<\/b>.\"", "w": "④ 끝까지 \"모른다\"는 태도 — 무지의 자각으로 시작해 무지의 자각으로 끝난다."}]}, {"id": "b4", "title": "대비 4회", "kind": "예상 문제", "range": "28b~42a · 종합", "qs": [{"q": "『소크라테스의 변명』 28c~d에서 아킬레우스가 \"곧바로 죽어도 좋다\"며, 복수하지 않고 살아남으면 처하게 될 처지로 말한 것은?", "box": null, "o": ["구부러진 배 곁에서 비웃음의 대상으로, 대지의 짐으로 남아 있는 것", "어머니 테티스를 슬프게 하는 것", "고향으로 돌아가 겁쟁이라 불리는 것", "트로이의 노예가 되는 것"], "a": [1], "s": 2, "part": "죽음과 사명", "e": "28d: \"곧바로 죽어도 좋습니다. 불의를 행한 사람에게 대가를 받아 낸다면 말입니다. 그래야 여기 <b>구부러진 배 곁에서 비웃음의 대상으로, 대지의 짐으로<\/b> 남아 있지 않게 되겠지요.\" 아킬레우스는 죽음보다 <b>수치<\/b>를 더 두려워한 본보기다.", "w": null}, {"q": "28d에서 소크라테스가 밝힌 원칙이다. 빈칸에 들어갈 말로 알맞은 것은?", "box": "“누군가가 최선이라고 생각해서 어떤 자리에 자기 자신을 배치했거나, 혹은 지휘관이 배치해 주었다면, 그게 어디든 그 자리에 남아서 위험을 무릅써야 한다고 난 생각합니다. 죽음이든 다른 어떤 것이든 (　　　　)보다 먼저 계산에 넣는 일은 아예 하지 않으면서 말입니다.”", "o": ["명예로운 것", "이로운 것", "수치스러운 것", "정의로운 것"], "a": [3], "s": 2, "part": "죽음과 사명", "e": "28d: 스스로 최선이라 생각해 자리 잡았든 지휘관이 배치했든, 그 자리에 남아 위험을 무릅써야 한다. \"죽음이든 다른 어떤 것이든 <b>수치스러운 것<\/b>보다 먼저 계산에 넣는 일은 아예 하지 않으면서.\"", "w": null}, {"q": "『소크라테스의 변명』 29a에서 소크라테스는 신이 배치한 자리를 떠난다면 \"신들이 있다고 믿지 않는 거라 여기며\" 자신을 재판정에 세워도 정의로울 것이라고 말한다. 그 근거로 든 것이 <u>아닌<\/u> 것은?", "box": null, "o": ["예언에 불복하는 것", "죽음을 무서워하는 것", "지혜롭지 않은데도 지혜롭다고 생각하는 것", "국가가 정한 법률을 어기는 것"], "a": [4], "s": 2, "part": "죽음과 사명", "e": "29a: \"내가 <b>예언에 불복<\/b>하고 <b>죽음을 무서워<\/b>하며 <b>지혜롭지 않은데도 지혜롭다고 생각<\/b>한다는 점에서\" — 이 세 가지. 법률 위반은 언급되지 않는다. 고발장의 \"신을 믿지 않는다\"를 뒤집어, 진짜 불경은 신의 명령을 버리는 것이라는 논리.", "w": null}, {"q": "『소크라테스의 변명』 29c에서 소크라테스가 전한 아뉘토스의 주장으로 옳은 것은?", "box": null, "o": ["소크라테스에게는 벌금형 정도면 충분하다.", "소크라테스는 애초에 법정에 서지 말았어야 했지만, 일단 섰으니 죽이지 않을 수 없다. 방면되면 여러분의 아들들이 완전히 망쳐질 것이다.", "소크라테스를 추방하기만 하면 아테네는 안전해진다.", "소크라테스가 지혜 사랑을 그만둔다면 방면해도 좋다."], "a": [2], "s": 2, "part": "죽음과 사명", "e": "29c: 아뉘토스는 \"애초에 내가 여기 법정에 <b>서지 말았어야<\/b> 했는데 그러지 못했고, 일단 선 이상은 <b>죽이지 않을 수 없다<\/b>\"고, 방면되면 아들들이 소크라테스를 따라 하다 <b>모두 완전히 망쳐질 것<\/b>이라고 주장했다.", "w": "④ 이것은 소크라테스가 가정한 \"조건부 방면\"이며 아뉘토스의 주장이 아니다. 소크라테스는 그것도 거부한다."}, {"q": "『소크라테스의 변명』 29d~30a에서 소크라테스가 \"자기는 영혼을 돌보고 있다\"며 이의를 제기하는 사람에게 하겠다고 한 일로 옳지 <u>않은<\/u> 것은?", "box": null, "o": ["곧바로 놓아주거나 가 버리지 않고, 묻고 검토하고 논박한다.", "덕을 갖고 있지 않은데도 그렇다고 주장한다고 여겨지면, 가장 가치 있는 일은 하찮게 여기고 보잘것없는 일은 중시한다고 비난한다.", "젊은이든 나이 든 이든, 외지인이든 내지인이든 만나는 누구에게나 이렇게 한다.", "가문이 더 가까운 만큼, 내지인인 아테네 사람들에게는 더욱 그렇게 한다."], "a": [5], "s": 2, "part": "죽음과 사명", "e": "①~④ 모두 29e~30a 본문 내용 → ⑤ 답 없음. 소크라테스의 검토(엘렝코스)는 <b>묻기 → 검토 → 논박 → 비난(가치의 전도 지적)<\/b>의 순서로 진행된다.", "w": null}, {"q": "『소크라테스의 변명』 30e~31a의 등에 비유에서, 소크라테스가 아테네인들이 자신을 죽인 뒤 어떻게 될 것이라고 말했는가?", "box": null, "o": ["꾸벅꾸벅 졸다가 깨어난 사람들처럼 짜증을 내며 나를 탁 때려 죽이고, 신이 다른 누군가를 보내 주지 않는 한 나머지 삶을 쿨쿨 자면서 보낼 것이다.", "곧바로 후회하며 소크라테스의 동상을 세울 것이다.", "스스로 다른 등에를 찾아 국가에 붙여 놓을 것이다.", "잠에서 깨어나 모두 덕을 돌보게 될 것이다."], "a": [1], "s": 1, "part": "죽음과 사명", "e": "31a: \"꾸벅꾸벅 졸다가 깨어난 사람들처럼 <b>짜증<\/b>을 내면서 아뉘토스의 말을 따라 나를 <b>탁 때려서<\/b> 쉽게 죽이고는 나머지 삶을 <b>쿨쿨 자면서<\/b> 보내게 될지도 모릅니다. <b>신이 여러분을 걱정하여 다른 누군가를 보내 주지 않는 한<\/b>은 말입니다.\"", "w": null}, {"q": "『소크라테스의 변명』 32b에서 소크라테스가 맡아 본 적이 있다고 말한 공적 직책은?", "box": null, "o": ["장군", "평의회 의원", "아르콘(집정관)", "11인 관리"], "a": [2], "s": 1, "part": "공적 활동", "e": "32b: \"국가의 <b>다른 관직은 한 번도 맡아 본 적이 없지만 평의회 의원이 된 적은<\/b> 있습니다.\" 평의회 의원은 추첨으로 뽑히는 자리였다. 그때 안티오키스 부족이 운영을 맡아 열 장군 병합 심리에 혼자 반대했다.", "w": "① 장군들은 재판을 받은 쪽. ④ 11인 관리는 감옥·형 집행 담당(37c)."}, {"q": "『소크라테스의 변명』 33c에서 소크라테스가 신이 자신에게 검토를 하라고 명령한 방식으로 든 것이 <u>아닌<\/u> 것은?", "box": null, "o": ["예언", "꿈", "신적인 섭리가 인간에게 어떤 일을 하라고 명할 때 쓰는 온갖 방식", "델피 신전 입구에 새겨진 \"너 자신을 알라\"는 글귀"], "a": [4], "s": 2, "part": "공적 활동", "e": "33c: \"<b>예언<\/b>을 통해서든 <b>꿈<\/b>을 통해서든, 혹은 또 다른 어떤 <b>신적인 섭리<\/b>가 인간에게 어떤 일을 하라고 명할 때 쓰는 온갖 방식으로\". \"너 자신을 알라\"는 『변명』 본문에 나오지 않는다.", "w": null}, {"q": "『소크라테스의 변명』 36b에서 소크라테스가 \"많은 사람들이 돌보는 것들\"로 열거하며 자신은 돌보지 않았다고 한 것이 <u>아닌<\/u> 것은?", "box": null, "o": ["돈벌이와 집안 살림", "군대 지휘와 대중 연설", "자신을 가장 훌륭하고 현명한 사람이 되도록 돌보는 일", "관직, 결사(結社), 파당"], "a": [3], "s": 2, "part": "둘째 연설", "e": "36b: 돌보지 않은 것 = <b>돈벌이, 집안 살림, 군대 지휘, 대중 연설, 관직·결사·파당<\/b>. 대신 각자에게 개인적으로 가서 \"<b>자신에게 속한 것보다 자신을<\/b>(가장 훌륭하고 현명한 사람이 되도록) 돌보라\"고 설득했다(36c).", "w": null}, {"q": "『소크라테스의 변명』 40d~e에서 꿈조차 꾸지 않는 깊은 잠에 빠진 밤에 대해 소크라테스가 한 말로 옳은 것은?", "box": null, "o": ["평범한 개인만이 아니라 대왕도 그런 밤이 자기 삶의 다른 날과 밤들에 비해 손에 꼽을 정도로 좋았다는 걸 발견할 것이다.", "그런 밤은 아무 감각도 없으니 인생에서 가장 무의미한 밤이다.", "그런 잠은 신들이 벌로 내리는 것이다.", "죽음이 그런 잠과 같다면 그것은 가장 두려운 일이다."], "a": [1], "s": 1, "part": "무죄 투표자에게", "e": "40d~e: 꿈 없는 밤과 견주어 보면 평범한 사람뿐 아니라 <b>대왕<\/b>(페르시아 왕)도 그보다 더 훌륭하고 달콤한 날이 <b>손에 꼽을 정도<\/b>라는 걸 발견할 것이다. 그러니 죽음이 이런 것이라면 <b>이득<\/b>이고, 시간 전체도 단 하룻밤보다 많지 않다.", "w": null}]}, {"id": "b5", "title": "대비 5회", "kind": "예상 문제", "range": "28b~42a · 종합", "qs": [{"q": "『소크라테스의 변명』의 세 연설과 그 내용을 바르게 짝지은 것은?", "box": null, "o": ["첫째 연설: 대안 형량 제안 / 둘째 연설: 유무죄에 대한 항변 / 셋째 연설: 사형 판결 후 마지막 말", "첫째 연설: 유무죄에 대한 항변 / 둘째 연설: 유죄 판결 후 대안 형량 제안 / 셋째 연설: 사형 판결 후 마지막 말", "첫째 연설: 유무죄에 대한 항변 / 둘째 연설: 사형 판결 후 마지막 말 / 셋째 연설: 대안 형량 제안", "첫째 연설: 사형 판결 후 마지막 말 / 둘째 연설: 유무죄에 대한 항변 / 셋째 연설: 대안 형량 제안"], "a": [2], "s": 1, "part": "종합", "e": "<b>첫째 연설<\/b>(17a~35d): 유무죄 항변 → 유죄 판결(약 280:220) → <b>둘째 연설<\/b>(35e~38b): 대안 형량 제안 → 사형 판결 → <b>셋째 연설<\/b>(38c~42a): 사형 투표자·무죄 투표자에게 하는 마지막 말.", "w": null}, {"q": "『소크라테스의 변명』 28b~34b의 이른바 '여담'에서 소크라테스가 답한 두 가지 가상의 반론을 바르게 짝지은 것은?", "box": null, "o": ["\"죽을 위험에 처하게 만든 일을 추구한 게 수치스럽지 않은가?\" / \"개인적으로는 조언하고 다니면서 왜 공적으로는 국가에 조언하지 않는가?\"", "\"왜 돈을 받지 않고 가르치는가?\" / \"왜 델피에 신탁을 물었는가?\"", "\"왜 아들들을 법정에 데려오지 않는가?\" / \"왜 추방을 제안하지 않는가?\"", "\"왜 신들을 믿지 않는가?\" / \"왜 젊은이들을 망치는가?\""], "a": [1], "s": 2, "part": "종합", "e": "반론 1(28b): 죽을 위험이 있는 삶이 <b>수치스럽지 않은가<\/b> → 아킬레우스·병사·죽음에 대한 무지·등에 / 반론 2(31c): <b>왜 공적으로 조언하지 않는가<\/b> → 신령의 신호·두 사건(열 장군 재판, 레온).", "w": "③은 맺는 말(34b~35d)과 둘째 연설(37c)의 내용, ④는 공식 고발장 내용이다."}, {"q": "빈칸에 들어갈 말로 알맞은 것은?", "box": "“아무도 죽음을 알지 못하는데, … 그들은 그것이 나쁜 것들 가운데 최대로 나쁜 것임을 마치 잘 알고 있기라도 한 것처럼 그것을 무서워하니까 하는 말입니다. 그런데 어떻게 이것이 알지 못하는 것을 안다고 생각하는, 그 (　　　　) 무지가 아닐 수 있겠습니까?”", "o": ["용서받을 수 있는", "인간적인", "비난받을 만한", "신이 내려 준"], "a": [3], "s": 1, "part": "죽음과 사명", "e": "29b: 죽음을 최대로 나쁜 것이라고 아는 것처럼 무서워하는 것은 \"알지 못하는 것을 안다고 생각하는, 그 <b>비난받을 만한 무지<\/b>\"다.", "w": null}, {"q": "『소크라테스의 변명』 30b~c에서 소크라테스가 배심원들에게 한 말로 옳은 것은?", "box": null, "o": ["방면해 준다면 앞으로 검토 활동을 줄이겠다.", "아뉘토스의 걱정에도 일리가 있으니 젊은이들과는 대화하지 않겠다.", "자신의 말이 젊은이들을 망친다면 그 말은 해롭지 않다.", "아뉘토스의 말을 따르든 안 따르든, 방면하든 안 하든 하라. 여러 번 죽게 되더라도 다른 일들을 하지는 않겠다."], "a": [4], "s": 1, "part": "죽음과 사명", "e": "30c: \"이것들을 염두에 두고 <b>아뉘토스의 말을 따르든 안 따르든<\/b>, 그리고 <b>나를 방면하든 안 하든<\/b> 하세요. 어쨌든 나는 <b>비록 여러 번 죽게 될 거라 해도 다른 일들을 하지는 않을 테니까요<\/b>.\"", "w": "③ 본문은 반대: 이런 말들로 젊은이를 망치고 있다면 그 말들은 해로운 게 될 것이라고 했다."}, {"q": "『소크라테스의 변명』 32a에서 소크라테스가 증거를 제시하며 한 말로 옳지 <u>않은<\/u> 것은?", "box": null, "o": ["말들이 아니라 여러분이 존중해 마지않는 실제 행동들을 증거로 제시하겠다.", "자신이 장군으로서 해전에서 거둔 승리를 증거로 들겠다.", "죽음이 무서워 정의에 반하여 누구에게도 굴복하지 않으리라는 것을 알게 하겠다.", "재판정에서 흔히 듣는 조야한 말들이긴 하지만 진실된 말들이다."], "a": [2], "s": 2, "part": "공적 활동", "e": "32a: 증거는 <b>말이 아니라 행동<\/b> — 평의회 의원으로서 열 장군 병합 심리에 반대한 일과 30인의 레온 체포 명령을 거부한 일이다. 소크라테스는 장군을 지낸 적이 없다(32b \"다른 관직은 한 번도\").", "w": null}, {"q": "『소크라테스의 변명』 32c에서 30인 통치자들이 소크라테스를 비롯한 많은 사람들에게 레온 체포 같은 명령을 내린 이유로 소크라테스가 말한 것은?", "box": null, "o": ["소크라테스를 시험해 보려고", "체포할 병력이 부족해서", "가능한 한 많은 사람들을 자기들의 죄악에 물들이고 싶어서", "민주파 사람들을 회유하려고"], "a": [3], "s": 2, "part": "공적 활동", "e": "32c: \"저들은 다른 많은 사람들에게도 그런 일들을 숱하게 명령하곤 했지요. <b>가능한 한 많은 사람들을 자기들의 죄악에 물들이고 싶어서<\/b> 그랬던 거죠.\" 공범을 늘려 책임을 나누려는 것.", "w": null}, {"q": "『소크라테스의 변명』 33c~34b에서 소크라테스가 '망쳐졌다는 젊은이들의 가족'을 근거로 드는 논리로 가장 적절한 것은?", "box": null, "o": ["정말 망쳤다면 그들 자신이나 가족이 고발하고 앙갚음했어야 하는데, 오히려 망쳐지지 않은 나이 든 친척들까지 자신을 도우려 하는 것은 멜레토스가 거짓을 말한다는 걸 알기 때문이다.", "그 가족들은 모두 소크라테스에게 돈을 받았으므로 증인이 될 수 없다.", "그 가족들 역시 철학자이므로 소크라테스를 이해한다.", "그 가족들은 모두 멜레토스를 개인적으로 미워한다."], "a": [1], "s": 2, "part": "공적 활동", "e": "33d~34b: 망쳤다면 <b>본인이나 아버지·형제·친척이 고발<\/b>했어야 한다. 그런데 멜레토스는 그중 누구도 증인으로 세우지 못했고(\"내가 자리를 내어 주겠습니다\"), 오히려 <b>망침을 당하지 않은 나이 든 친척들<\/b>까지 소크라테스를 도우려 한다 — 그 이유는 \"멜레토스는 거짓을, 나는 진실을 말한다는 걸 알기 때문\" 말고는 없다.", "w": null}, {"q": "『소크라테스의 변명』 35a~b에서 소크라테스가 비판한, 재판에서 '놀라운 행동들'을 벌이는 사람들에 대한 설명으로 옳지 <u>않은<\/u> 것은?", "box": null, "o": ["한인물 한다고 여겨지는 사람들이다.", "죽으면 뭔가 무서운 일을 겪게 되리라고 생각한다.", "마치 여러분 손에 죽지 않으면 불사자가 되기라도 할 것처럼 군다.", "그들 때문에 외지인들 사이에서 아테네의 덕 있는 사람들을 낮춰 보는 생각이 나올 정도로 국가에 수치를 안긴다."], "a": [5], "s": 2, "part": "맺는 말", "e": "①~④ 모두 35a~b 본문 내용 → ⑤ 답 없음. 소크라테스는 오히려 배심원들이 \"이런 <b>불쌍한 행위들을 연출하면서 국가를 웃음거리로 만드는 사람<\/b>\"에게 유죄 표를 던져야 한다고 말한다.", "w": null}, {"q": "『소크라테스의 변명』 37a~b에서 소크라테스가 자신이 아무에게도 고의로 불의를 행하지 않았다는 것을 배심원들에게 설득하지 못한 까닭으로 든 것은?", "box": null, "o": ["자신의 말재주가 부족해서", "서로 짧은 시간 동안만 대화했고, 다른 곳들처럼 사형이 걸린 사건을 여러 날 심리하는 법이 없어서", "유리한 증인이 한 명도 없어서", "배심원들이 고발자들에게 뇌물을 받아서"], "a": [2], "s": 2, "part": "둘째 연설", "e": "37a~b: \"우리는 서로 <b>짧은 시간 동안<\/b> 대화를 나누었을 뿐이니까요.\" 다른 곳처럼 사형이 걸린 사건은 <b>단 하루가 아니라 여러 날<\/b> 심리해야 한다는 법이 있었다면 확신하게 되었을 것. \"짧은 시간 안에 커다란 비방들을 해소하는 건 쉽지 않다\"(18a~19a의 걱정과 연결).", "w": null}, {"q": "『소크라테스의 변명』 41a에서 소크라테스가 하데스에서 재판하고 있다고 흔히 이야기되는 '진짜 재판관들'로 든 인물이 <u>아닌<\/u> 것은?", "box": null, "o": ["미노스", "라다만튀스", "아이아코스", "팔라메데스"], "a": [4], "s": 2, "part": "무죄 투표자에게", "e": "41a: 진짜 재판관 = <b>미노스, 라다만튀스, 아이아코스, 트립톨레모스<\/b> + 살아서 정의로웠던 반신반인들. <b>팔라메데스<\/b>는 텔라몬의 아들 아이아스와 함께 \"부정의한 심판 때문에 죽은\" 사람으로 41b에 나온다.", "w": null}]}, {"id": "b6", "title": "대비 6회", "kind": "예상 문제", "range": "28b~42a · 종합", "qs": [{"q": "『소크라테스의 변명』 29b에서 소크라테스가 \"충분히 알지 못하니까 알지 못한다고 생각한다\"고 말한 대상은?", "box": null, "o": ["하데스(저승)의 일들", "불의를 행하는 것이 나쁘다는 것", "더 훌륭한 이에게 불복하는 것이 추하다는 것", "신이 자신에게 명령한 일"], "a": [1], "s": 1, "part": "죽음과 사명", "e": "29b: \"<b>하데스의 일들<\/b>에 관해서는 충분히 알지 못하니까 생각도 또한 그렇게, 알지 못한다고 생각한다.\" 반면 ②③은 \"내가 안다\"고 분명히 말한다.", "w": null}, {"q": "『소크라테스의 변명』 30a에서 소크라테스가 \"도대체 이 나라에 생겨난 적이 전혀 없다\"고 말한, 그보다 더 큰 좋음이 없는 것은?", "box": null, "o": ["페리클레스의 연설", "아테네의 민주정", "페르시아 전쟁의 승리", "신에 대한 나의 봉사"], "a": [4], "s": 1, "part": "죽음과 사명", "e": "30a: \"여러분에게 <b>신에 대한 나의 봉사<\/b>보다 더 큰 좋음이 도대체 이 나라에 생겨난 적이 전혀 없다.\" 그 봉사 = 젊은이든 나이 든 이든 영혼을 돌보는 것보다 육체나 돈을 먼저 돌보지 말라고 설득하는 일.", "w": null}, {"q": "『소크라테스의 변명』 31c~d에서 \"멜레토스가 고발장에 써서 희화화한 것\"이라고 소크라테스가 말한 것은?", "box": null, "o": ["해는 돌이고 달은 흙이라는 주장", "어린 시절부터 생겨난, 하려는 일을 말리는 신적인 혹은 신령스러운 목소리", "공중을 걷는다는 주장", "돈을 받고 젊은이들을 가르친다는 것"], "a": [2], "s": 1, "part": "공적 활동", "e": "31d: 소크라테스에게 생겨나는 <b>신적인 혹은 신령스러운 것<\/b> — \"멜레토스가 고발장에 써서 희화화한 것도 바로 이것\". 고발장의 \"<b>다른 새로운 신령스러운 것들<\/b>을 믿는다\"(24c)가 이것을 가리킨다.", "w": null}, {"q": "『소크라테스의 변명』 32b의 열 장군 재판 사건에 대한 설명으로 옳지 <u>않은<\/u> 것은?", "box": null, "o": ["소크라테스가 속한 안티오키스 부족이 평의회 운영을 맡고 있었다.", "장군들을 병합하여 심리하자는 의결은, 나중에 모두가 인정했듯 불법이었다.", "연설가들은 소크라테스를 고발하고 체포할 태세였다.", "소크라테스의 반대 덕분에 장군들은 결국 무죄로 방면되었다."], "a": [4], "s": 2, "part": "공적 활동", "e": "32b~c: 소크라테스는 <b>혼자<\/b> 반대하고 반대표를 던졌을 뿐, 그 결과 장군들이 방면되었다는 내용은 없다(실제 역사에서는 처형되었다). 요점은 \"옥살이나 죽음이 두려워서 정의롭지 않은 결정을 내리는 여러분 편에 서기보다, <b>법과 정의의 편<\/b>에서 위험을 무릅써야 한다\"는 것.", "w": null}, {"q": "『소크라테스의 변명』 32e~33b의 내용으로 옳지 <u>않은<\/u> 것은?", "box": null, "o": ["공적인 활동을 하며 정의의 편에 섰다면 이 많은 세월 동안 살아남지 못했을 것이다.", "공적 영역에서든 사적 영역에서든 일생 동안 줄곧 같은 유의 사람이었다.", "비방하는 사람들이 그의 제자라고 부르는 사람들을 포함해, 누구에게도 정의에 반해 동조해 본 적이 없다.", "자신의 말을 듣고 싶어 하는 사람에게는 젊은이든 나이 든 이든 인색하게 굴지 않았다."], "a": [5], "s": 2, "part": "공적 활동", "e": "①~④ 모두 본문 내용 → ⑤ 답 없음. ① 32e ② 33a ③ 33a ④ 33a~b.", "w": null}, {"q": "『소크라테스의 변명』 34b~c에서 소크라테스가, 일부 배심원이 자신에게 화가 나서 홧김에 투표할 수도 있다고 걱정한 이유는?", "box": null, "o": ["자기는 더 작은 송사에서도 아이들·집안사람·친구들을 올라오게 해 눈물로 간청했는데, 소크라테스는 극단적 위험 속에서도 그런 일을 하나도 하지 않으려 하니까", "소크라테스가 배심원들을 공개적으로 모욕했으니까", "소크라테스가 제안한 벌금이 너무 적으니까", "소크라테스가 신들을 부정했으니까"], "a": [1], "s": 1, "part": "맺는 말", "e": "34b~c: 자기 경우를 떠올리며 — 작은 송사에도 <b>애들과 집안사람과 친구들을 올라오게 해서 눈물을 펑펑 쏟으며<\/b> 간청했는데, 소크라테스는 <b>극단적인 위험<\/b>을 무릅쓰면서도 그런 일을 하나도 하지 않으려 하니 언짢아할 수 있다.", "w": null}, {"q": "『소크라테스의 변명』 35c~d의 내용으로 옳은 것은?", "box": null, "o": ["재판관은 자기가 원하는 사람들에게 호의를 베풀겠다고 서약한 사람이다.", "소크라테스는 자신에 관한 판가름을 여러분과 신에게 맡기겠다고 말했다.", "간청을 해서 죄를 벗는 것도 상황에 따라서는 정의롭다.", "소크라테스는 결국 자신이 신들을 믿지 않는다는 것을 인정했다."], "a": [2], "s": 1, "part": "맺는 말", "e": "35d: \"나에 관해서 판가름하는 일은, 나 자신에게도 여러분에게도 최선이 될 방향으로 판가름하는 일은 <b>여러분과 신에게 맡기겠습니다<\/b>.\" 또 \"나는 <b>믿고 있다<\/b>, 나를 고발한 사람들 중 아무도 그러지 못하는 방식으로.\"", "w": "① 호의가 아니라 법에 따라 판결하겠다고 서약했다. ③ 간청도, 간청으로 죄를 벗는 것도 정의롭지 않다."}, {"q": "다음은 소크라테스가 올림피아 경기 승자와 자신을 비교한 말이다. ㉠, ㉡에 들어갈 말을 알맞게 짝지은 것은?", "box": "“그 사람은 여러분을 행복해 (　㉠　) 만들어 주지만 나는 행복하게 만들어 주며, 그 사람은 부양이 (　㉡　) 나는 필요하기 때문에 그렇습니다.”", "o": ["㉠ 하게 ㉡ 필요하지만", "㉠ 보이게 ㉡ 필요하지만", "㉠ 보이게 ㉡ 전혀 필요 없지만", "㉠ 느끼게 ㉡ 전혀 필요 없지만"], "a": [3], "s": 2, "part": "둘째 연설", "e": "36d~e: 올림피아에서 말 두 마리·네 마리가 끄는 경주의 승자는 여러분을 행복해 <b>보이게<\/b> 만들지만 나는 실제로 행복하게 만들며, 그 사람은 부양이 <b>전혀 필요 없지만<\/b> 나는 필요하다. → 그러니 <b>시 중앙 청사의 식사 대접<\/b>이 어울린다.", "w": null}, {"q": "『소크라테스의 변명』 38c에 대한 설명으로 옳지 <u>않은<\/u> 것은?", "box": null, "o": ["국가를 헐뜯고 싶어 하는 사람들에게서 \"지혜로운 사람 소크라테스를 죽였다\"는 오명과 비난을 받게 될 것이다.", "그들은 소크라테스가 실제로는 그렇지 않더라도 지혜롭다고 말할 것이다.", "잠깐 동안만 기다렸다면 소크라테스의 나이 때문에 죽음이 저절로 찾아왔을 것이다.", "이 말은 유무죄와 상관없이 배심원 모두에게 하는 말이다."], "a": [4], "s": 2, "part": "사형 투표자에게", "e": "38c~d: \"이 말은 <b>여러분 모두에게가 아니라 나를 사형에 처하자는 쪽에 투표한 분들에게<\/b> 하는 말입니다.\" 셋째 연설은 청중을 사형 투표자 → 무죄 투표자로 나누어 말한다.", "w": null}, {"q": "『소크라테스의 변명』 41d~e에서 소크라테스가 자신을 고발하고 유죄 표를 던진 사람들에 대해 한 말로 옳은 것은?", "box": null, "o": ["그들에게 악감정은 전혀 없지만, 그들이 해를 줄 생각으로 그랬다는 점은 비난받아 마땅하다.", "그들을 결코 용서할 수 없으며 저승에서 고발하겠다.", "그들은 좋은 의도로 그랬으니 전혀 비난할 수 없다.", "그들에게는 반드시 신들의 벌이 내릴 것이다."], "a": [1], "s": 2, "part": "무죄 투표자에게", "e": "41d~e: \"유죄 표를 던진 사람들과 나를 고발한 사람들에게 <b>악감정이라곤 전혀 없습니다<\/b>. 물론 그들이 이런 의도로 그런 게 아니라 <b>내게 해를 줄 생각으로<\/b> 그랬던 거지만 말입니다. <b>바로 이것이 그들이 비난받아 마땅한 점<\/b>입니다.\"", "w": null}]}, {"id": "b7", "title": "대비 7회", "kind": "예상 문제", "range": "28b~42a · 종합", "qs": [{"q": "『소크라테스의 변명』 36a~b에서 아뉘토스와 뤼콘이 함께 고발하지 않았다면 멜레토스가 총투표수의 5분의 1을 얻지 못해 물어야 했을 벌금은?", "box": null, "o": ["30므나", "1므나", "천 드라크마", "5므나"], "a": [3], "s": 1, "part": "둘째 연설", "e": "36a~b: 고발자가 총투표수의 <b>5분의 1<\/b>을 얻지 못하면 <b>천 드라크마<\/b>(=10므나)의 벌금을 물었다(근거 없는 고발을 막는 제도). 소크라테스는 표를 셋으로 나누면 멜레토스 몫은 5분의 1이 안 된다고 비꼰다.", "w": null}, {"q": "『소크라테스의 변명』 36c에서 소크라테스가 각자에게 개인적으로 찾아가 설득하려 했던 돌봄의 순서로 옳은 것은?", "box": null, "o": ["자신을 돌보는 일보다 자신에게 속한 것들(재산 등)을 먼저 돌보라.", "자신에게 속한 것들보다 자신을 먼저 돌보고, 국가에 속한 것들보다 국가 자체를 먼저 돌보라.", "국가 자체보다 국가에 속한 것들을 먼저 돌보라.", "자기 영혼보다 가족의 살림을 먼저 돌보라."], "a": [2], "s": 2, "part": "둘째 연설", "e": "36c: \"자신을 돌보는 일(가장 훌륭하고 현명한 사람이 되도록)보다 <b>자신에게 속한 어떤 것<\/b>을 돌보는 일을 앞세우지 않고, <b>국가 자체<\/b>를 돌보는 일보다 <b>국가에 속한 것들<\/b>을 돌보는 일을 앞세우지 않도록\". 29d~30b의 \"돈·명예보다 영혼\"과 같은 생각.", "w": null}, {"q": "『소크라테스의 변명』 37b에서 소크라테스가 스스로 나쁜 형벌을 형량으로 제안하지 않는 이유로 가장 적절한 것은?", "box": null, "o": ["친구들이 그 형벌을 반대했기 때문이다.", "신령의 신호가 그 형벌을 말렸기 때문이다.", "벌금으로 낼 돈이 아까웠기 때문이다.", "멜레토스가 제안한 사형은 좋은지 나쁜지도 모르는 것인데, 그 대신 나쁘다는 걸 잘 아는 것을 골라 제안할 이유가 없기 때문이다."], "a": [4], "s": 2, "part": "둘째 연설", "e": "37b: \"멜레토스가 제안하고 있는 이것, 즉 <b>좋은 것인지 나쁜 것인지도 내가 알지 못한다<\/b>고 주장하는 그것을 겪을까 봐 그러겠어요? 그럼 이것 대신에 <b>나쁘다는 걸 내가 잘 아는 것들<\/b> 가운데 하나를 택해서 형량으로 제안할까요?\" — 29a~b의 죽음에 대한 무지가 형량 논리로 이어진다.", "w": null}, {"q": "『소크라테스의 변명』 37b~c의 옥살이와 벌금에 관한 설명으로 옳지 <u>않은<\/u> 것은?", "box": null, "o": ["옥살이는 그때그때 임명되는 권력인 11인 관리에게 종노릇하며 감옥에서 사는 것이다.", "벌금을 제안하되 다 물 때까지 갇혀 있는 것은, 소크라테스에게는 옥살이와 똑같다.", "소크라테스에게는 벌금을 물 돈이 없다.", "이것들은 모두 나쁘다는 걸 소크라테스가 잘 아는 것들 가운데서 고르는 셈이다."], "a": [5], "s": 2, "part": "둘째 연설", "e": "①~④ 모두 본문 내용 → ⑤ 답 없음. 그다음 추방도 \"동료 시민도 견디지 못한 말을 남들이 견딜 리 없다\"는 이유로 거부한다(37c~e).", "w": null}, {"q": "『소크라테스의 변명』 37e~38a에서 소크라테스가 \"신에게 불복하는 일이라 조용히 지낼 수 없다\"고 말해도 사람들이 믿지 않을 것이라고 한 까닭은?", "box": null, "o": ["그 말을 하면 사람들이 자신이 의뭉을 떤다(반어를 부린다)고 생각할 것이기 때문이다.", "그 말을 증명해 줄 증인이 없기 때문이다.", "자신이 전에 신을 믿지 않는다고 말한 적이 있기 때문이다.", "사람들이 델피의 신탁을 믿지 않기 때문이다."], "a": [1], "s": 2, "part": "둘째 연설", "e": "37e~38a: \"이건 신에게 불복하는 일이고 그렇기 때문에 조용히 지낸다는 게 불가능하다고 내가 말하면, 여러분은 내가 <b>의뭉을 떤다<\/b>고 생각해서 내 말을 믿지 않을 테니까요.\" 의뭉 = 에이로네이아(소크라테스의 아이러니).", "w": null}, {"q": "『소크라테스의 변명』 38a에서 소크라테스가 \"인간이 누릴 수 있는 최상의 좋음\"이라고 한 것은?", "box": null, "o": ["국가로부터 명예와 대접을 받는 것", "많은 재산을 모아 여유롭게 사는 것", "날마다 덕과 다른 것들에 관해 이야기를 만들어 가며 자신과 남을 검토하는 것", "죽은 뒤 하데스에서 영웅들을 만나는 것"], "a": [3], "s": 1, "part": "둘째 연설", "e": "38a: \"날마다 <b>덕에 관해서<\/b> 그리고 다른 것들(그것들에 관해 대화하며 <b>나 자신과 다른 사람들을 검토<\/b>하는 것)에 관해 이야기를 만들어 가는 것, 이것이 그야말로 인간이 누릴 수 있는 <b>최상의 좋음<\/b>이며, 검토 없이 사는 삶은 인간에게 살 가치가 없다.\"", "w": null}, {"q": "『소크라테스의 변명』 38d~e에서 소크라테스가 자신이 유죄 판결을 받은 이유로 말한 것은?", "box": null, "o": ["설득할 말들이 궁해서", "대담함과 몰염치가 궁해서, 즉 여러분이 가장 달콤해할 말들(통곡·비탄)을 할 의향이 궁해서", "유리한 증인이 궁해서", "벌금을 낼 돈이 궁해서"], "a": [2], "s": 1, "part": "사형 투표자에게", "e": "38d: \"궁해서긴 하지만 <b>말들이 궁해서가 아니라 대담함과 몰염치가 궁해서<\/b>\". 통곡하고 비탄하며 나답지 않은 말을 할 의향이 없었을 뿐. \"이런 식으로 항변한 것에 대해 <b>후회하지 않습니다<\/b>. 저런 식으로 사느니 이런 식으로 항변하고 죽는 쪽을 택하겠습니다.\"", "w": null}, {"q": "『소크라테스의 변명』 39a에서 \"송사에서든 전쟁에서든 무슨 짓이든 해 가며 죽음을 면하려 해서는 안 된다\"는 말의 예로 든 것은?", "box": null, "o": ["적에게 거짓 항복을 하는 것", "동료들을 남겨 두고 먼저 배에 오르는 것", "전투 중에 무기를 버리고 추격자들에게 탄원하는 것", "신전으로 도망쳐 보호를 요청하는 것"], "a": [3], "s": 1, "part": "사형 투표자에게", "e": "39a: \"<b>전투 중에도 무기를 버리는 데다가 추격자들에게 탄원까지<\/b> 하다 보면 죽음만큼은 피할 수 있겠다는 게 분명해지는 경우가 자주 있다.\" 그러나 어려운 건 죽음이 아니라 <b>사악<\/b>을 피하는 것.", "w": null}, {"q": "『소크라테스의 변명』 39e~40a에서 소크라테스가 방면 쪽에 투표한 사람들에게 한 말로 옳지 <u>않은<\/u> 것은?", "box": null, "o": ["관리들이 분주히 움직이는 동안 자리를 지켜, 허용되는 시간 동안 이야기를 나누자.", "여러분을 친구로 여기고, 방금 일어난 일이 무엇을 의미하는지 보여 주고 싶다.", "여러분을 \"재판관\"이라고 부르는 것이 옳게 부르는 일일 것 같다.", "오늘도 신호가 연설 도중 여러 번 반대했지만 끝까지 말했다."], "a": [4], "s": 2, "part": "무죄 투표자에게", "e": "40a~b: 이번에는 이른 아침 집을 나설 때도, 재판정에 올라올 때도, 연설 중에 뭔가 말하려 할 때도 신호가 <b>어느 지점에서도 반대하지 않았다<\/b>. \"다른 논의를 할 때는 정말로 여러 대목에서 말하는 중간에 날 제지했었지만.\"", "w": null}, {"q": "『소크라테스의 변명』 41a~b에서 소크라테스가 저승에서 만나 \"나 자신이 겪은 일들과 저분들이 겪은 일들을 견주어 보고 싶다\"고 한, 부정의한 심판 때문에 죽은 사람들은?", "box": null, "o": ["팔라메데스와 텔라몬의 아들 아이아스", "오르페우스와 무사이오스", "미노스와 라다만튀스", "헤시오도스와 호메로스"], "a": [1], "s": 2, "part": "무죄 투표자에게", "e": "41b: \"<b>팔라메데스와 텔라몬의 아들 아이아스<\/b>, 그리고 옛날 사람들 가운데 <b>부정의한 심판 때문에 죽은<\/b> 다른 누군가\" — 억울한 판결로 죽은 자신의 처지와 견주어 보겠다는 것.", "w": "② ④ 함께 지내고 싶은 시인들(41a) ③ 하데스의 진짜 재판관들(41a)."}]}, {"id": "b8", "title": "대비 8회", "kind": "예상 문제", "range": "28b~42a · 종합·심화", "qs": [{"q": "『소크라테스의 변명』 28b~34b의 흐름을 순서대로 바르게 나열한 것은?<br>ㄱ. 아킬레우스의 선택 ㄴ. 신이 배치한 자리를 지키는 병사 ㄷ. 국가에 붙은 등에 ㄹ. 공적 활동을 말린 신령의 신호 ㅁ. 살라미스의 레온 체포 거부", "box": null, "o": ["ㄴ → ㄱ → ㄷ → ㅁ → ㄹ", "ㄱ → ㄷ → ㄴ → ㄹ → ㅁ", "ㄱ → ㄴ → ㄷ → ㄹ → ㅁ", "ㄱ → ㄴ → ㄹ → ㄷ → ㅁ"], "a": [3], "s": 2, "part": "종합", "e": "<b>ㄱ<\/b> 아킬레우스(28b~d) → <b>ㄴ<\/b> 병사의 자리(28d~29a) → (죽음에 대한 무지, 조건부 방면 거부) → <b>ㄷ<\/b> 등에(30e) → <b>ㄹ<\/b> 신령의 신호(31c~d) → (열 장군 재판) → <b>ㅁ<\/b> 레온(32c~d).", "w": null}, {"q": "『소크라테스의 변명』 셋째 연설(38c~42a)의 흐름을 순서대로 바르게 나열한 것은?<br>ㄱ. \"지혜로운 사람을 죽였다\"는 오명 ㄴ. 죽음은 느리고 악은 빠르다 ㄷ. 논박하는 사람이 더 많아질 것이라는 예언 ㄹ. 신호의 침묵 ㅁ. 죽음은 둘 중 하나 ㅂ. 아들들에 대한 부탁", "box": null, "o": ["ㄱ → ㄴ → ㄹ → ㄷ → ㅁ → ㅂ", "ㄴ → ㄱ → ㄷ → ㄹ → ㅁ → ㅂ", "ㄱ → ㄷ → ㄴ → ㄹ → ㅂ → ㅁ", "ㄱ → ㄴ → ㄷ → ㅁ → ㄹ → ㅂ"], "a": [5], "s": 3, "part": "종합", "e": "실제 순서는 <b>ㄱ<\/b>(38c) → <b>ㄴ<\/b>(39a~b) → <b>ㄷ<\/b>(39c~d) [여기까지 사형 투표자에게] → <b>ㄹ<\/b>(40a~c) → <b>ㅁ<\/b>(40c~41c) → <b>ㅂ<\/b>(41e) [무죄 투표자에게]. 보기 중 이와 같은 것이 없으므로 정답은 ⑤.", "w": "④는 ㄹ과 ㅁ의 순서가 바뀌었다. 신호의 침묵(이 일은 좋은 것이다) → 그 근거를 죽음의 두 가능성으로 다시 숙고."}, {"q": "28b~42a 전체에서 드러나는 소크라테스의 일관된 입장과 가장 거리가 <u>먼<\/u> 것은?", "box": null, "o": ["죽음이 좋은지 나쁜지 알지 못하므로 죽음을 두려워하지 않는다.", "부정의한 일을 저지르는 것은 죽음보다 더 나쁘다.", "영혼을 돌보는 일을 돈이나 명예를 돌보는 일보다 앞세워야 한다.", "목숨을 보전하기 위해서라면 잠시 신의 명령을 미루는 것도 괜찮다."], "a": [4], "s": 1, "part": "종합", "e": "29d \"여러분보다는 신에게 복종\", 30c \"여러 번 죽게 될 거라 해도 다른 일들을 하지 않겠다\", 37e \"신에게 불복하는 일이라 조용히 지낼 수 없다\" — 목숨을 위해 신의 명령을 미루는 일은 없다.", "w": null}, {"q": "『소크라테스의 변명』 29a~b에서 죽음을 두려워하는 것을 비판하는 논리는, 앞부분(17a~28b)의 어떤 내용과 가장 직접적으로 연결되는가?", "box": null, "o": ["정치인과의 대화에서 드러난, 모르면서 안다고 생각하는 것에 대한 비판(무지의 자각)", "말(馬) 조련사 비유", "신령 = 신들의 자식이라는 논증", "외국인 방언 비유"], "a": [1], "s": 2, "part": "종합", "e": "21d \"이 사람은 모르면서 안다고 생각하고, 나는 모르니까 모른다고 생각한다\" → 29a~b \"죽음을 무서워하는 것은 <b>알지 못하는 것을 안다고 생각하는 것<\/b>\" / \"하데스의 일들은 알지 못하니까 알지 못한다고 생각한다\". <b>무지의 자각<\/b>이 죽음 문제에 적용된다.", "w": null}, {"q": "『소크라테스의 변명』 31c~d와 40a~c의 신령스러운 신호에 관한 설명을 종합한 것으로 옳은 것은?", "box": null, "o": ["신호는 늘 무언가를 하라고 부추겼기 때문에 소크라테스는 재판정에 나왔다.", "신호는 소크라테스가 정치 활동을 하는 것은 말렸지만, 이번 재판 과정에서는 어느 지점에서도 반대하지 않았다. 소크라테스는 이것을 일어난 일이 좋은 것이라는 증거로 본다.", "신호는 이번 재판에서 연설 도중 여러 번 소크라테스를 제지했다.", "신호는 사형 판결이 내려진 뒤에야 처음으로 나타났다."], "a": [2], "s": 2, "part": "종합", "e": "31d: 신호는 <b>말리기만 하고 부추기지는 않는다<\/b> → 정치 활동을 말렸다. 40a~c: 이번에는 <b>어디서도 반대하지 않았다<\/b> → \"내가 하려던 일이 좋은 것이 아니었다면 으레 나타나는 신호가 반대하지 않았을 리 없다\" → <b>죽음은 나쁜 것이 아닐 것<\/b>.", "w": null}, {"q": "『소크라테스의 변명』 둘째 연설의 대안 형량에 관한 흐름을 바르게 정리한 것은?", "box": null, "o": ["사형 수용 → 추방 제안 → 1므나 벌금", "30므나 벌금 → 1므나 벌금 → 시 중앙 청사 식사 대접", "추방 제안 → 시 중앙 청사 식사 대접 → 30므나 벌금", "(받아 마땅한 것) 시 중앙 청사 식사 대접 → 옥살이·벌금 구금·추방 거부 → 1므나 → 친구들의 보증으로 30므나"], "a": [4], "s": 2, "part": "둘째 연설", "e": "36d~37a 정의에 합당한 형량 = <b>시 중앙 청사 식사 대접<\/b> → 37b~e 나쁜 걸 아는 것(<b>옥살이, 벌금 구금, 추방<\/b>)은 제안할 수 없음 → 38b 물 수 있는 <b>1므나<\/b> → 플라톤·크리톤·크리토불로스·아폴로도로스의 보증으로 <b>30므나<\/b>.", "w": null}, {"q": "『소크라테스의 변명』 셋째 연설에서 소크라테스가 청중을 나누어 말한 방식으로 옳은 것은?", "box": null, "o": ["먼저 무죄 투표자들과 대화한 뒤, 사형 투표자들에게 예언했다.", "먼저 사형 투표자들에게 말하며 예언을 하고, 이어서 무죄 투표자들과 대화하며 그들만을 \"재판관 여러분\"이라 불렀다.", "모든 배심원을 처음부터 끝까지 \"재판관 여러분\"이라고 불렀다.", "배심원이 아니라 고발자들에게만 말했다."], "a": [2], "s": 1, "part": "종합", "e": "38c~39d 사형 투표자에게(오명, 죽음과 악, 예언) → 39e~42a 무죄 투표자에게(신호의 침묵, 죽음은 둘 중 하나, 아들 부탁). \"여러분을 '<b>재판관<\/b>'이라고 부르는 게 옳게 부르는 일일 것 같아서\"(40a) — 정의롭게 판결한 사람만 진짜 재판관.", "w": null}, {"q": "『소크라테스의 변명』에서 소크라테스가 자신의 활동을 신과 관련지어 표현한 것이 <u>아닌<\/u> 것은?", "box": null, "o": ["신을 대신해 불경한 사람들을 처벌하는 재판관", "신이 배치한 자리를 지키는 병사", "신이 국가에 붙여 놓은 등에", "신이 이 나라에 준 선물"], "a": [1], "s": 2, "part": "종합", "e": "② 28e~29a ③ 30e ④ 30d·31a. 소크라테스는 사람들을 <b>처벌<\/b>하는 것이 아니라 <b>일깨우고 설득하고 꾸짖는<\/b> 사람이다. 오히려 의도치 않은 잘못은 처벌이 아니라 가르쳐야 한다(26a).", "w": null}, {"q": "『소크라테스의 변명』에서 저자 플라톤이 재판 현장에 있었음을 알 수 있는 대목으로 옳은 것은?", "box": null, "o": ["34a의 증인 명단(\"아데이만토스 … 여기 이 플라톤이 그의 형제\")과 38b의 30므나 보증인 명단", "17a의 서두", "21a의 카이레폰 이야기", "40a의 신호 이야기"], "a": [1], "s": 2, "part": "종합", "e": "<b>34a<\/b>: \"여기 아리스톤의 아들 아데이만토스가 있네요. <b>여기 이 플라톤<\/b>이 그의 형제고요.\" <b>38b<\/b>: \"여기 이 <b>플라톤<\/b>과 크리톤과 크리토불로스와 아폴로도로스가 … 30므나를 제안하라고 권하는군요.\" 『변명』에서 플라톤의 이름은 이 두 번만 나온다.", "w": null}, {"q": "『소크라테스의 변명』 41e~42a에서 아들들에 대해 한 부탁이 의미하는 바로 가장 적절한 것은?", "box": null, "o": ["아들들이 아버지의 원수를 갚도록 도와 달라는 뜻이다.", "아들들이 정치에 나서지 않도록 막아 달라는 뜻이다.", "자신이 아테네인들을 검토하고 꾸짖은 일이 정의로운 일이었음을 다시 확인하는 뜻이다.", "아들들의 재산을 지켜 달라는 뜻이다."], "a": [3], "s": 2, "part": "무죄 투표자에게", "e": "41e~42a: 아들들이 덕보다 돈을 앞세우거나 아무것도 아니면서 한인물 한다고 생각하면 \"<b>내가 여러분을 괴롭혔던 것과 똑같이<\/b> 괴롭혀 주세요\" — 그러면 \"나도 내 아들들도 여러분에게서 <b>정의로운 일들<\/b>을 겪는 셈\". 검토와 꾸짖음은 해가 아니라 <b>좋은 일<\/b>이었다는 것을 마지막까지 확인한다.", "w": null}]}];</script>
<script>
const SETS = window.__DATA__;
const C = '①②③④⑤';
const PARTS = ["죽음과 사명", "공적 활동", "맺는 말", "둘째 연설", "사형 투표자에게", "무죄 투표자에게", "종합"];
const ALL = [];
SETS.forEach(s => s.qs.forEach((q, i) => { q.id = s.id + '-' + (i + 1); q.src = s.title + ' ' + (i + 1) + '번'; q.o = q.o.concat(['답 없음']); ALL.push(q); }));
const BYID = Object.fromEntries(ALL.map(q => [q.id, q]));

const store = {
  get(k, d) { try { const v = localStorage.getItem('ap2-' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('ap2-' + k, JSON.stringify(v)); } catch (e) {} }
};
let mode = store.get('mode', 'practice');      // practice | exam
let wrong = new Set(store.get('wrong', []));
let best = store.get('best', {});
let partSel = new Set(store.get('parts', PARTS));
let S = null;   // 현재 풀이 상태

const $ = s => document.querySelector(s);
const app = $('#app');
const esc = t => String(t).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const stars = n => '★'.repeat(n) + '<i>' + '★'.repeat(3 - n) + '</i>';
const isRight = (q, pick) => pick != null && q.a.includes(pick);
const saveWrong = () => store.set('wrong', [...wrong]);
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function home() {
  S = null;
  location.hash = '';
  const cards = SETS.map(s => {
    const b = best[s.id];
    return `<button class="set" data-set="${s.id}">
      <span class="k">${s.kind}</span><span class="n">${s.title}</span>
      <span class="m"><span>${s.range} · ${s.qs.length}문항</span>${b != null ? `<span class="best">최고 ${b}/${s.qs.length}</span>` : '<span>아직 안 풂</span>'}</span>
    </button>`;
  }).join('');
  const pool = ALL.filter(q => partSel.has(q.part));
  app.innerHTML = `
    <div class="top">
      <div><div class="eyebrow">서양철학: 쟁점과 토론 · 플라톤</div><h1>소크라테스의 변명 점검퀴즈 2</h1></div>
      <div>
        <div class="seg" role="group" aria-label="풀이 방식">
          <button id="m-practice" aria-pressed="${mode === 'practice'}">연습 모드</button>
          <button id="m-exam" aria-pressed="${mode === 'exam'}">시험 모드</button>
        </div>
        <p class="hint">${mode === 'practice' ? '한 문제 고를 때마다 바로 채점하고 해설을 보여줘요.' : '끝까지 푼 뒤 제출하면 한꺼번에 채점해요.'}</p>
      </div>
    </div>
    <div class="sets">${cards}</div>
    <h2>단락별로 골라 풀기</h2>
    <div class="parts">${PARTS.map(p => `<button class="chip" data-part="${p}" aria-pressed="${partSel.has(p)}">${p} <span style="color:var(--muted)">${ALL.filter(q => q.part === p).length}</span></button>`).join('')}</div>
    <div class="row">
      <button class="btn" id="mix" ${pool.length ? '' : 'disabled'}>선택한 단락에서 랜덤 ${Math.min(20, pool.length)}문항</button>
      <button class="btn ghost" id="mixall" ${pool.length ? '' : 'disabled'}>선택한 단락 전부 (${pool.length}문항)</button>
    </div>
    <h2>오답노트</h2>
    ${wrong.size ? `<div class="row"><button class="btn" id="wrongs">틀린 문제 다시 풀기 (${wrong.size}문항)</button><button class="btn ghost" id="clearw">오답노트 비우기</button></div>`
      : `<div class="empty">아직 틀린 문제가 없어요. 문제를 풀다 틀리면 여기에 모여요. (맞히면 자동으로 빠져요)</div>`}
    <p class="hint" style="margin-top:22px">점검퀴즈 2 범위: 28b~42a (여담 · 맺는 말 · 둘째 연설 · 셋째 연설, 끝까지). 대비 1~3회는 부분별, 4~8회는 전 범위 종합. 5지선다, ⑤ 답 없음.</p>`;
  app.querySelectorAll('.set').forEach(b => b.onclick = () => start(SETS.find(s => s.id === b.dataset.set).title, SETS.find(s => s.id === b.dataset.set).qs, b.dataset.set));
  app.querySelectorAll('.chip').forEach(b => b.onclick = () => { const p = b.dataset.part; partSel.has(p) ? partSel.delete(p) : partSel.add(p); store.set('parts', [...partSel]); home(); });
  $('#m-practice').onclick = () => { mode = 'practice'; store.set('mode', mode); home(); };
  $('#m-exam').onclick = () => { mode = 'exam'; store.set('mode', mode); home(); };
  const mix = $('#mix'); if (mix) mix.onclick = () => start('단락별 랜덤', shuffle(pool).slice(0, 20));
  const mixall = $('#mixall'); if (mixall) mixall.onclick = () => start('단락별 전체', pool);
  const w = $('#wrongs'); if (w) w.onclick = () => start('오답노트', ALL.filter(q => wrong.has(q.id)));
  const cw = $('#clearw'); if (cw) cw.onclick = () => { if (cw.dataset.sure) { wrong.clear(); saveWrong(); home(); } else { cw.dataset.sure = 1; cw.textContent = '한 번 더 누르면 비워져요'; } };
}

function start(title, qs, setId) {
  S = { title, qs, setId, i: 0, picks: Array(qs.length).fill(null), done: false, t0: Date.now(), mode };
  location.hash = 'solve';
  render();
}

function render() {
  if (!S) return home();
  if (S.done) return result();
  const q = S.qs[S.i], pick = S.picks[S.i];
  const reveal = S.mode === 'practice' && pick != null;
  const dots = S.qs.map((qq, k) => {
    let c = 'dot';
    if (k === S.i) c += ' cur';
    const p = S.picks[k];
    if (p != null) c += S.mode === 'practice' ? (isRight(qq, p) ? ' ok' : ' bad') : ' done';
    return `<button class="${c}" data-k="${k}" aria-label="${k + 1}번">${k + 1}</button>`;
  }).join('');
  const opts = q.o.map((t, k) => {
    const n = k + 1;
    let c = 'opt';
    if (reveal) { if (q.a.includes(n)) c += ' right'; else if (pick === n) c += ' wrong'; }
    else if (pick === n) c += ' sel';
    return `<button class="${c}" data-n="${n}" ${reveal ? 'disabled' : ''}><span class="no">${C[k]}</span><span>${t}</span></button>`;
  }).join('');
  const answered = S.picks.filter(p => p != null).length;
  const ans = q.a.map(n => C[n - 1]).join(', ');
  app.innerHTML = `
    <div class="bar"><span class="ttl">${esc(S.title)}</span><span class="meta">${answered}/${S.qs.length} 풀이 · <span id="clock"></span> · ${S.mode === 'practice' ? '연습' : '시험'}</span></div>
    <div class="dots">${dots}</div>
    <div class="card">
      <div class="qhead"><span class="badge">문제 ${S.i + 1}</span><span class="star">${stars(q.s)}</span><span class="tag">${q.part}</span><span class="tag">${esc(q.src)}</span></div>
      <div class="qt">${q.q}</div>
      ${q.box ? `<div class="box">${q.box}</div>` : ''}
      <div class="opts">${opts}</div>
      ${reveal ? `<div class="fb">
        <div class="verdict ${isRight(q, pick) ? 'ok' : 'bad'}">${isRight(q, pick) ? '정답!' : '오답'} · 정답 ${ans}${q.a.length > 1 ? ' (복수 정답)' : ''}</div>
        <div class="ex">${q.e}</div>${q.w ? `<div class="wr"><b class="l">오답 체크</b> ${q.w}</div>` : ''}</div>` : ''}
    </div>
    <div class="nav">
      <button class="btn ghost" id="quit">그만 풀기</button>
      <div class="row" style="margin:0">
        <button class="btn ghost" id="prev" ${S.i === 0 ? 'disabled' : ''}>이전</button>
        ${S.i < S.qs.length - 1 ? `<button class="btn" id="next">다음</button>` : (S.back ? '' : `<button class="btn" id="submit">${S.mode === 'exam' ? '제출하고 채점' : '결과 보기'}</button>`)}
      </div>
    </div>`;
  app.querySelectorAll('.dot').forEach(b => b.onclick = () => { S.i = +b.dataset.k; render(); });
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    if (reveal) return;
    const n = +b.dataset.n;
    S.picks[S.i] = (S.mode === 'exam' && S.picks[S.i] === n) ? null : n;
    if (S.mode === 'practice') mark(q, n);
    render();
  });
  $('#quit').textContent = S.back ? '결과로 돌아가기' : '그만 풀기';
  $('#quit').onclick = () => { if (S.back) { S = S.back; render(); } else if (S.picks.some(p => p != null)) finish(); else home(); };
  $('#prev').onclick = () => { S.i--; render(); };
  const nx = $('#next'); if (nx) nx.onclick = () => { S.i++; render(); window.scrollTo(0, 0); };
  const sb = $('#submit'); if (sb) sb.onclick = () => {
    const left = S.picks.filter(p => p == null).length;
    if (S.mode === 'exam' && left && !sb.dataset.sure) { sb.dataset.sure = 1; sb.textContent = `안 푼 문제 ${left}개 — 그래도 제출`; return; }
    finish();
  };
  tick();
}

function mark(q, n) { if (isRight(q, n)) wrong.delete(q.id); else wrong.add(q.id); saveWrong(); }

function finish() {
  if (S.mode === 'exam') S.qs.forEach((q, k) => { if (S.picks[k] != null) mark(q, S.picks[k]); });
  S.done = true; S.secs = Math.round((Date.now() - S.t0) / 1000);
  const sc = S.qs.filter((q, k) => isRight(q, S.picks[k])).length;
  if (S.setId && S.picks.every(p => p != null)) { best[S.setId] = Math.max(best[S.setId] || 0, sc); store.set('best', best); }
  render();
}

function result() {
  const sc = S.qs.filter((q, k) => isRight(q, S.picks[k])).length;
  const parts = PARTS.filter(p => S.qs.some(q => q.part === p)).map(p => {
    const qs = S.qs.map((q, k) => [q, k]).filter(([q]) => q.part === p);
    const ok = qs.filter(([q, k]) => isRight(q, S.picks[k])).length;
    return `<div class="bp">${p}<b>${ok}/${qs.length}</b></div>`;
  }).join('');
  const items = S.qs.map((q, k) => {
    const ok = isRight(q, S.picks[k]), p = S.picks[k];
    return `<button class="li" data-k="${k}"><span class="mk ${ok ? 'ok' : 'bad'}">${ok ? 'O' : 'X'}</span><span class="tx">${k + 1}. ${q.q.replace(/<[^>]+>/g, '')}
      <small>내 답 ${p ? C[p - 1] : '안 풂'} · 정답 ${q.a.map(n => C[n - 1]).join(', ')} · ${q.part}</small></span></button>`;
  }).join('');
  const m = Math.floor(S.secs / 60), s = S.secs % 60;
  const wrongs = S.qs.filter((q, k) => !isRight(q, S.picks[k]));
  app.innerHTML = `
    <div class="bar"><span class="ttl">${esc(S.title)} · 결과</span><span class="meta">걸린 시간 ${m}분 ${s}초</span></div>
    <div class="card">
      <div class="score"><span class="big">${sc}</span><span class="of">/ ${S.qs.length}문항 맞힘 · ${Math.round(sc / S.qs.length * 100)}점</span></div>
      <div class="byPart">${parts}</div>
      <div class="row">
        ${wrongs.length ? `<button class="btn" id="redo">틀린 ${wrongs.length}문항만 다시</button>` : ''}
        <button class="btn ghost" id="again">처음부터 다시</button>
        <button class="btn ghost" id="home">목록으로</button>
      </div>
    </div>
    <h2>문항별 확인 (누르면 해설)</h2>
    <div class="list">${items}</div>`;
  app.querySelectorAll('.li').forEach(b => b.onclick = () => review(+b.dataset.k));
  const r = $('#redo'); if (r) r.onclick = () => start(S.title + ' · 오답', wrongs);
  $('#again').onclick = () => start(S.title, S.qs, S.setId);
  $('#home').onclick = home;
}

function review(k) {
  const prev = S;
  S = { title: prev.title + ' · 해설', qs: prev.qs, setId: null, i: k, picks: prev.picks.slice(), done: false, t0: Date.now(), mode: 'practice', back: prev };
  // 해설 보기: 연습 모드로 열어 정답과 해설이 바로 보이게 (안 푼 문제는 선택 시 채점)
  location.hash = 'solve';
  render();
}

let timer;
function tick() {
  clearInterval(timer);
  const f = () => { const el = $('#clock'); if (!el || !S) return clearInterval(timer); const t = Math.round((Date.now() - S.t0) / 1000); el.textContent = `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`; };
  f(); timer = setInterval(f, 1000);
}

window.addEventListener('hashchange', () => { if (location.hash !== '#solve' && S) home(); });
document.addEventListener('keydown', e => {
  if (!S || S.done) return;
  if (['1','2','3','4','5'].includes(e.key)) { const b = app.querySelector(`.opt[data-n="${e.key}"]`); if (b && !b.disabled) b.click(); }
  if (e.key === 'ArrowRight') { const b = $('#next'); if (b) b.click(); }
  if (e.key === 'ArrowLeft') { const b = $('#prev'); if (b && !b.disabled) b.click(); }
});
home();

</script>
