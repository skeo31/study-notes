<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Notes</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Noto Sans KR', sans-serif; background: #0d1117; color: #e6edf3; min-height: 100vh; padding: 40px 24px 80px; }
  .wrap { max-width: 880px; margin: 0 auto; }
  header { text-align: center; padding: 40px 0 50px; border-bottom: 1px solid #30404d; margin-bottom: 40px; }
  h1 { font-size: 2.4rem; font-weight: 900; background: linear-gradient(135deg, #58a6ff, #d2a8ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .subtitle { color: #8b949e; margin-top: 12px; font-size: 1rem; }
  .subject { margin-bottom: 16px; border-radius: 16px; overflow: hidden; border: 1px solid #30404d; }
  .subject-header { display: flex; align-items: center; gap: 14px; padding: 20px 24px; cursor: pointer; background: #1e2535; user-select: none; }
  .subject-icon { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 0.95rem; color: #0d1117; font-family: 'JetBrains Mono', monospace; flex-shrink: 0; }
  .subject-name { font-size: 1.2rem; font-weight: 700; flex: 1; color: #e6edf3; }
  .subject-count { color: #8b949e; font-size: 0.85rem; font-family: 'JetBrains Mono', monospace; margin-right: 8px; }
  .subject-arrow { color: #8b949e; font-size: 1rem; transition: transform 0.25s; display: inline-block; }
  .subject.open .subject-arrow { transform: rotate(90deg); }
  .files { display: none; flex-direction: column; gap: 10px; background: #0d1117; padding: 16px; border-top: 1px solid #30404d; }
  .subject.open .files { display: flex; }
  .empty { color: #8b949e; font-style: italic; padding: 8px 4px; }
  .loading { text-align: center; color: #8b949e; padding: 40px; }
  footer { text-align: center; margin-top: 48px; padding-top: 28px; border-top: 1px solid #30404d; color: #8b949e; font-size: 0.85rem; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📚 Study Notes</h1>
    <p class="subtitle">학습 자료 모음</p>
  </header>
  <div id="content"><div class="loading">불러오는 중...</div></div>
  <footer>과목을 눌러 파일 목록을 확인하세요</footer>
</div>
<script>
  var SUBJECTS = [
    { key: "stats",  name: "확률과 통계",             color: "#58a6ff", label: "ST" },
    { key: "calc",   name: "미적분",                   color: "#ffa657", label: "CA" },
    { key: "cprog",  name: "C 프로그래밍",             color: "#f78166", label: "C"  },
    { key: "python", name: "고급 프로그래밍 (Python)", color: "#3fb950", label: "PY" },
    { key: "ethics", name: "AI 윤리",                  color: "#d2a8ff", label: "AI" }
  ];

function makeFileCard(href, title) {
var a = document.createElement(“a”);
a.href = href;
// 인라인 스타일로 강제 적용
a.style.cssText = [
“display:flex”,
“align-items:center”,
“gap:14px”,
“padding:16px 20px”,
“background:#1e2535”,
“border:1px solid #30404d”,
“border-radius:12px”,
“text-decoration:none”,
“color:#e6edf3”,
“-webkit-text-fill-color:#e6edf3”
].join(”;”);

```
var titleSpan = document.createElement("span");
titleSpan.textContent = title;
titleSpan.style.cssText = "flex:1;font-weight:500;font-size:1rem;color:#e6edf3;-webkit-text-fill-color:#e6edf3;";

var arrow = document.createElement("span");
arrow.textContent = "→";
arrow.style.cssText = "color:#8b949e;font-size:1rem;";

a.appendChild(titleSpan);
a.appendChild(arrow);
return a;
```

}

function fallback(f) { return f.replace(/.html$/, “”).replace(/[-_]+/g, “ “); }

fetch(”./manifest.json”).then(function(r){ return r.json(); }).then(function(manifest){
var container = document.getElementById(“content”);
container.innerHTML = “”;

```
SUBJECTS.forEach(function(subject) {
  var files = manifest[subject.key] || [];

  var section = document.createElement("div");
  section.className = "subject";

  var header = document.createElement("div");
  header.className = "subject-header";
  header.innerHTML =
    '<div class="subject-icon" style="background:' + subject.color + '">' + subject.label + '</div>' +
    '<span class="subject-name">' + subject.name + '</span>' +
    '<span class="subject-count">' + files.length + ' files</span>' +
    '<span class="subject-arrow">▶</span>';
  header.onclick = function() { section.classList.toggle("open"); };

  var filesDiv = document.createElement("div");
  filesDiv.className = "files";

  if (files.length === 0) {
    filesDiv.innerHTML = '<div class="empty">아직 파일이 없습니다</div>';
  } else {
    files.forEach(function(item) {
      filesDiv.appendChild(makeFileCard(subject.key + "/" + item.file, item.title || fallback(item.file)));
    });
  }

  section.appendChild(header);
  section.appendChild(filesDiv);
  container.appendChild(section);
});
```

}).catch(function(){
document.getElementById(“content”).innerHTML = ‘<div class="empty">manifest.json을 불러오지 못했습니다.</div>’;
});
</script>

</body>
</html>
