<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>기출 모의고사 · 중간 + 기말</title>
<style>
:root{--bg:#0f1115;--panel:#171a21;--panel2:#1e2230;--line:#2a2f3d;--txt:#e7e9ee;--muted:#9aa3b2;--accent:#6ea8fe;--accent2:#7c5cff;--ok:#46c08a;--bad:#ef6a6a;--warn:#e0b341}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:'Pretendard','Noto Sans KR',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;line-height:1.6}
.wrap{max-width:880px;margin:0 auto;padding:18px 16px 90px}
header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,rgba(15,17,21,.98),rgba(15,17,21,.92));backdrop-filter:blur(6px);padding:14px 0 10px;border-bottom:1px solid var(--line)}
h1{font-size:20px;margin:0 0 4px;font-weight:800;letter-spacing:-.3px}
.sub{color:var(--muted);font-size:12.5px;margin:0;line-height:1.5}
.note{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:8px;padding:9px 12px;margin:12px 0;font-size:12.5px;color:#d7d2b8}
.modes{display:flex;gap:8px;margin:12px 0 6px}
.mode{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:11px;cursor:pointer;font-weight:800;font-size:14px;text-align:center;transition:.12s}
.mode small{display:block;font-weight:600;font-size:11px;opacity:.8;margin-top:2px}
.mode.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
.btn{background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:9px 14px;font-size:13.5px;cursor:pointer;font-weight:700;transition:.12s}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#fff}
.btn.ghost{background:transparent}
.score{margin-left:auto;font-weight:800;font-size:14px}
.q{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 15px;margin:11px 0}
.qhead{display:flex;align-items:center;gap:7px;margin-bottom:8px;flex-wrap:wrap}
.qnum{font-weight:800;font-size:14px;color:var(--accent)}
.badge{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:20px;border:1px solid var(--line);background:var(--panel2);color:var(--muted)}
.qtext{font-size:15px;font-weight:600;margin:2px 0 10px;white-space:pre-wrap}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{display:flex;gap:9px;align-items:flex-start;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 11px;cursor:pointer;font-size:14px;transition:.1s}
.opt:hover{border-color:var(--accent)}
.opt input{margin-top:3px;accent-color:var(--accent);flex:none}
.opt.correct{border-color:var(--ok);background:rgba(70,192,138,.12)}
.opt.wrong{border-color:var(--bad);background:rgba(239,106,106,.12)}
.opt .onum{font-weight:700;color:var(--muted);flex:none}
.fillin{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px 12px;color:var(--txt);font-size:14px;font-family:inherit}
.fillin.correct{border-color:var(--ok)}.fillin.wrong{border-color:var(--bad)}
.expl{display:none;margin-top:10px;padding:10px 12px;background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--ok);border-radius:8px;font-size:13px;color:#cfe9dd}
.expl.show{display:block}.expl b{color:var(--ok)}
.essay textarea{width:100%;min-height:90px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px 12px;color:var(--txt);font-size:14px;font-family:inherit;resize:vertical;margin-top:6px}
.model{display:none;margin-top:10px;padding:11px 13px;background:rgba(124,92,255,.10);border:1px solid var(--line);border-left:3px solid var(--accent2);border-radius:8px;font-size:13.5px;white-space:pre-wrap;line-height:1.7}
.model.show{display:block}.model b{color:#b3a0ff}
.footnote{color:var(--muted);font-size:11.5px;text-align:center;margin-top:24px;line-height:1.6}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--accent2);color:#fff;padding:11px 18px;border-radius:30px;font-weight:700;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:50}
.toast.show{opacity:1}
</style></head><body>
<div class="wrap">
<header>
  <h1>📜 기출 모의고사 · 중간 + 기말</h1>
  <p class="sub">실제 기출 문제 그대로 수록 · 시험범위(강의)에 포함된 문항만</p>
</header>
<div class="note">
  ※ 네가 준 <b>중간·기말 기출 원문</b>을 그대로 수록(정답은 기출 표기 기준) · <b>공리주의·의무론·결과주의 등 강의 미포함 문항은 제외</b>했어
</div>
<div class="modes">
  <div class="mode active" data-set="mid">중간고사 기출<small>정보사회·윤리학·덕윤리·익명성·사이버범죄</small></div>
  <div class="mode" data-set="fin">기말고사 기출<small>사이버 윤리 실천 전반</small></div>
</div>
<div class="bar">
  <button class="btn primary" id="grade">📝 채점하기</button>
  <button class="btn" id="reveal">정답·해설 보기</button>
  <button class="btn ghost" id="reset">다시 풀기</button>
  <span class="score" id="score"></span>
</div>
<div id="quiz"></div>
<p class="footnote">출처: 정보사회와 사이버 윤리 중간·기말 기출 · 강의 범위 외(공리주의·의무론·결과주의) 문항 제외</p>
</div>
<div class="toast" id="toast"></div>

let cur="mid";
const state={mid:{},fin:{}};
const quiz=document.getElementById('quiz');
function typeLabel(t){return t==='mc'?'5지선다':t==='tf'?'참/거짓':t==='fill'?'빈칸단답':'서술형'}
function answerText(it){if(it.t==='mc')return '①②③④⑤'[it.a]+' '+it.o[it.a];if(it.t==='tf')return it.a?'참(O)':'거짓(X)';return it.a}
function render(){
  const list=QUIZ[cur];const a=state[cur];let html='';
  list.forEach((it,i)=>{
    if(it.t==='essay'){
      html+='<div class="q essay"><div class="qhead"><span class="qnum">'+it.n+'.</span><span class="badge">서술형</span></div><div class="qtext" style="color:#ffd98a">'+it.q+'</div>';
      html+='<textarea data-essay="'+i+'" placeholder="여기에 답안을 작성해 보세요">'+(a['e'+i]||'')+'</textarea>';
      html+='<div style="margin-top:8px"><button class="btn ghost mb" data-mi="'+i+'">모범답안 보기</button></div>';
      html+='<div class="model" data-model="'+i+'"><b>모범답안</b><br>'+it.model+'</div></div>';return;
    }
    html+='<div class="q" data-qi="'+i+'"><div class="qhead"><span class="qnum">'+it.n+'.</span><span class="badge">'+typeLabel(it.t)+'</span></div>';
    html+='<div class="qtext">'+it.q+'</div>';
    if(it.t==='mc'){html+='<div class="opts">';it.o.forEach((o,oi)=>{html+='<label class="opt" data-oi="'+oi+'"><input type="radio" name="q'+i+'" value="'+oi+'"'+(a[i]===oi?' checked':'')+'><span class="onum">'+'①②③④⑤'[oi]+'</span><span>'+o+'</span></label>'});html+='</div>';}
    else if(it.t==='tf'){['참','거짓'].forEach((o,oi)=>{const v=oi===0;html+='<label class="opt" data-tf="'+v+'"><input type="radio" name="q'+i+'" value="'+v+'"'+(a[i]===v?' checked':'')+'><span class="onum">'+(oi===0?'O':'X')+'</span><span>'+o+'</span></label>'});}
    else {html+='<input class="fillin" data-fill="'+i+'" placeholder="정답 입력" value="'+String(a[i]!=null?a[i]:'').replace(/"/g,'&quot;')+'">';}
    html+='<div class="expl" data-expl="'+i+'"><b>정답:</b> '+answerText(it)+'<br>'+it.e+'</div></div>';
  });
  quiz.innerHTML=html;bind();
  document.getElementById('score').textContent='';
  window.scrollTo({top:0,behavior:'smooth'});
}
function bind(){
  quiz.querySelectorAll('input[type=radio]').forEach(r=>r.onchange=e=>{const i=+e.target.closest('.q').dataset.qi;let v=e.target.value;v=v==='true'?true:v==='false'?false:+v;state[cur][i]=v});
  quiz.querySelectorAll('input[data-fill]').forEach(f=>f.oninput=e=>state[cur][+e.target.dataset.fill]=e.target.value);
  quiz.querySelectorAll('textarea[data-essay]').forEach(t=>t.oninput=e=>state[cur]['e'+e.target.dataset.essay]=e.target.value);
  quiz.querySelectorAll('.mb').forEach(b=>b.onclick=()=>quiz.querySelector('[data-model="'+b.dataset.mi+'"]').classList.toggle('show'));
}
function norm(s){return String(s||'').replace(/\s|[()·,.'"’‘〈〉]/g,'').toLowerCase()}
function gradeOne(it,v){if(v==null||v==='')return null;if(it.t==='fill')return norm(v)===norm(it.a)||(norm(it.a).includes(norm(v))&&norm(v).length>=2);return v===it.a}
function grade(){
  const list=QUIZ[cur];const a=state[cur];let ok=0,tot=0;
  list.forEach((it,i)=>{
    if(it.t==='essay')return;tot++;
    const el=quiz.querySelector('.q[data-qi="'+i+'"]');const res=gradeOne(it,a[i]);
    if(it.t==='fill'){const inp=el.querySelector('.fillin');inp.classList.remove('correct','wrong');if(res===true){inp.classList.add('correct');ok++}else if(res===false)inp.classList.add('wrong');}
    else{el.querySelectorAll('.opt').forEach(o=>{o.classList.remove('correct','wrong');const oi=it.t==='mc'?+o.dataset.oi:(o.dataset.tf==='true');if(oi===it.a)o.classList.add('correct');if(a[i]===oi&&oi!==it.a)o.classList.add('wrong')});if(res===true)ok++;}
    el.querySelector('[data-expl="'+i+'"]').classList.add('show');
  });
  const pct=tot?Math.round(ok/tot*100):0;
  document.getElementById('score').textContent='객관식·단답 '+ok+' / '+tot+'  ('+pct+'%)';
  toast('채점 완료! '+ok+'/'+tot+' ('+pct+'%)');
}
function reveal(){quiz.querySelectorAll('.expl').forEach(e=>e.classList.add('show'));quiz.querySelectorAll('.model').forEach(e=>e.classList.add('show'));
  QUIZ[cur].forEach((it,i)=>{if(it.t==='essay')return;const el=quiz.querySelector('.q[data-qi="'+i+'"]');if(it.t==='fill')el.querySelector('.fillin').classList.add('correct');else el.querySelectorAll('.opt').forEach(o=>{const oi=it.t==='mc'?+o.dataset.oi:(o.dataset.tf==='true');if(oi===it.a)o.classList.add('correct')})});}
function reset(){state[cur]={};render();toast('초기화했습니다')}
document.querySelectorAll('.mode').forEach(m=>m.onclick=()=>{document.querySelectorAll('.mode').forEach(x=>x.classList.remove('active'));m.classList.add('active');cur=m.dataset.set;render()});
document.getElementById('grade').onclick=grade;document.getElementById('reveal').onclick=reveal;document.getElementById('reset').onclick=reset;
let tt;function toast(m){const el=document.getElementById('toast');el.textContent=m;el.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('show'),2200)}
render();
</script></body></html>
